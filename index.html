          const savings = net >= 0;
          return `<div style="display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer" onclick="selectMonth('${m}')">
            <div style="flex:0 0 44px;font-size:11px;color:var(--text-muted);text-align:right">${fmtMonth(m).replace(' ' + budgetSelectedYear, '')}</div>
            <div style="flex:1;display:flex;flex-direction:column;gap:3px">
              <div style="display:flex;align-items:center;gap:4px">
                <div style="height:6px;border-radius:3px;background:#16a34a;width:${(inc / maxAbs) * 100}%;min-width:${inc > 0 ? 2 : 0}px"></div>
                <span style="font-size:10px;color:#16a34a">+${fmtAUD(inc)}</span>
              </div>
              <div style="display:flex;align-items:center;gap:4px">
                <div style="height:6px;border-radius:3px;background:var(--accent);width:${(exp / maxAbs) * 100}%;min-width:${exp > 0 ? 2 : 0}px"></div>
                <span style="font-size:10px;color:var(--accent)">−${fmtAUD(exp)}</span>
              </div>
            </div>
            <div style="flex:0 0 70px;text-align:right;font-size:11px;font-weight:600;color:${savings ? '#16a34a' : '#ef4444'}">${savings ? '+' : '−'}${fmtAUD(Math.abs(net))}</div>
          </div>`;
        }).join('');
        savingsPanel = `<div style="margin-bottom:16px">
          <div class="budget-section-title" style="margin-bottom:10px">Monthly savings — ${budgetSelectedYear}</div>
          <div class="budget-panel-box" style="padding:8px 16px">${rows}</div>
        </div>`;
      }

      // Annual summary panel (shown when year selected but no specific month)
      let annualSummaryPanel = '';
      if (budgetSelectedYear && !budgetSelectedMonth) {
        const mdata = allMonths().filter(m => m.startsWith(budgetSelectedYear)).map(m => {
          let mTxs = budgetTransactions.filter(t => t.month === m);
          if (budgetSelectedAccount) mTxs = mTxs.filter(t => t.account === budgetSelectedAccount);
          mTxs = mTxs.filter(t => effectiveCat(t) !== 'Uncategorised');
          const inc = mTxs.reduce((s, t) => s + t.credit, 0);
          const exp = mTxs.reduce((s, t) => s + t.debit, 0);
          return { m, inc, exp, net: inc - exp };
        }).filter(d => d.inc > 0 || d.exp > 0);
        if (mdata.length >= 2) {
          const best = mdata.reduce((b, d) => d.net > b.net ? d : b);
          const worst = mdata.reduce((w, d) => d.net < w.net ? d : w);
          const avgSav = mdata.reduce((s, d) => s + d.net, 0) / mdata.length;
          annualSummaryPanel = `<div style="margin-bottom:16px">
            <div class="budget-section-title" style="margin-bottom:10px">${budgetSelectedYear} summary</div>
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
              <div class="budget-panel-box">
                <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Best month</div>
                <div style="font-size:14px;font-weight:600;color:var(--text-primary)">${fmtMonth(best.m)}</div>
                <div style="font-size:13px;color:#16a34a;font-weight:600">+${fmtAUD(best.net)}</div>
              </div>
              <div class="budget-panel-box">
                <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Worst month</div>
                <div style="font-size:14px;font-weight:600;color:var(--text-primary)">${fmtMonth(worst.m)}</div>
                <div style="font-size:13px;font-weight:600;color:${worst.net < 0 ? '#ef4444' : '#16a34a'}">${worst.net >= 0 ? '+' : '−'}${fmtAUD(Math.abs(worst.net))}</div>
              </div>
              <div class="budget-panel-box">
                <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em">Avg monthly savings</div>
                <div style="font-size:20px;font-weight:700;color:${avgSav >= 0 ? '#16a34a' : '#ef4444'}">${avgSav >= 0 ? '+' : '−'}${fmtAUD(Math.abs(avgSav))}</div>
              </div>
            </div>
          </div>`;
        }
      }

      // Previous month category totals for month-over-month deltas
      let prevMonthCats = null;
      if (budgetSelectedMonth) {
        const [y, mo] = budgetSelectedMonth.split('-').map(Number);
        const pd = new Date(y, mo - 2, 1);
        const prevMonth = `${pd.getFullYear()}-${String(pd.getMonth() + 1).padStart(2, '0')}`;
        let prevTxs = budgetTransactions.filter(t => t.month === prevMonth);
        if (budgetSelectedAccount) prevTxs = prevTxs.filter(t => t.account === budgetSelectedAccount);
        prevMonthCats = Object.fromEntries(catSpending(prevTxs));
      }

      const cats = catSpending(txs);
      const maxCat = cats[0]?.[1] || 1;
      const avgCat = budgetSelectedMonth ? avgMonthlyCatSpending() : null;
      const catRows = cats.map(([cat, amt]) => {
        const lim = budgetLimits[cat];
        const over = lim && amt > lim;
        const esc = cat.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const isSelected = budgetSelectedCategory === cat;
        const avg = avgCat?.[cat];
        const pct = avg ? Math.round((amt - avg) / avg * 100) : null;
        const vsAvg = avg != null
          ? `<div style="flex:0 0 90px;text-align:right;font-size:11px;color:${pct > 10 ? '#ef4444' : pct < -10 ? '#22c55e' : 'var(--text-muted)'}">
              ${pct > 0 ? '↑' : pct < 0 ? '↓' : '≈'}${Math.abs(pct)}% vs avg
            </div>`
          : '<div style="flex:0 0 90px"></div>';
        const color = catColor(cat);
        return `<div class="budget-bar-row" onclick="selectCategory('${esc}')" style="cursor:pointer;border-left:3px solid ${isSelected ? color : 'transparent'};padding-left:${isSelected ? '13px' : '0'}${isSelected ? ';background:var(--bg-secondary);margin:0 -16px;padding:6px 16px 6px 13px;border-radius:4px' : ''}">
          <div style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0"></div>
          <div class="budget-bar-label" title="${cat}" style="font-weight:${isSelected ? '600' : '400'}">${cat}</div>
          <div class="budget-bar-wrap"><div class="budget-bar${over ? ' over' : ''}" style="width:${(amt / maxCat) * 100}%;background:${over ? '#ef4444' : color}"></div></div>
          <div class="budget-bar-amount">${fmtAUD(amt)}</div>
          <div class="budget-bar-extra">${lim
            ? `<span class="${over ? 'over' : 'under'}">${over ? '⚠ ' : ''}/ ${fmtAUD(lim)}</span>`
            : `<button class="set-limit-btn" onclick="event.stopPropagation();setLimit('${esc}')">Set limit</button>`
          }</div>
          ${avgCat ? vsAvg : ''}
        </div>`;
      }).join('');
      const catPanel = sec('cat', 'Spending by category', `<div class="budget-panel-box">${catRows || noData()}</div>`);

      // Income sources breakdown for overview comparison
      const incSrc = {};
      txs.filter(t => t.credit > 0).forEach(t => {
        const key = t.vendor || t.narrative.trim().slice(0, 35);
        if (key) incSrc[key] = (incSrc[key] || 0) + t.credit;
      });
      const incSrcList = Object.entries(incSrc).sort((a, b) => b[1] - a[1]).slice(0, 20);
      const maxIncSrc = incSrcList[0]?.[1] || 1;
      const incSrcRows = incSrcList.map(([name, amt]) => {
        const esc = name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const isSel = budgetSelectedIncomeSource === name;
        return `<div class="budget-bar-row" onclick="selectIncomeSource('${esc}')" style="cursor:pointer${isSel ? ';background:var(--bg-secondary);margin:0 -16px;padding:4px 16px;border-radius:4px;border-left:3px solid #16a34a' : ''}">
          <div class="budget-bar-label" title="${name}" style="font-weight:${isSel ? '600' : '400'}">${name}</div>
          <div class="budget-bar-wrap"><div class="budget-bar" style="width:${(amt/maxIncSrc)*100}%;background:#16a34a"></div></div>
          <div class="budget-bar-amount" style="color:#16a34a">+${fmtAUD(amt)}</div>
        </div>`;
      }).join('');

      // Simple outgoings rows with month-over-month delta when a specific month is selected
      const outRows = cats.map(([cat, amt]) => {
        const esc = cat.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const color = catColor(cat);
        const isSel = budgetSelectedCategory === cat;
        const prev = prevMonthCats?.[cat];
        const delta = prev != null ? amt - prev : null;
        const deltaHtml = delta != null
          ? `<span style="font-size:10px;font-weight:600;color:${delta > 50 ? '#ef4444' : delta < -50 ? '#22c55e' : 'var(--text-muted)'}">
              ${delta > 0 ? '↑' : delta < 0 ? '↓' : '≈'}${fmtAUD(Math.abs(delta))}
            </span>`
          : '';
        return `<div class="budget-bar-row" onclick="selectOverviewCategory('${esc}')" style="cursor:pointer${isSel ? `;background:var(--bg-secondary);margin:0 -16px;padding:4px 16px;border-radius:4px;border-left:3px solid ${color}` : ''}">
          <div style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0"></div>
          <div class="budget-bar-label" title="${cat}" style="font-weight:${isSel ? '600' : '400'}">${cat}</div>
          <div class="budget-bar-wrap"><div class="budget-bar" style="width:${(amt/maxCat)*100}%;background:${color}"></div></div>
          <div class="budget-bar-amount">${fmtAUD(amt)}</div>
          ${deltaHtml}
        </div>`;
      }).join('');

      const comparePanel = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
        <div>
          <div class="budget-section-title" style="margin-bottom:10px;color:#16a34a">Incomings <span style="font-size:12px;font-weight:400;color:var(--text-muted)">${fmtAUD(totalInc)}</span></div>
          <div class="budget-panel-box">${incSrcRows || '<div style="padding:16px;color:var(--text-muted);font-size:13px;text-align:center">No income</div>'}</div>
        </div>
        <div>
          <div class="budget-section-title" style="margin-bottom:10px;color:var(--accent)">Outgoings <span style="font-size:12px;font-weight:400;color:var(--text-muted)">${fmtAUD(totalExp)}</span></div>
          <div class="budget-panel-box">${outRows || noData()}</div>
        </div>
      </div>`;

      const merch = topMerchants(txs);
      const maxMerch = merch[0]?.[1] || 1;
      // Group by category, sorted by category total descending
      const merchByCat = {};
      merch.forEach(([name, amt, cat]) => {
        if (!merchByCat[cat]) merchByCat[cat] = [];
        merchByCat[cat].push([name, amt]);
      });
      const sortedCats = Object.entries(merchByCat)
        .map(([cat, items]) => [cat, items.reduce((s, [, a]) => s + a, 0), items])
        .sort((a, b) => b[1] - a[1]);
      let rank = 1;
      const merchRows = sortedCats.map(([cat, , items]) => {
        const catEsc = cat.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const isSelCat = budgetSelectedCategory === cat;
        const cc = catColor(cat);
        const heading = `<div onclick="selectCategory('${catEsc}')" style="cursor:pointer;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;color:${isSelCat ? cc : 'var(--text-muted)'};text-transform:uppercase;letter-spacing:0.07em;padding:10px 0 4px;border-bottom:2px solid ${isSelCat ? cc : 'var(--border-light)'};user-select:none">
          <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${cc};flex-shrink:0"></span>${cat}${isSelCat ? ' ✕' : ''}
        </div>`;
        const rows = items.map(([name, amt]) => `<div class="budget-bar-row">
          <div class="budget-rank">${rank++}</div>
          <div class="budget-bar-label" style="flex:0 0 140px" title="${name}">${name}</div>
          <div class="budget-bar-wrap"><div class="budget-bar blue" style="width:${(amt / maxMerch) * 100}%"></div></div>
          <div class="budget-bar-amount">${fmtAUD(amt)}</div>
        </div>`).join('');
        return heading + rows;
      }).join('');
      const merchPanel = sec('merch', 'Top merchants', `<div class="budget-panel-box">${merchRows || noData()}</div>`);

      const monthly = monthlyTotals();
      const maxM = Math.max(...monthly.map(([, d]) => Math.max(d.inc, d.exp)), 1);
      const H = 80;
      const trendBars = monthly.map(([m, d]) => {
        const iH = Math.round((d.inc / maxM) * H);
        const eH = Math.round((d.exp / maxM) * H);
        return `<div class="budget-trend-group${m === budgetSelectedMonth ? ' selected' : ''}" onclick="selectMonth('${m}')">
          <div class="budget-trend-bars">
            <div class="budget-trend-bar income" style="height:${iH}px" title="Income ${fmtAUD(d.inc)}"></div>
            <div class="budget-trend-bar expense" style="height:${eH}px" title="Expenses ${fmtAUD(d.exp)}"></div>
          </div>
          <div class="budget-trend-month">${fmtMonth(m).split(' ')[0]}</div>
        </div>`;
      }).join('');
      const legend = `<span style="margin-left:12px;font-size:11px;font-weight:400;color:var(--text-muted)">
          <span style="display:inline-block;width:10px;height:10px;background:#16a34a;border-radius:2px;opacity:.75;margin-right:3px;vertical-align:middle"></span>Income
          <span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;opacity:.75;margin:0 3px 0 8px;vertical-align:middle"></span>Expenses
        </span>`;

      const annual = annualTotals();
      const maxA = Math.max(...annual.map(([, d]) => Math.max(d.inc, d.exp)), 1);
      const annualBars = annual.map(([yr, d]) => {
        const iH = Math.round((d.inc / maxA) * H);
        const eH = Math.round((d.exp / maxA) * H);
        const isSelected = budgetSelectedYear === yr;
        return `<div class="budget-trend-group${isSelected ? ' selected' : ''}" onclick="selectYear('${yr}')">
          <div class="budget-trend-bars">
            <div class="budget-trend-bar income" style="height:${iH}px" title="Income ${fmtAUD(d.inc)}"></div>
            <div class="budget-trend-bar expense" style="height:${eH}px" title="Expenses ${fmtAUD(d.exp)}"></div>
          </div>
          <div class="budget-trend-month">${yr}</div>
        </div>`;
      }).join('');
      const annualPanel = sec('annual', 'Annual trend', `<div class="budget-trend-wrap"><div class="budget-trend">${annualBars}</div></div>`, legend);
      const trendPanel  = sec('trend',  'Monthly trend', `<div class="budget-trend-wrap"><div class="budget-trend">${trendBars}</div></div>`, legend);

      // Category drill-down: merchant breakdown for the selected category
      let catDetailPanel = '';
      let catDrillPanel = '';
      if (budgetSelectedCategory) {
        const catTxs = txs.filter(t => effectiveCat(t) === budgetSelectedCategory);
        const catTotal = catTxs.reduce((s, t) => s + t.debit, 0);
        const catMerch = {};
        catTxs.forEach(t => {
          if (t.debit > 0) {
            const key = t.vendor || vendorName(t.narrative);
            if (key) catMerch[key] = (catMerch[key] || 0) + t.debit;
          }
        });
        const catMerchList = Object.entries(catMerch).sort((a, b) => b[1] - a[1]);
        const maxCM = catMerchList[0]?.[1] || 1;
        const catMerchRows = catMerchList.map(([name, amt]) => `<div class="budget-bar-row">
          <div class="budget-bar-label" style="flex:1;min-width:0" title="${name}">${name}</div>
          <div class="budget-bar-wrap"><div class="budget-bar" style="width:${(amt / maxCM) * 100}%;background:${catColor(budgetSelectedCategory)}"></div></div>
          <div class="budget-bar-amount">${fmtAUD(amt)}</div>
          <div style="flex:0 0 50px;text-align:right;font-size:11px;color:var(--text-muted)">${Math.round(amt / catTotal * 100)}%</div>
        </div>`).join('');
        const selColor = catColor(budgetSelectedCategory);
        const catTxsSorted = catTxs.slice().sort((a, b) => b.date - a.date);
        const tabBtn = (id, label) => {
          const active = budgetDrillTab === id;
          return `<button onclick="selectDrillTab('${id}')" style="flex:1;padding:6px 10px;font-size:12px;font-weight:${active?'600':'400'};border:none;border-radius:6px;cursor:pointer;background:${active?'var(--bg-card)':'transparent'};color:${active?selColor:'var(--text-muted)'};box-shadow:${active?'0 1px 3px rgba(0,0,0,.1)':'none'};transition:all .15s">${label}</button>`;
        };
        const drillContent = budgetDrillTab === 'transactions'
          ? `<div class="budget-tx-list">${renderTxRows(catTxsSorted)}</div>`
          : `<div class="budget-panel-box">${catMerchRows || noData()}</div>`;
        catDrillPanel = `<div style="margin-bottom:24px;border-left:4px solid ${selColor};padding-left:14px">
          <div class="budget-section-title" style="margin-bottom:12px;color:${selColor}">${budgetSelectedCategory}
            <span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:8px">${fmtAUD(catTotal)} total · ${catTxs.length} transactions</span>
            <button onclick="selectCategory(null)" style="font-size:11px;padding:2px 8px;margin-left:12px;cursor:pointer;background:var(--bg-secondary);border:1px solid var(--border);border-radius:4px;color:var(--text-muted)">✕ Clear</button>
          </div>
          <div style="display:flex;gap:4px;background:var(--bg-secondary);border-radius:8px;padding:3px;margin-bottom:14px">
            ${tabBtn('transactions', `Transactions (${catTxs.length})`)}
            ${tabBtn('merchants', 'Merchants')}
          </div>
          ${drillContent}
        </div>`;
        catDetailPanel = `<div style="margin-bottom:24px;border-left:4px solid ${selColor};padding-left:14px">
          <div class="budget-section-title" style="margin-bottom:10px;color:${selColor}">${budgetSelectedCategory}
            <span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:8px">${fmtAUD(catTotal)} total · ${catTxs.length} transactions</span>
            <button onclick="selectCategory(null)" style="font-size:11px;padding:2px 8px;margin-left:12px;cursor:pointer;background:var(--bg-secondary);border:1px solid var(--border);border-radius:4px;color:var(--text-muted)">✕ Clear</button>
          </div>
          <div class="budget-panel-box">${catMerchRows || noData()}</div>
        </div>`;
      }

      // Income source drill-down for overview
      let incDetailPanel = '';
      if (budgetSelectedIncomeSource) {
        const srcName = budgetSelectedIncomeSource;
        const srcTxs = txs.filter(t => {
          if (t.credit <= 0) return false;
          const key = t.vendor || t.narrative.trim().slice(0, 35);
          return key === srcName;
        }).sort((a, b) => b.date - a.date);
        const srcTotal = srcTxs.reduce((s, t) => s + t.credit, 0);
        incDetailPanel = `<div style="margin-bottom:24px;border-left:4px solid #16a34a;padding-left:14px">
          <div class="budget-section-title" style="margin-bottom:10px;color:#16a34a">${srcName}
            <span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:8px">+${fmtAUD(srcTotal)} · ${srcTxs.length} transaction${srcTxs.length !== 1 ? 's' : ''}</span>
            <button onclick="selectIncomeSource(null)" style="font-size:11px;padding:2px 8px;margin-left:12px;cursor:pointer;background:var(--bg-secondary);border:1px solid var(--border);border-radius:4px;color:var(--text-muted)">✕ Clear</button>
          </div>
          <div class="budget-tx-list">${renderTxRows(srcTxs)}</div>
        </div>`;
      }

      const catFiltered = budgetSelectedCategory ? txs.filter(t => effectiveCat(t) === budgetSelectedCategory) : txs;
      const sorted = catFiltered.slice().sort((a, b) => b.date - a.date);
      const txRows = renderTxRows(sorted.slice(0, 200));
      const txTitle = budgetSelectedCategory
        ? `${budgetSelectedCategory} transactions`
        : `Transactions${sorted.length > 200 ? ' (200 most recent)' : ''}`;
      const txPanel = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="budget-section-title" style="margin-bottom:0">${txTitle}</div>
          <span id="txSearchCount" style="font-size:11px;color:var(--accent);font-weight:500"></span>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button onclick="exportCSV()" style="font-size:11px;padding:4px 10px;cursor:pointer">↓ Export CSV</button>
          <input type="text" id="txSearch" placeholder="Search all time…" oninput="filterTx(this.value)"
            style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--text-primary);font-family:inherit;width:200px;">
        </div>
      </div>
      <div class="budget-tx-list" id="txList">${txRows}</div>`;

      const importedFiles = await getImportedFiles();
      const fileList = Object.values(importedFiles).sort((a, b) => a.filename.localeCompare(b.filename));
      const unknownCount = [...new Set(budgetTransactions
        .filter(t => t.debit > 0 && (!t.category || t.category === 'Uncategorised') && !autoCategory(t.narrative))
        .map(t => cleanMerchant(t.narrative)).filter(Boolean)
      )].filter(n => !getMerchantCatCache()[n]).length;
      const classifyBtn = unknownCount > 0
        ? `<button onclick="classifyUnknownMerchants()" style="margin-left:12px;font-size:11px;padding:3px 10px;cursor:pointer;background:var(--accent);color:white;border:none;border-radius:4px">✦ Auto-classify ${unknownCount} merchants</button>`
        : `<span style="margin-left:12px;font-size:11px;color:#16a34a">✓ All merchants categorised</span>`;
      const sourcesHtml = `<div style="padding:10px 16px;background:var(--bg-secondary);border-radius:8px;font-size:11px;color:var(--text-muted);margin-bottom:24px;">
        <strong style="color:var(--text-secondary)">Imported data:</strong>
        ${fileList.map(f => `<span style="margin-left:10px">${f.filename} <span style="opacity:.7">(${f.count} rows · ${new Date(f.importedAt).toLocaleDateString()})</span></span>`).join('')}
        ${classifyBtn}
      </div>`;

      const _balAccounts = budgetSelectedAccount
        ? [budgetSelectedAccount]
        : [...new Set(budgetTransactions.map(t => t.account))].filter(Boolean).sort();
      const balCharts = _balAccounts.map(acc => {
        const accTxs = txs.filter(t => t.account === acc);
        if (accTxs.length < 2) return '';
        const color = acctColor(acc);
        return `<div style="margin-bottom:16px">
          <div style="font-size:11px;font-weight:600;color:${color};margin-bottom:4px;padding-left:4px;border-left:3px solid ${color};padding-left:8px">${acctName(acc)}</div>
          <div style="padding:4px 0">${balanceChartSVG(accTxs)}</div>
        </div>`;
      }).join('');
      const balPanel = sec('bal', 'Running balance', balCharts || noData());

      const recurring = getRecurring();
      const recurHeader = `<div class="budget-bar-row" style="border-bottom:2px solid var(--border-light);padding-bottom:6px;margin-bottom:2px">
        <div style="flex:1;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Name</div>
        <div style="flex:0 0 75px;text-align:right;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Avg/Period</div>
        <div style="flex:0 0 90px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;padding-left:12px">Frequency</div>
        <div style="flex:0 0 130px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Category</div>
        <div style="flex:0 0 120px;text-align:right;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Occurrences</div>
      </div>`;
      const recurRows = recurring.map(r => `<div class="budget-bar-row">
        <div class="budget-bar-label" style="flex:1;min-width:0" title="${r.name}">${r.name}</div>
        <div class="budget-bar-amount">${fmtAUD(r.avgAmt)}</div>
        <div style="flex:0 0 90px;font-size:11px;color:var(--text-muted);padding-left:12px">${r.freq}</div>
        <div style="flex:0 0 130px;font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.category}</div>
        <div style="flex:0 0 120px;text-align:right;font-size:11px;color:var(--text-muted)">${r.count}× · last ${r.lastDate}</div>
      </div>`).join('');
      const recurPanel = sec('recur', 'Recurring payments',
        `<div class="budget-panel-box">${recurring.length ? recurHeader + recurRows : noData()}</div>`,
        `<span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:8px">detected from all-time data</span>`);

      // Categories tab: full grid of ALL defined categories, then drill-down
      const catSpendMap = Object.fromEntries(catSpending(txs));
      const allDefinedCats = Object.keys(CAT_COLORS).filter(c => c !== 'Uncategorised' && c !== 'Other').sort((a, b) => a.localeCompare(b));
      const uncatAmt = catSpendMap['Uncategorised'] || 0;
      const catCards = allDefinedCats.map(cat => {
        const amt = catSpendMap[cat] || 0;
        const color = catColor(cat);
        const isSelected = budgetSelectedCategory === cat;
        const esc = cat.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const txCount = txs.filter(t => effectiveCat(t) === cat).length;
        const excluded = NON_EXPENSE_CATS.has(cat);
        return `<div onclick="selectCategory('${esc}')" style="cursor:pointer;padding:14px 16px;border-radius:10px;border:2px solid ${isSelected ? color : 'var(--border)'};background:${isSelected ? 'var(--bg-secondary)' : 'var(--bg-primary)'};display:flex;flex-direction:column;gap:6px;transition:border-color .15s${excluded ? ';opacity:.55' : ''}">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block"></span>
            <span style="font-size:12px;font-weight:600;color:var(--text-primary);flex:1">${cat}</span>
            <button onclick="event.stopPropagation();showRenameCategoryModal('${esc}')" style="background:none;border:none;padding:0;cursor:pointer;font-size:12px;color:var(--text-muted);line-height:1" title="Rename category">✏</button>
            <button onclick="event.stopPropagation();toggleExcludedCat('${esc}')" style="background:none;border:none;padding:0;cursor:pointer;font-size:13px;color:${excluded ? '#ef4444' : 'var(--text-muted)'};line-height:1" title="${excluded ? 'Excluded from trends — click to include' : 'Exclude from trends'}">⊘</button>
          </div>
          <div style="font-size:18px;font-weight:700;color:${amt > 0 ? color : 'var(--text-muted)'}">${amt > 0 ? fmtAUD(amt) : '—'}</div>
          <div style="font-size:11px;color:${excluded ? '#ef4444' : 'var(--text-muted)'}">${excluded ? 'excluded from trends' : txCount > 0 ? txCount + ' transaction' + (txCount > 1 ? 's' : '') : 'no transactions'}</div>
        </div>`;
      }).join('');
      const uncatEsc = 'Uncategorised';
      const uncatCount = txs.filter(t => effectiveCat(t) === 'Uncategorised').length;
      const uncatCard = `<div onclick="selectCategory('${uncatEsc}')" style="cursor:pointer;padding:14px 16px;border-radius:10px;border:2px solid ${budgetSelectedCategory==='Uncategorised'?'#d1d5db':'var(--border)'};background:${budgetSelectedCategory==='Uncategorised'?'var(--bg-secondary)':'var(--bg-primary)'};display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="width:10px;height:10px;border-radius:50%;background:#d1d5db;flex-shrink:0;display:inline-block"></span>
          <span style="font-size:12px;font-weight:600;color:var(--text-primary)">Uncategorised</span>
        </div>
        <div style="font-size:18px;font-weight:700;color:${uncatAmt > 0 ? '#9ca3af' : 'var(--text-muted)'}">${uncatAmt > 0 ? fmtAUD(uncatAmt) : '—'}</div>
        <div style="font-size:11px;color:var(--text-muted)">${uncatCount > 0 ? uncatCount + ' transaction' + (uncatCount > 1 ? 's' : '') : 'no transactions'}</div>
      </div>`;
      const addCatCard = `<div onclick="showAddCategoryModal()" style="cursor:pointer;padding:14px 16px;border-radius:10px;border:2px dashed var(--border);background:var(--bg-primary);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:border-color .15s;min-height:96px" onmouseenter="this.style.borderColor='var(--accent)'" onmouseleave="this.style.borderColor='var(--border)'">
        <div style="font-size:24px;color:var(--text-muted);line-height:1">+</div>
        <div style="font-size:12px;font-weight:600;color:var(--text-muted)">New category</div>
      </div>`;
      const catGrid = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px">${catCards}${uncatCard}${addCatCard}</div>`;

      // Top spending categories panel for the Categories tab
      const topSpendCats = catSpending(txs).filter(([, amt]) => amt > 0).slice(0, 10);
      const maxTopSpend = topSpendCats[0]?.[1] || 1;
      const topSpendRows = topSpendCats.map(([cat, amt], i) => {
        const color = catColor(cat);
        const esc = cat.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const lim = budgetLimits[cat];
        const over = lim && amt > lim;
        return `<div class="budget-bar-row" onclick="selectCategory('${esc}')" style="cursor:pointer">
          <div class="budget-rank">${i + 1}</div>
          <div style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0"></div>
          <div class="budget-bar-label">${cat}</div>
          <div class="budget-bar-wrap"><div class="budget-bar${over ? ' over' : ''}" style="width:${(amt/maxTopSpend)*100}%;background:${over ? '#ef4444' : color}"></div></div>
          <div class="budget-bar-amount">${fmtAUD(amt)}</div>
          <div class="budget-bar-extra">${lim ? `<span class="${over ? 'over' : 'under'}">${over ? '⚠ ' : ''}/ ${fmtAUD(lim)}</span>` : ''}</div>
        </div>`;
      }).join('');
      const topSpendPanel = topSpendCats.length ? `<div style="margin-bottom:24px">
        <div class="budget-section-title" style="margin-bottom:10px">Top spending categories</div>
        <div class="budget-panel-box">${topSpendRows}</div>
      </div>` : '';

      let catTabContent = topSpendPanel + catGrid;
      if (budgetSelectedCategory) {
        catTabContent += catDrillPanel;
      }

      const tabs = `<div class="budget-tabs">
        <button class="budget-tab${budgetSelectedTab==='overview'?' active':''}" onclick="selectTab('overview')">Overview</button>
        <button class="budget-tab${budgetSelectedTab==='categories'?' active':''}" onclick="selectTab('categories')">Categories</button>
        <button class="budget-tab${budgetSelectedTab==='transactions'?' active':''}" onclick="selectTab('transactions')">Transactions</button>
        <button class="budget-tab${budgetSelectedTab==='trends'?' active':''}" onclick="selectTab('trends')">Trends</button>
        <button class="budget-tab${budgetSelectedTab==='recurring'?' active':''}" onclick="selectTab('recurring')">Recurring</button>
      </div>`;

      document.getElementById('stickyBar').innerHTML = acctSel + yearSel + monthSel + tabs;

      // Spending alerts — shown when any category exceeds its budget limit
      const overBudgetCats = cats.filter(([cat, amt]) => budgetLimits[cat] && amt > budgetLimits[cat]);
      let spendingAlerts = '';
      if (overBudgetCats.length > 0) {
        const alertItems = overBudgetCats.map(([cat, amt]) => {
          const lim = budgetLimits[cat];
          const color = catColor(cat);
          const pct = Math.round((amt / lim - 1) * 100);
          const esc = cat.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
          return `<span onclick="selectOverviewCategory('${esc}')" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:3px 8px;font-size:12px"><span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block"></span><span style="font-weight:600;color:#dc2626">${cat}</span> <span style="color:#ef4444">${fmtAUD(amt)}</span><span style="color:#9ca3af;font-size:10px">&nbsp;/ ${fmtAUD(lim)} (+${pct}%)</span></span>`;
        }).join('');
        spendingAlerts = `<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span style="font-size:12px;font-weight:700;color:#dc2626;flex-shrink:0">⚠ Over budget:</span>${alertItems}</div>`;
      }

      // Largest transactions panel for the Transactions tab
      const largestTxs = filtered().filter(t => t.debit > 0).sort((a, b) => b.debit - a.debit).slice(0, 15);
      const largestTxPanel = sec('largest', 'Largest transactions', `<div class="budget-tx-list">${renderTxRows(largestTxs)}</div>`);

      let tabContent = '';
      if (budgetSelectedTab === 'overview') {
        let overviewDrill = '';
        if (budgetSelectedCategory) {
          overviewDrill = catDrillPanel;
        } else if (budgetSelectedIncomeSource) {
          overviewDrill = incDetailPanel;
        }
        tabContent = spendingAlerts + cards + savingsPanel + annualSummaryPanel + comparePanel + overviewDrill;
      } else if (budgetSelectedTab === 'categories') {
        tabContent = catTabContent;
      } else if (budgetSelectedTab === 'transactions') {
        tabContent = catDetailPanel + merchPanel + largestTxPanel + txPanel + sourcesHtml;
      } else if (budgetSelectedTab === 'trends') {
        // Category word cloud — all-time totals, account-filtered, no excluded cats
        const catWcData = {};
        budgetTransactions.forEach(t => {
          if (t.debit <= 0) return;
          if (budgetSelectedAccount && t.account !== budgetSelectedAccount) return;
          const cat = effectiveCat(t);
          if (NON_EXPENSE_CATS.has(cat) || cat === 'Uncategorised') return;
          catWcData[cat] = (catWcData[cat] || 0) + t.debit;
        });
        const catWcItems = Object.entries(catWcData)
          .map(([cat, val]) => ({ name: cat, value: val, color: catColor(cat) }))
          .sort((a, b) => b.value - a.value);

        // Vendor word cloud — all-time totals, colored by dominant category
        const vendorWcData = {};
        const vendorCatMap = {};
        budgetTransactions.forEach(t => {
          if (t.debit <= 0) return;
          if (budgetSelectedAccount && t.account !== budgetSelectedAccount) return;
          const vCat = effectiveCat(t);
          if (NON_EXPENSE_CATS.has(vCat) || vCat === 'Uncategorised') return;
          const vendor = t.vendor || vendorName(t.narrative);
          if (!vendor) return;
          vendorWcData[vendor] = (vendorWcData[vendor] || 0) + t.debit;
          if (!vendorCatMap[vendor]) vendorCatMap[vendor] = {};
          vendorCatMap[vendor][vCat] = (vendorCatMap[vendor][vCat] || 0) + t.debit;
        });
        const vendorWcItems = Object.entries(vendorWcData)
          .map(([vendor, val]) => {
            const domCat = Object.entries(vendorCatMap[vendor] || {}).sort((a, b) => b[1] - a[1])[0]?.[0] || 'Other';
            return { name: vendor, value: val, color: catColor(domCat) };
          })
          .sort((a, b) => b.value - a.value);

        const catWcPanel    = sec('catheat',  'Category spend', `<div class="budget-panel-box" style="padding:12px 16px">${buildWordCloud(catWcItems)}</div>`);
        const vendorWcPanel = sec('vendheat', 'Vendor spend',   `<div class="budget-panel-box" style="padding:12px 16px">${buildWordCloud(vendorWcItems)}</div>`);

        tabContent = catWcPanel + vendorWcPanel + cards + balPanel + annualPanel + trendPanel;
      } else if (budgetSelectedTab === 'recurring') {
        tabContent = recurPanel;
      }

      document.getElementById('budgetContent').innerHTML = tabContent;
    }

    function noData() {
      return '<div style="padding:16px;color:var(--text-muted);font-size:13px;text-align:center">No expenses</div>';
    }

    function buildWordCloud(items) {
      if (!items.length) return '<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px">Not enough data</div>';
      const W = 620, H = 130;
      const maxVal = items[0].value, minVal = items[items.length - 1].value;
      const logMax = Math.log(maxVal + 1), logMin = Math.log(minVal + 1);
      const logRange = logMax - logMin;
      const minSz = 8, maxSz = 26;
      function sz(val) {
        return Math.round(logRange < 0.01 ? (minSz + maxSz) / 2 : minSz + ((Math.log(val + 1) - logMin) / logRange) * (maxSz - minSz));
      }
      // Approximate character width varies by font size
      function bw(text, size) { return text.length * size * 0.58 + 10; }
      function bh(size) { return size * 1.4; }

      const placed = []; // {x, y, w, h}
      const svgWords = [];
      function overlaps(x, y, w, h) {
        const pad = 5;
        for (const p of placed) {
          if (Math.abs(x - p.x) < (w + p.w) / 2 + pad && Math.abs(y - p.y) < (h + p.h) / 2 + pad) return true;
        }
        return false;
      }

      for (const { name, value, color } of items) {
        const size = sz(value);
        const w = bw(name, size), h = bh(size);
        let px = W / 2, py = H / 2, ok = false;
        for (let step = 0; step < 1200 && !ok; step++) {
          const angle = step * 0.48;
          const r = step * 1.1;
          px = W / 2 + r * Math.cos(angle);
          py = H / 2 + r * Math.sin(angle) * 0.62;
          if (px - w / 2 < 2 || px + w / 2 > W - 2 || py - h / 2 < 2 || py + h / 2 > H - 2) continue;
          if (!overlaps(px, py, w, h)) ok = true;
        }
        if (!ok) continue;
        placed.push({ x: px, y: py, w, h });
        const fw = size >= 16 ? 700 : 600;
        const esc = name.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        svgWords.push(`<text x="${px.toFixed(1)}" y="${py.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="${size}" font-weight="${fw}" fill="${color}" font-family="inherit" style="cursor:default;user-select:none"><title>${esc}: ${fmtAUD(value)}</title>${esc}</text>`);
      }

      return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;min-height:${Math.round(H*0.7)}px" xmlns="http://www.w3.org/2000/svg">${svgWords.join('')}</svg>`;
    }

    function renderTxRows(txs) {
      if (!txs.length) return '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px">No transactions</div>';

      function fmtDateInline(dateStr) {
        const [d, m, y] = dateStr.split('/');
        const dt = new Date(+y, +m - 1, +d);
        return dt.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
      }

      return txs.map(t => {
        const merchant = t.vendor || t.narrative;
        const cat = effectiveCat(t);
        const color = catColor(cat);
        const bal = t.balance ? `<div class="budget-tx-balance">${fmtAUD(t.balance)}</div>` : '';
        const narrAttr = t.narrative.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
        let catBadge;
        if (cat === 'Uncategorised') {
          catBadge = `<div class="budget-tx-cat-badge" data-narrative="${narrAttr}" style="background:#D9775720;color:#D97757;border-color:#D9775760;border-style:dashed;cursor:pointer;user-select:none;font-weight:600">+ Categorise</div>`;
        } else {
          catBadge = `<div class="budget-tx-cat-badge" data-narrative="${narrAttr}" style="background:${color}18;color:${color};border-color:${color}40;cursor:pointer;user-select:none">${cat} ▾</div>`;
        }
        const delBtn = t.id != null ? `<button class="tx-del-btn" onclick="event.stopPropagation();deleteTx(${t.id})" style="flex:0 0 auto;background:none;border:none;padding:2px 5px;border-radius:4px;cursor:pointer;font-size:15px;color:#9ca3af;line-height:1" onmouseenter="this.style.color='#ef4444'" onmouseleave="this.style.color='#9ca3af'" title="Delete transaction">×</button>` : '';
        return `<div class="budget-tx-row" style="border-left:3px solid ${color}">
          <div class="budget-tx-date">${fmtDateInline(t.dateStr)}</div>
          <div class="budget-tx-merchant" title="${t.narrative}">${merchant}</div>
          ${catBadge}
          <div class="budget-tx-amount ${t.debit > 0 ? 'expense' : 'income'}">${t.debit > 0 ? '−' + fmtAUD(t.debit) : '+' + fmtAUD(t.credit)}</div>
          ${bal}
          ${delBtn}
        </div>`;
      }).join('');
    }

    function filterTx(q) {
      const ql = q.trim().toLowerCase();
      const countEl = document.getElementById('txSearchCount');
      if (!ql) {
        let txs = filtered().slice().sort((a, b) => b.date - a.date);
        if (budgetSelectedCategory) txs = txs.filter(t => effectiveCat(t) === budgetSelectedCategory);
        if (countEl) countEl.textContent = '';
        document.getElementById('txList').innerHTML = renderTxRows(txs.slice(0, 200));
        return;
      }
      // Search across ALL transactions (account-filtered only)
      let allTxs = budgetTransactions;
      if (budgetSelectedAccount) allTxs = allTxs.filter(t => t.account === budgetSelectedAccount);
      const results = allTxs.filter(t =>
        t.narrative.toLowerCase().includes(ql) ||
        effectiveCat(t).toLowerCase().includes(ql) ||
        (t.vendor || '').toLowerCase().includes(ql)
      ).sort((a, b) => b.date - a.date);
      if (countEl) countEl.textContent = results.length === 0 ? 'No results' : `${results.length} result${results.length !== 1 ? 's' : ''} across all time`;
      document.getElementById('txList').innerHTML = renderTxRows(results.slice(0, 300));
    }

    function exportCSV() {
      const txs = filtered().slice().sort((a, b) => b.date - a.date);
      const rows = [['Date', 'Narrative', 'Vendor', 'Category', 'Debit', 'Credit', 'Balance', 'Account']];
      txs.forEach(t => {
        rows.push([t.dateStr, '"' + t.narrative.replace(/"/g, '""') + '"', '"' + (t.vendor || '').replace(/"/g, '""') + '"', effectiveCat(t), t.debit || '', t.credit || '', t.balance || '', acctName(t.account)]);
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      const period = budgetSelectedMonth || (budgetSelectedYear ? budgetSelectedYear : 'all-time');
      a.download = `budget-${period}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showStatus(`Exported ${txs.length} transactions`);
    }

    function toggleSettings() {
      const p = document.getElementById('settingsPanel');
      p.style.display = p.style.display === 'none' ? '' : 'none';
      if (p.style.display !== 'none') {
        const key = localStorage.getItem('budget_api_key') || '';
        document.getElementById('apiKeyInput').value = key;
      }
    }
    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (val) { localStorage.setItem('budget_api_key', val); showStatus('API key saved'); }
    }
    function clearApiKey() {
      localStorage.removeItem('budget_api_key');
      localStorage.removeItem('budget_merchant_cats');
      document.getElementById('apiKeyInput').value = '';
      invalidateCatCache();
      showStatus('API key and merchant cache cleared');
      renderBudget();
    }

    function selectTab(tab) { budgetSelectedTab = tab; window.scrollTo({top:0}); renderBudget(); }

    function getCollapsed() {
      try { return new Set(JSON.parse(localStorage.getItem('budget_collapsed') || '[]')); } catch { return new Set(); }
    }
    function toggleSection(id) {
      const s = getCollapsed();
      s.has(id) ? s.delete(id) : s.add(id);
      localStorage.setItem('budget_collapsed', JSON.stringify([...s]));
      const content = document.getElementById('sec-' + id);
      const btn = document.getElementById('tog-' + id);
      if (content) content.style.display = s.has(id) ? 'none' : '';
      if (btn) btn.textContent = s.has(id) ? '›' : '⌄';
    }
    function sec(id, title, content, extraTitleHtml = '') {
      const collapsed = getCollapsed().has(id);
      return `<div style="margin-bottom:24px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${collapsed?'0':'10px'};cursor:pointer" onclick="toggleSection('${id}')">
          <div class="budget-section-title" style="margin-bottom:0">${title}${extraTitleHtml}</div>
          <button id="tog-${id}" style="background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:0 4px;line-height:1">${collapsed ? '›' : '⌄'}</button>
        </div>
        <div id="sec-${id}" style="${collapsed ? 'display:none' : ''}">${content}</div>
      </div>`;
    }
    function selectAccount(acc) { budgetSelectedAccount = acc; budgetSelectedYear = null; budgetSelectedMonth = null; budgetSelectedCategory = null; budgetSelectedIncomeSource = null; window.scrollTo({top:0}); renderBudget(); }
    function selectCategory(cat) {
      budgetSelectedCategory = cat;
      budgetSelectedIncomeSource = null;
      budgetDrillTab = 'transactions';
      if (cat && budgetSelectedTab !== 'categories') budgetSelectedTab = 'categories';
      window.scrollTo({top: 0});
      renderBudget();
    }
    function selectOverviewCategory(cat) {
      budgetSelectedCategory = budgetSelectedCategory === cat ? null : cat;
      budgetSelectedIncomeSource = null;
      budgetDrillTab = 'transactions';
      window.scrollTo({top: 0});
      renderBudget();
    }
    function selectDrillTab(tab) {
      budgetDrillTab = tab;
      renderBudget();
    }
    function selectIncomeSource(src) {
      budgetSelectedIncomeSource = budgetSelectedIncomeSource === src ? null : src;
      budgetSelectedCategory = null;
      window.scrollTo({top: 0});
      renderBudget();
    }

    function selectMonth(m) { budgetSelectedMonth = m; budgetSelectedCategory = null; budgetSelectedIncomeSource = null; window.scrollTo({top:0}); renderBudget(); }
    function selectYear(yr) {
      budgetSelectedYear = yr === null ? null : yr;
      budgetSelectedMonth = null;
      budgetSelectedCategory = null;
      budgetSelectedIncomeSource = null;
      window.scrollTo({top:0});
      renderBudget();
    }

    function setLimit(cat) {
      const cur = budgetLimits[cat] ? budgetLimits[cat].toFixed(2) : '';
      const val = prompt(`Monthly budget limit for "${cat}" in $\n(Leave blank to remove):`, cur);
      if (val === null) return;
      const n = parseFloat(val);
      if (!isNaN(n) && n > 0) { budgetLimits[cat] = n; saveBudgetLimits(); renderBudget(); }
      else if (val.trim() === '') { delete budgetLimits[cat]; saveBudgetLimits(); renderBudget(); }
    }

    function showAddCategoryModal() {
      document.querySelectorAll('.add-cat-modal').forEach(d => d.remove());
      const usedColors = new Set(Object.values(CAT_COLORS));
      const defaultColor = CUSTOM_CAT_PALETTE.find(c => !usedColors.has(c)) || CUSTOM_CAT_PALETTE[0];
      const swatches = CUSTOM_CAT_PALETTE.map(c =>
        `<span data-color="${c}" class="cswatch" onclick="document.querySelectorAll('.cswatch').forEach(s=>s.style.outline='none');this.style.outline='2px solid '+getComputedStyle(document.documentElement).getPropertyValue('--text-primary');document.getElementById('catColorPick').value='${c}'" style="display:inline-block;width:22px;height:22px;border-radius:50%;background:${c};cursor:pointer;flex-shrink:0;${c===defaultColor?'outline:2px solid #141413':''}"></span>`
      ).join('');
      const overlay = document.createElement('div');
      overlay.className = 'add-cat-modal';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;display:flex;align-items:center;justify-content:center';
      overlay.innerHTML = `<div style="background:var(--bg-card);border-radius:12px;padding:24px;width:340px;box-shadow:0 8px 40px rgba(0,0,0,.3);font-family:inherit">
        <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:16px">New category</div>
        <div style="margin-bottom:14px">
          <label style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Name</label>
          <input id="catNameInput" type="text" placeholder="e.g. Hobbies" style="width:100%;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text-primary);font-family:inherit;outline:none;box-sizing:border-box">
        </div>
        <div style="margin-bottom:20px">
          <label style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:8px">Colour</label>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            ${swatches}
            <input id="catColorPick" type="color" value="${defaultColor}" title="Custom colour" style="width:22px;height:22px;border:1px solid var(--border);border-radius:50%;cursor:pointer;padding:0;background:none;flex-shrink:0">
          </div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button onclick="this.closest('.add-cat-modal').remove()" style="font-size:13px;padding:7px 16px">Cancel</button>
          <button onclick="saveNewCategory()" class="primary" style="font-size:13px;padding:7px 16px">Add category</button>
        </div>
      </div>`;
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);
      const input = document.getElementById('catNameInput');
      input.focus();
      input.addEventListener('keydown', e => { if (e.key === 'Enter') saveNewCategory(); if (e.key === 'Escape') overlay.remove(); });
    }

    function saveNewCategory() {
      const name = (document.getElementById('catNameInput')?.value || '').trim();
      if (!name) { document.getElementById('catNameInput')?.focus(); return; }
      if (CAT_COLORS[name]) { showStatus(`"${name}" already exists`); return; }
      const color = document.getElementById('catColorPick')?.value || CUSTOM_CAT_PALETTE[0];
      document.querySelectorAll('.add-cat-modal').forEach(d => d.remove());
      const custom = getCustomCats();
      custom[name] = color;
      localStorage.setItem('budget_custom_cats', JSON.stringify(custom));
      CAT_COLORS[name] = color;
      showStatus(`Category "${name}" added`);
      renderBudget();
    }

    let _renamingCat = null;
    function showRenameCategoryModal(cat) {
      document.querySelectorAll('.rename-cat-modal').forEach(d => d.remove());
      _renamingCat = cat;
      const overlay = document.createElement('div');
      overlay.className = 'rename-cat-modal';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;display:flex;align-items:center;justify-content:center';
      overlay.innerHTML = `<div style="background:var(--bg-card);border-radius:12px;padding:24px;width:340px;box-shadow:0 8px 40px rgba(0,0,0,.3);font-family:inherit">
        <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:16px">Rename category</div>
        <div style="margin-bottom:20px">
          <label style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">New name</label>
          <input id="catRenameInput" type="text" value="${cat.replace(/"/g, '&quot;')}" style="width:100%;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text-primary);font-family:inherit;outline:none;box-sizing:border-box">
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button onclick="this.closest('.rename-cat-modal').remove()" style="font-size:13px;padding:7px 16px">Cancel</button>
          <button onclick="saveRenameCategory()" class="primary" style="font-size:13px;padding:7px 16px">Rename</button>
        </div>
      </div>`;
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);
      const input = document.getElementById('catRenameInput');
      input.focus();
      input.select();
      input.addEventListener('keydown', e => { if (e.key === 'Enter') saveRenameCategory(); if (e.key === 'Escape') overlay.remove(); });
    }

    function saveRenameCategory() {
      const newName = (document.getElementById('catRenameInput')?.value || '').trim();
      const oldName = _renamingCat;
      if (!newName) { document.getElementById('catRenameInput')?.focus(); return; }
      if (newName === oldName) { document.querySelectorAll('.rename-cat-modal').forEach(d => d.remove()); return; }
      if (CAT_COLORS[newName]) { showStatus(`"${newName}" already exists`); return; }
      document.querySelectorAll('.rename-cat-modal').forEach(d => d.remove());
      applyRenameCategory(oldName, newName);
    }

    function applyRenameCategory(oldName, newName) {
      // Update runtime CAT_COLORS
      if (CAT_COLORS[oldName] !== undefined) {
        CAT_COLORS[newName] = CAT_COLORS[oldName];
        delete CAT_COLORS[oldName];
      }
      // Update custom cats storage
      const custom = getCustomCats();
      if (custom[oldName] !== undefined) {
        custom[newName] = custom[oldName];
        delete custom[oldName];
        localStorage.setItem('budget_custom_cats', JSON.stringify(custom));
      }
      // Record rename for built-in cats (effectiveCat remapping) — chain through existing renames
      const renames = getCatRenames();
      // If oldName was itself a rename target, update the chain
      for (const [k, v] of Object.entries(renames)) {
        if (v === oldName) renames[k] = newName;
      }
      renames[oldName] = newName;
      localStorage.setItem('budget_cat_renames', JSON.stringify(renames));
      // Update manual overrides that reference oldName
      const manual = getManualCats();
      let manualChanged = false;
      for (const [k, v] of Object.entries(manual)) {
        if (v === oldName) { manual[k] = newName; manualChanged = true; }
      }
      if (manualChanged) localStorage.setItem('budget_manual_cats', JSON.stringify(manual));
      // Update budget limits
      if (budgetLimits[oldName] !== undefined) {
        budgetLimits[newName] = budgetLimits[oldName];
        delete budgetLimits[oldName];
        saveBudgetLimits();
      }
      // Update exclusions
      if (NON_EXPENSE_CATS.has(oldName)) {
        NON_EXPENSE_CATS.delete(oldName);
        NON_EXPENSE_CATS.add(newName);
        localStorage.setItem('budget_excluded_cats', JSON.stringify([...NON_EXPENSE_CATS]));
      }
      // Update selected category if needed
      if (budgetSelectedCategory === oldName) budgetSelectedCategory = newName;
      invalidateCatCache();
      showStatus(`Renamed "${oldName}" → "${newName}"`);
      renderBudget();
    }

    async function deleteTx(id) {
      if (!confirm('Delete this transaction? This cannot be undone.')) return;
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction('transactions', 'readwrite');
        tx.objectStore('transactions').delete(id);
        tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
      });
      budgetTransactions = budgetTransactions.filter(t => t.id !== id);
      _recurringCache = null;
      renderBudget();
      showStatus('Transaction deleted');
    }

    window.deleteTx = deleteTx;
    window.selectMonth = selectMonth;
    window.selectYear = selectYear;
    window.selectCategory = selectCategory;
    window.selectDrillTab = selectDrillTab;
    function toggleExcludedCat(cat) {
      if (NON_EXPENSE_CATS.has(cat)) NON_EXPENSE_CATS.delete(cat);
      else NON_EXPENSE_CATS.add(cat);
      localStorage.setItem('budget_excluded_cats', JSON.stringify([...NON_EXPENSE_CATS]));
      renderBudget();
    }

    window.toggleExcludedCat = toggleExcludedCat;
    window.setLimit = setLimit;
    window.filterTx = filterTx;
    window.exportCSV = exportCSV;
    window.showAddCategoryModal = showAddCategoryModal;
    window.saveNewCategory = saveNewCategory;
    window.showRenameCategoryModal = showRenameCategoryModal;
    window.saveRenameCategory = saveRenameCategory;

    document.addEventListener('click', function(e) {
      const badge = e.target.closest('.budget-tx-cat-badge');
      if (badge) { e.stopPropagation(); openCatDropdown(badge); }
    });

    document.getElementById('importBtn').addEventListener('click', doImport);
    document.getElementById('importBtnLarge').addEventListener('click', doImport);
    document.getElementById('changeFolderBtn').addEventListener('click', changeFolder);
    document.getElementById('resetBtn').addEventListener('click', async () => {
      if (!confirm('Clear all imported data and re-import everything from the folder?')) return;
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction(['transactions', 'imported_files'], 'readwrite');
        tx.objectStore('transactions').clear();
        tx.objectStore('imported_files').clear();
        tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
      });
      localStorage.removeItem('budget_limits');
      budgetTransactions = [];
      budgetLimits = {};
      budgetSelectedMonth = null;
      showStatus('Cleared — re-importing…');
      await doImport();
    });
    document.getElementById('folderInput').addEventListener('change', async function() {
      await importFromFileList(this.files);
      this.value = '';
    });

    // On startup: deduplicate existing DB records, then load
    async function deduplicateDB() {
      const all = await loadAllTransactions();
      const seen = new Set();
      const dupeIds = [];
      for (const t of all) {
        const k = txDedupKey(t);
        if (seen.has(k)) dupeIds.push(t.id);
        else seen.add(k);
      }
      if (!dupeIds.length) return 0;
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction('transactions', 'readwrite');
        const store = tx.objectStore('transactions');
        dupeIds.forEach(id => store.delete(id));
        tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
      });
      return dupeIds.length;
    }

    (async () => {
      const removed = await deduplicateDB();
      const txs = (await loadAllTransactions()).filter(t => !EXCLUDED_ACCOUNTS.has(t.account));
      if (txs.length) {
        budgetTransactions = txs;
        const years = [...new Set(txs.map(t => t.month.split('-')[0]))].sort();
        budgetSelectedYear = years[years.length - 1] || null;
        budgetSelectedMonth = null;
        await renderBudget();
        if (removed > 0) showStatus(`Removed ${removed} duplicate transaction${removed > 1 ? 's' : ''}`);
      }
      const saved = await getSavedHandle();
      if (saved) showChangeFolderBtn(true);
      await autoCheckNewFiles();
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #faf9f5;
      --bg-secondary: #F5F4EF;
      --bg-card: #ffffff;
      --text-primary: #141413;
      --text-secondary: #5c5c5a;
      --text-muted: #8c8c8a;
      --accent: #D97757;
      --accent-hover: #c4684a;
      --border: #e5e4df;
      --border-light: #eeeee9;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 0 24px 20px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }

    button {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: white; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 60px 20px;
      text-align: center;
    }

    #status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-primary);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    #status.visible { opacity: 1; }

    /* Budget styles */
    .budget-month-selector { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .budget-tabs { display:flex; border-bottom:2px solid var(--border); margin-bottom:20px; gap:0; }
    .budget-tab { padding:10px 20px; font-size:13px; font-weight:500; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; background:none; border-top:none; border-left:none; border-right:none; font-family:inherit; transition:color 0.15s; }
    .budget-tab:hover { color:var(--text-primary); }
    .budget-tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    .budget-month-btn {
      background: var(--bg-secondary); border: 1px solid var(--border);
      padding: 5px 12px; font-size: 12px; border-radius: 6px; color: var(--text-secondary);
    }
    .budget-month-btn:hover { border-color: var(--accent); color: var(--accent); }
    .budget-month-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

    .budget-summary-cards {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px;
    }
    .budget-drag-panel { position: relative; }
    .budget-drag-panel.ov-dragging { opacity: 0.35; }
    .budget-drag-panel.ov-drag-over { outline: 2px dashed var(--accent); border-radius: 10px; }
    .budget-drag-handle { position: absolute; top: 6px; right: 6px; cursor: grab; color: var(--text-muted); font-size: 16px; opacity: 0; transition: opacity .15s; user-select: none; z-index: 10; line-height: 1; padding: 4px; }
    .budget-drag-panel:hover .budget-drag-handle { opacity: 0.5; }
    .budget-drag-handle:hover { opacity: 1 !important; }
    .budget-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
    }
    .budget-card-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 6px;
    }
    .budget-card-value { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .budget-card-value.income { color: #16a34a; }
    .budget-card-value.expense { color: var(--accent); }

    .budget-section-title {
      font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 10px;
    }
    .budget-panel-box {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px;
    }

    .budget-bar-row {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 0; border-bottom: 1px solid var(--border-light); font-size: 12px;
    }
    .budget-bar-row:last-child { border-bottom: none; }
    .budget-bar-label {
      flex: 0 0 140px; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px;
    }
    .budget-bar-wrap { flex: 1; height: 6px; background: var(--bg-secondary); border-radius: 3px; overflow: hidden; }
    .budget-bar { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.3s ease; }
    .budget-bar.over { background: #ef4444; }
    .budget-bar.blue { background: #60a5fa; }
    .budget-bar-amount { flex: 0 0 75px; text-align: right; font-weight: 500; color: var(--text-primary); }
    .budget-bar-extra { flex: 0 0 90px; text-align: right; font-size: 11px; color: var(--text-muted); }
    .budget-bar-extra .over { color: #ef4444; }
    .budget-bar-extra .under { color: #16a34a; }
    .budget-rank { flex: 0 0 18px; font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .set-limit-btn {
      background: transparent; border: 1px solid var(--border);
      padding: 2px 7px; font-size: 11px; border-radius: 4px; color: var(--text-muted);
    }
    .set-limit-btn:hover { border-color: var(--accent); color: var(--accent); }

    .budget-trend-wrap {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; margin-bottom: 24px; overflow-x: auto;
    }
    .budget-trend { display: flex; align-items: flex-end; gap: 8px; min-height: 110px; }
    .budget-trend-group {
      display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex-shrink: 0;
    }
    .budget-trend-group:hover .budget-trend-bars { opacity: 0.7; }
    .budget-trend-group.selected .budget-trend-month { color: var(--accent); font-weight: 600; }
    .budget-trend-bars { display: flex; align-items: flex-end; gap: 2px; height: 80px; }
    .budget-trend-bar { width: 16px; border-radius: 3px 3px 0 0; min-height: 2px; }
    .budget-trend-bar.income { background: #16a34a; opacity: 0.75; }
    .budget-trend-bar.expense { background: var(--accent); opacity: 0.75; }
    .budget-trend-month { font-size: 10px; color: var(--text-muted); white-space: nowrap; }

    .budget-tx-list {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden; margin-bottom: 24px;
    }
    .budget-tx-row {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 16px; border-bottom: 1px solid var(--border-light); font-size: 12px;
    }
    .budget-tx-row:last-child { border-bottom: none; }
    .budget-tx-date { flex: 0 0 60px; font-size: 11px; color: var(--text-muted); white-space: nowrap; }
    .budget-tx-merchant { flex: 1; color: var(--text-primary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .budget-tx-merchant .vendor-edit { opacity: 0; font-size: 11px; color: var(--text-muted); margin-left: 4px; transition: opacity .12s; }
    .budget-tx-merchant:hover .vendor-edit { opacity: 1; }
    .budget-tx-cat-badge { flex: 0 0 auto; font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--bg-secondary); color: var(--text-muted); white-space: nowrap; border: 1px solid var(--border-light); }
    .budget-tx-amount { flex: 0 0 85px; text-align: right; font-weight: 500; }
    .budget-tx-amount.income { color: #16a34a; }
    .budget-tx-amount.expense { color: var(--accent); }
    .budget-tx-balance { flex: 0 0 80px; text-align: right; color: var(--text-muted); font-size: 11px; }
    .budget-tx-row .tx-del-btn { opacity: 0; transition: opacity .15s; }
    .budget-tx-row:hover .tx-del-btn { opacity: 1; }
    .tx-sel-cb { flex: 0 0 auto; width: 14px; height: 14px; cursor: pointer; accent-color: var(--accent); opacity: 0; transition: opacity .1s; }
    .budget-tx-row:hover .tx-sel-cb, .tx-sel-cb:checked { opacity: 1; }
    .tx-bulk-active .tx-sel-cb { opacity: 0.45; }
    .tx-bulk-active .tx-sel-cb:checked { opacity: 1; }
    #tx-bulk-bar { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 10px; padding: 10px 18px; background: var(--text-primary); color: var(--bg-primary); border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.35); z-index: 9999; white-space: nowrap; font-size: 13px; font-family: inherit; }
  </style>
</head>
<body>
  <div id="tx-bulk-bar"></div>

    <h1>Budget <span style="font-size:12px;font-weight:400;color:var(--text-muted)">v1.92</span></h1>

      <button id="importBtn" class="primary">Import</button>
    </div>

  <div id="settingsPanel" style="display:none;background:var(--bg-card);border-bottom:1px solid var(--border);padding:14px 24px;font-size:13px">

      <div>
        <div style="font-weight:600;color:var(--text-primary);margin-bottom:6px">Anthropic API key

        </div>
        <div style="display:flex;gap:8px">
          <input id="apiKeyInput" type="password" placeholder="sk-ant-…" style="width:320px;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--text-primary);font-family:monospace">
          <button onclick="saveApiKey()" class="primary" style="font-size:12px;padding:6px 14px">Save</button>

      </div>
    </div>
  </div>

  <div id="stickyBar" style="position:sticky;top:53px;z-index:90;background:var(--bg-primary);padding:10px 0 0;margin-bottom:4px;border-bottom:1px solid var(--border)"></div>

  <div id="emptyState" class="empty-state">

    <button id="importBtnLarge" class="primary">Import</button>
  </div>

    <div id="budgetContent"></div>
  </div>

    // Sort by key length descending so longer (more specific) keys match first
    const _merchantCatEntries = Object.entries(MERCHANT_CATS)
      .sort((a, b) => b[0].length - a[0].length)
      .map(([k, v]) => [k.toLowerCase(), v]);

    function autoCategory(narrative) {
      if (_autoCatCache.has(narrative)) return _autoCatCache.get(narrative);
      const r = _autoCat(narrative);
      _autoCatCache.set(narrative, r);
      return r;
    }
    function _autoCat(narrative) {
      const raw = narrative.toLowerCase();
      // Insert spaces at letter↔digit boundaries so patterns like \bkfc\b match "KFC1234"
      const norm = raw.replace(/([a-z])(\d)/g, '$1 $2').replace(/(\d)([a-z])/g, '$1 $2').replace(/\s+/g, ' ').trim();

      // BPAY context clues — checked before general patterns (use raw for full context)
      const bpayPatterns = [
        [/bpay.*\bato\b|bpay.*tax.*office|bpay.*payg|bpay.*bas\b/,   'Tax'],
        [/bpay.*council|bpay.*shire|bpay.*rates/,                     'Council Rates'],
        [/bpay.*(medibank|bupa|hcf|nib|ahm|hbf)|bpay.*health\s*(fund|insur)/, 'Health Insurance'],
        [/bpay.*(energex|ergon|origin|agl|red\s*energy|unitywater|seqwater)/, 'Utilities'],
        [/bpay.*water|bpay.*electricity|bpay.*gas\b/,                 'Utilities'],
        [/bpay.*(telstra|optus|vodafone|tpg|iinet|aussie\s*broadband)/, 'Telecommunications'],
      ];
      for (const [re, cat] of bpayPatterns) {
        if (re.test(raw)) return cat;
      }

      // Keyword patterns checked against the raw narrative first
      const patterns = [
        // Bank transfers
        [/^(transfer|tfr|trf)\b|\b(transfer|tfr|trf)\s+(to|from)\b/i,  'Bank Transfers'],
        [/\bosko\b|\bnpp\s+(credit|debit|payment)\b/,                   'Bank Transfers'],
        [/\binternet\s+banking\s+transfer|\bib\s+transfer\b/,           'Bank Transfers'],
        [/\bown\s+account|\bself\s+transfer\b/,                         'Bank Transfers'],
        // Takeaway food (before general Dining/Uber rules)
        [/uber[\s*·\-]*eat|menulog|doordash|deliveroo/,          'Eating Out'],
        [/\bmcdonald'?s\b|\bmaccas\b|\bmcdo\b/,                'Eating Out'],
        [/\bkfc\b|kentucky\s*fried/,                           'Eating Out'],
        [/\bsubway\b|\bhungry\s*jack|burger\s*king/,           'Eating Out'],
        [/\bdomino'?s\b|\bpizza\s*hut\b|\bpapparich\b/,       'Eating Out'],
        [/\bnando'?s\b|\bguzman\b|\broll'?d\b|\bchurrito\b/,  'Eating Out'],
        [/\bbuffalo\s*jack|\bwing\s*stop|\bzan'?s\b/,          'Eating Out'],
        [/\bchiptle\b|\btaco\s*bell\b|\bsan\s*churro\b/,       'Eating Out'],

    function setCatOverride(narrative, cat) {
      const key = vendorName(narrative) || cleanMerchant(narrative) || narrative.trim().slice(0, 50);

      Object.entries(CAT_COLORS)
        .filter(([c]) => c !== 'Uncategorised' && !subcats[c])
        .sort(([a], [b]) => a.localeCompare(b))
        .forEach(([cat, color]) => {
          addItem(cat, color, false);
          childrenOf(cat).forEach(child => addItem(child, CAT_COLORS[child] || color, true));

      // Separator + Uncategorised
      const sep = document.createElement('div');

    async function classifyUnknownMerchants() {
      const apiKey = localStorage.getItem('budget_api_key');
      if (!apiKey) { alert('Enter your Anthropic API key in Settings first.'); return; }

      const cache = getMerchantCatCache();
      const unknown = new Set();
      budgetTransactions.forEach(t => {
        if (t.debit <= 0) return;
        const name = cleanMerchant(t.narrative);
        if (!name || cache[name]) return;
        if (t.category && t.category !== 'Uncategorised') return;
        if (autoCategory(t.narrative)) return;  // already handled by static rules
        unknown.add(name);
      });

      function setClassifyStatus(msg) {
        showStatus(msg);
        const el = document.getElementById('classifyStatus');
        if (el) el.textContent = msg;
      }

      if (!unknown.size) { setClassifyStatus('✓ All merchants already categorised'); return; }

      const names = [...unknown];
      const allCats = Object.keys(CAT_COLORS).filter(c => c !== 'Uncategorised').sort().join(', ');
      const BATCH = 40;
      let done = 0;

      for (let i = 0; i < names.length; i += BATCH) {
        const batch = names.slice(i, i + BATCH);
        setClassifyStatus(`Classifying ${i + 1}–${Math.min(i + BATCH, names.length)} of ${names.length}…`);
        try {
          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'content-type': 'application/json',
              'anthropic-dangerous-allow-browser': 'true',
            },
            body: JSON.stringify({
              model: 'claude-haiku-4-5-20251001',
              max_tokens: 1024,
              messages: [{ role: 'user', content:
                `Categorise these Australian bank transaction merchant names. Use ONLY one of: ${allCats}.\n\nMerchants:\n${batch.map((m, j) => `${j+1}. ${m}`).join('\n')}\n\nReply with ONLY a JSON object like {"Merchant Name": "Category"}. No explanation.`
              }]
            })
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const text = data.content[0].text;
          const match = text.match(/\{[\s\S]*\}/);
          if (match) {
            const result = JSON.parse(match[0]);
            Object.assign(cache, result);
            done += Object.keys(result).length;
          }
        } catch (e) {
          setClassifyStatus(`API error: ${e.message}`); return;
        }
      }

      localStorage.setItem('budget_merchant_cats', JSON.stringify(cache));
      invalidateCatCache();
      setClassifyStatus(`✓ Classified ${done} merchants`);
      renderBudget();
    }

    function effectiveCat(t) {
      const key = t.narrative;
      if (_effectiveCatCache.has(key)) return _effectiveCatCache.get(key);
      const merchantKey = cleanMerchant(key) || key.trim().slice(0, 50);
      const vKey = t.vendor || vendorName(key);
      const manual = getManualCats();
      const renames = getCatRenames();
      let result;
      if (manual[vKey]) result = manual[vKey];
      else if (vKey !== merchantKey && manual[merchantKey]) result = manual[merchantKey];
      else {
        const auto = autoCategory(key);
        if (auto) result = auto;
        else if (t.category && t.category !== 'Uncategorised') {
          // Try the CSV category; if it was renamed (old name no longer in CAT_COLORS), use the new name
          const rawCat = t.category;
          const resolvedCat = CAT_COLORS[rawCat] ? rawCat : (renames[rawCat] && CAT_COLORS[renames[rawCat]] ? renames[rawCat] : null);
          result = resolvedCat || 'Uncategorised';
        } else result = 'Uncategorised';
      }
      result = renames[result] || result;
      _effectiveCatCache.set(key, result);
      return result;
    }

    function applyBulkCategory(cat) {
      const txMap = new Map(budgetTransactions.map(t => [t.id, t]));
      const overrides = getManualCats();
      const keys = new Set();
      _txSelIds.forEach(id => {
        const t = txMap.get(id);
        if (!t) return;
        const key = vendorName(t.narrative) || cleanMerchant(t.narrative) || t.narrative.trim().slice(0, 50);
        overrides[key] = cat;
        keys.add(key);
      });
      const count = _txSelIds.size;
      localStorage.setItem('budget_manual_cats', JSON.stringify(overrides));
      invalidateCatCache();
      _txSelIds.clear();
      showStatus(`✓ "${cat}" applied to ${count} transaction${count !== 1 ? 's' : ''}`);
      renderBudget();

    // ===== INDEXEDDB =====
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('budget-app', 1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          db.createObjectStore('handles');
          db.createObjectStore('transactions', { autoIncrement: true });
          db.createObjectStore('imported_files');
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e.target.error);
      });
    }

    async function clearSavedHandle() {
      try {
        const db = await openDB();
        await new Promise((res, rej) => {
          const tx = db.transaction('handles', 'readwrite');
          tx.objectStore('handles').delete('folder');
          tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
        });
        budgetFolderHandle = null;
      } catch(e) { console.warn('Could not clear folder handle', e); }
    }

    async function saveHandle(handle) {
      try {
        const db = await openDB();
        await new Promise((res, rej) => {
          const tx = db.transaction('handles', 'readwrite');
          tx.objectStore('handles').put(handle, 'folder');
          tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
        });
      } catch(e) { console.warn('Could not persist folder handle', e); }
    }

    async function getSavedHandle() {
      try {
        const db = await openDB();
        return await new Promise((res, rej) => {
          const tx = db.transaction('handles', 'readonly');
          const req = tx.objectStore('handles').get('folder');
          req.onsuccess = e => res(e.target.result);
          req.onerror = e => rej(e.target.error);
        });
      } catch { return null; }
    }

    function txDedupKey(t) {
      return `${t.dateStr}|${t.narrative}|${t.debit}|${t.credit}|${t.account}`;
    }

    async function storeTransactions(txs, filename, existingKeys) {
      const unique = txs.filter(t => {
        const k = txDedupKey(t);
        if (existingKeys.has(k)) return false;
        existingKeys.add(k);
        return true;
      });
      if (!unique.length) return 0;
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction(['transactions', 'imported_files'], 'readwrite');
        unique.forEach(t => tx.objectStore('transactions').add(t));
        tx.objectStore('imported_files').put({ filename, importedAt: new Date(), count: unique.length }, filename);
        tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
      });
      return unique.length;
    }

    async function loadAllTransactions() {
      try {
        const db = await openDB();
        return await new Promise((res, rej) => {
          const tx = db.transaction('transactions', 'readonly');
          const items = [];
          const req = tx.objectStore('transactions').openCursor();
          req.onsuccess = e => {
            const cursor = e.target.result;
            if (cursor) {
              const item = { ...cursor.value, id: cursor.key };
              if (!item.vendor) item.vendor = vendorName(item.narrative);
              items.push(item);
              cursor.continue();
            } else res(items);
          };
          req.onerror = e => rej(e.target.error);
        });
      } catch { return []; }
    }

    async function getImportedFiles() {
      try {
        const db = await openDB();
        return await new Promise((res, rej) => {
          const tx = db.transaction('imported_files', 'readonly');
          const req = tx.objectStore('imported_files').getAll();
          req.onsuccess = e => {
            const map = {};
            e.target.result.forEach(r => map[r.filename] = r);
            res(map);
          };
          req.onerror = e => rej(e.target.error);
        });
      } catch { return {}; }
    }

    // ===== IMPORT =====

      document.getElementById('changeFolderBtn').style.display = show ? '' : 'none';

    async function doImport() {
      if (window.showDirectoryPicker) {
        const saved = await getSavedHandle();
        if (saved) {
          try {
            const perm = await saved.requestPermission({ mode: 'read' });
            if (perm === 'granted') {
              budgetFolderHandle = saved;
              showChangeFolderBtn(true);
              await importNewFiles();
            } else {
              showStatus('Access denied — click Import again to allow folder access');
            }
          } catch(e) {
            showStatus('Error: ' + e.message);
          }
          return;
        }
        try {
          const handle = await window.showDirectoryPicker({ id: 'budget', mode: 'read' });
          await saveHandle(handle);
          budgetFolderHandle = handle;
          showChangeFolderBtn(true);
          await importNewFiles();
          return;
        } catch(e) {
          if (e.name === 'AbortError') return;
          // API blocked (e.g. Brave shields) — fall through to file input
        }
      }
      document.getElementById('folderInput').click();
    }

    async function changeFolder() {
      await clearSavedHandle();
      showChangeFolderBtn(false);
      await doImport();

    async function importFromFileList(files) {
      // webkitdirectory recurses into sub-folders; keep top-level files only
      const csvFiles = Array.from(files).filter(f =>
        f.webkitRelativePath.split('/').length === 2 && /^Data_Export_.*\.csv$/i.test(f.name));
      if (!csvFiles.length) { showStatus('No Data_Export_*.csv files found'); return; }
      const imported = await getImportedFiles();
      const newFiles = csvFiles.filter(f => !imported[f.name]).sort((a, b) => a.name.localeCompare(b.name));
      if (!newFiles.length) {
        showStatus(`All ${csvFiles.length} file${csvFiles.length > 1 ? 's' : ''} already imported`);
        if (budgetTransactions.length) renderBudget();
        return;
      }
      const existingKeys = new Set((await loadAllTransactions()).map(txDedupKey));
      let totalNew = 0;
      for (const f of newFiles) {
        const text = await f.text();
        const txs = parseCSV(text);
        if (txs.length) totalNew += await storeTransactions(txs, f.name, existingKeys);
      }
      budgetTransactions = (await loadAllTransactions()).filter(t => !EXCLUDED_ACCOUNTS.has(t.account));
      const years = [...new Set(budgetTransactions.map(t => t.month.split('-')[0]))].sort();
      if (!budgetSelectedYear || !years.includes(budgetSelectedYear)) {
        budgetSelectedYear = years[years.length - 1] || null;
        budgetSelectedMonth = null;
      }
      showStatus(`Imported ${totalNew} new transaction${totalNew > 1 ? 's' : ''} from ${newFiles.length} file${newFiles.length > 1 ? 's' : ''}`);
      renderBudget();
    }

    async function importNewFiles(silent = false) {
      if (!budgetFolderHandle) return;
      const allFiles = [];
      for await (const [name, handle] of budgetFolderHandle.entries()) {
        if (handle.kind === 'file' && /^Data_Export_.*\.csv$/i.test(name)) allFiles.push({ name, handle });
      }
      if (!allFiles.length) { if (!silent) showStatus('No Data_Export_*.csv files found'); return; }

      const imported = await getImportedFiles();
      const newFiles = allFiles.filter(f => !imported[f.name]).sort((a, b) => a.name.localeCompare(b.name));

      if (!newFiles.length) {
        if (!silent) showStatus(`All ${allFiles.length} file${allFiles.length > 1 ? 's' : ''} already imported`);
        if (!silent && budgetTransactions.length) renderBudget();
        return;
      }

      const existingKeys = new Set((await loadAllTransactions()).map(txDedupKey));
      let totalNew = 0;
      for (const f of newFiles) {
        const text = await (await f.handle.getFile()).text();
        const txs = parseCSV(text);
        if (txs.length) totalNew += await storeTransactions(txs, f.name, existingKeys);
      }

      budgetTransactions = (await loadAllTransactions()).filter(t => !EXCLUDED_ACCOUNTS.has(t.account));
      const months = [...new Set(budgetTransactions.map(t => t.month))].sort();
      if (!budgetSelectedMonth || !months.includes(budgetSelectedMonth)) {
        budgetSelectedMonth = months[months.length - 1] || null;
      }
      const years = [...new Set(budgetTransactions.map(t => t.month.split('-')[0]))].sort();
      if (!budgetSelectedYear || !years.includes(budgetSelectedYear)) {
        budgetSelectedYear = years[years.length - 1] || null;
        budgetSelectedMonth = null;
      }
      showStatus(`Imported ${totalNew} new transaction${totalNew > 1 ? 's' : ''} from ${newFiles.length} file${newFiles.length > 1 ? 's' : ''}`);
      renderBudget();
    }

    async function autoCheckNewFiles() {
      const handle = budgetFolderHandle || await getSavedHandle();

      budgetFolderHandle = handle;

    // ===== CSV PARSING =====
    function parseCSVRow(line) {
      const out = []; let cur = '', inQ = false;
      for (const c of line) {
        if (c === '"') inQ = !inQ;
        else if (c === ',' && !inQ) { out.push(cur); cur = ''; }
        else cur += c;
      }
      out.push(cur);
      return out;
    }

    function parseCSV(text) {
      const lines = text.replace(/^﻿/, '').trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const headers = parseCSVRow(lines[0]).map(h => h.trim());
      const out = [];
      for (let i = 1; i < lines.length; i++) {
        const vals = parseCSVRow(lines[i]);
        if (vals.length < 3) continue;
        const r = {};
        headers.forEach((h, idx) => r[h] = (vals[idx] || '').trim());
        const debit = parseFloat(r['Debit Amount']) || 0;
        const credit = parseFloat(r['Credit Amount']) || 0;
        const dateStr = r['Date'] || '';
        const m = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (!m) continue;
        const date = new Date(+m[3], +m[2] - 1, +m[1]);
        const month = `${m[3]}-${m[2].padStart(2, '0')}`;
        const narrative = r['Narrative'] || '';
        out.push({
          account: r['Bank Account'] || '',
          dateStr, date, month,
          narrative,
          vendor: vendorName(narrative),
          debit, credit,
          balance: parseFloat(r['Balance']) || 0,
          category: (r['Categories'] || 'Uncategorised').trim() || 'Uncategorised',
        });
      }
      return out;
    }

    // ===== ANALYSIS =====
    function filtered() {
      let txs = budgetTransactions;
      if (budgetSelectedAccount) txs = txs.filter(t => t.account === budgetSelectedAccount);
      if (budgetSelectedMonth) return txs.filter(t => t.month === budgetSelectedMonth);
      if (budgetSelectedYear) return txs.filter(t => t.month.startsWith(budgetSelectedYear));
      return txs;
    }

    function allMonths() {
      const months = [...new Set(budgetTransactions.map(t => t.month))].sort().reverse();
      return budgetSelectedYear ? months.filter(m => m.startsWith(budgetSelectedYear)) : months;
    }

    function allYears() {
      return [...new Set(budgetTransactions.map(t => t.month.split('-')[0]))].sort().reverse();
    }

    function fmtMonth(ym) {
      const [y, mo] = ym.split('-');
      return new Date(+y, +mo - 1, 1).toLocaleString('default', { month: 'short', year: 'numeric' });
    }

    function fmtAUD(n) {
      return '$' + Math.abs(n).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function catSpending(txs, inclUnaccounted = false) {
      const m = {};
      txs.forEach(t => { if (t.debit > 0) { const c = effectiveCat(t); if (!inclUnaccounted && (c === 'Uncategorised' || EXCLUDED_CATS.has(c))) return; m[c] = (m[c] || 0) + t.debit; } });
      return Object.entries(m).sort((a, b) => b[1] - a[1]);
    }

    function avgMonthlyCatSpending(inclUnaccounted = false) {
      let base = budgetTransactions;
      if (budgetSelectedAccount) base = base.filter(t => t.account === budgetSelectedAccount);
      const numMonths = new Set(base.map(t => t.month)).size || 1;
      const totals = {};
      base.forEach(t => { if (t.debit > 0) { const c = effectiveCat(t); if (!inclUnaccounted && (c === 'Uncategorised' || EXCLUDED_CATS.has(c))) return; totals[c] = (totals[c] || 0) + t.debit; } });
      const avgs = {};
      for (const [cat, total] of Object.entries(totals)) avgs[cat] = total / numMonths;
      return avgs;
    }

    const _vendorCache = new Map();
    function vendorName(narrative) {
      if (_vendorCache.has(narrative)) return _vendorCache.get(narrative);
      const cleaned = cleanMerchant(narrative);
      if (!cleaned) { _vendorCache.set(narrative, narrative.trim().slice(0, 40)); return _vendorCache.get(narrative); }
      for (const [pat, name] of BRAND_NORMS) {
        if (pat.test(cleaned)) { _vendorCache.set(narrative, name); return name; }
      }
      _vendorCache.set(narrative, cleaned);
      return cleaned;
    }

    function _cleanMerchant(n) {
      return n
        // card / payment method prefixes
        .replace(/^(visa\s+(purchase|debit\s+purchase|credit\s+purchase)|mc\s+purchase|mastercard\s+purchase)\s*/i, '')
        .replace(/^(eftpos\s+(purchase\s+)?|tap\s+and\s+pay\s+|contactless\s+purchase\s+)/i, '')
        .replace(/^(recurring\s+payment\s+to\s+|internet\s+purchase\s+|online\s+purchase\s+)/i, '')
        .replace(/^(osko\s+(payment\s+to\s+)?|npp\s+(credit|debit)\s+)/i, '')
        .replace(/^(paypal|sq)\s*\*\s*/i, '')
        .replace(/^direct\s+debit\s+/i, '')
        .replace(/^payment\s+by\s+authority\s+to\s+/i, '')
        .replace(/^bpay\s+/i, '')
        .replace(/^(atm\s+withdrawal\s+|atm\s+)/i, '')
        // legal suffixes
        .replace(/\b(pty\s+ltd|pty|ltd|p\/l|inc|co)\b\.?/gi, '')
        // domain suffixes (e.g. NETFLIX.COM, STAN.COM.AU)
        .replace(/\.(com\.au|com|net\.au|net|org\.au|org|au)\b/gi, '')
        // standalone store/ref numbers (3+ digits)
        .replace(/\s+\d{3,}(\s|$)/g, ' ')
        // Australian states and country
        .replace(/\b(aus|aust|australia|qld|nsw|vic|sa|wa|tas|act|nt)\b/gi, '')
        .replace(/[^a-zA-Z0-9\s&'\-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase()
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function topMerchants(txs, n = 20) {
      const m = {};
      const SKIP = new Set(['Paypal', 'Sq', 'Square', 'Osko', 'Bpay']);
      txs.forEach(t => {
        if (t.debit > 0) {
          const cat = effectiveCat(t);
          if (EXCLUDED_CATS.has(cat) || cat === 'Uncategorised') return;
          const key = t.vendor || vendorName(t.narrative);
          if (key && !SKIP.has(key)) {
            if (!m[key]) m[key] = { amt: 0, narrative: t.narrative };
            m[key].amt += t.debit;
          }
        }
      });
      return Object.entries(m)
        .map(([name, { amt, narrative }]) => [name, amt, autoCategory(narrative) || 'Other'])
        .sort((a, b) => b[1] - a[1])
        .slice(0, n);
    }

    function monthlyTotals() {
      const m = {};
      budgetTransactions.forEach(t => {
        const _c = effectiveCat(t);
        if (EXCLUDED_CATS.has(_c) || _c === 'Uncategorised') return;
        if (!m[t.month]) m[t.month] = { inc: 0, exp: 0 };
        m[t.month].inc += t.credit;
        m[t.month].exp += t.debit;
      });
      return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0]));
    }

    function annualTotals() {
      const m = {};
      budgetTransactions.forEach(t => {
        const _c = effectiveCat(t);
        if (EXCLUDED_CATS.has(_c) || _c === 'Uncategorised') return;
        const year = t.month.split('-')[0];
        if (!m[year]) m[year] = { inc: 0, exp: 0 };
        m[year].inc += t.credit;
        m[year].exp += t.debit;
      });
      return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0]));
    }

    function balanceChartSVG(txs) {
      const sorted = txs.slice().sort((a, b) => a.date - b.date).filter(t => t.balance !== 0 || t.debit || t.credit);
      if (sorted.length < 2) return '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px">Not enough data</div>';

      const acc = sorted[0]?.account || null;

      const W = 800, H = 130, padL = 62, padR = 16, padT = 12, padB = 28;
      const cW = W - padL - padR, cH = H - padT - padB;

      const minBal = Math.min(...sorted.map(t => t.balance));
      const maxBal = Math.max(...sorted.map(t => t.balance));
      const balRange = maxBal - minBal || 1;
      const minTs = sorted[0].date.getTime();
      const maxTs = sorted[sorted.length - 1].date.getTime();
      const tsRange = maxTs - minTs || 1;

      const tx = d => padL + ((d.getTime() - minTs) / tsRange) * cW;
      const ty = b => padT + cH - ((b - minBal) / balRange) * cH;

      // grid + y labels
      const yTicks = 3;
      let grid = '';
      for (let i = 0; i <= yTicks; i++) {
        const b = minBal + (balRange * i / yTicks);
        const y = ty(b);
        grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#eeeee9" stroke-width="1"/>`;
        grid += `<text x="${padL - 5}" y="${y + 4}" text-anchor="end" font-size="9" fill="#8c8c8a">$${Math.round(b).toLocaleString('en-AU')}</text>`;
      }

      // zero line
      const zeroLine = (minBal < 0 && maxBal > 0)
        ? `<line x1="${padL}" y1="${ty(0)}" x2="${W - padR}" y2="${ty(0)}" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>`
        : '';

      // x-axis date labels
      const xTicks = Math.min(6, sorted.length);
      let xLabels = '';
      for (let i = 0; i < xTicks; i++) {
        const t = sorted[Math.round((sorted.length - 1) * i / (xTicks - 1))];
        const x = tx(t.date);
        const label = t.date.toLocaleDateString('en-AU', { month: 'short', year: '2-digit' });
        xLabels += `<text x="${x}" y="${H - 4}" text-anchor="middle" font-size="9" fill="#8c8c8a">${label}</text>`;
      }

      const pts = sorted.map(t => `${tx(t.date).toFixed(1)},${ty(t.balance).toFixed(1)}`).join(' ');
      const lines = `<polyline points="${pts}" fill="none" stroke="${acctColor(acc)}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
      const legend = '';

      return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
        ${grid}${zeroLine}${lines}${xLabels}
        ${legend ? `<text x="${padL}" y="10" font-size="9" font-family="Inter,sans-serif">${legend}</text>` : ''}
      </svg>`;
    }

    let _recurringCache = null;
    let _recurringTxLen = -1;
    function getRecurring() {
      if (_recurringCache !== null && _recurringTxLen === budgetTransactions.length) return _recurringCache;
      _recurringCache = detectRecurring(budgetTransactions);
      _recurringTxLen = budgetTransactions.length;
      return _recurringCache;
    }

    function detectRecurring(allTxs) {
      const FREQS = [
        { label: 'Weekly',      min: 5,   max: 10,  minCount: 6, checkDayOfMonth: false, maxCv: 0.30 },
        { label: 'Fortnightly', min: 11,  max: 20,  minCount: 6, checkDayOfMonth: false, maxCv: 0.30 },
        { label: 'Monthly',     min: 21,  max: 45,  minCount: 6, checkDayOfMonth: false, maxCv: 0.30 },
        { label: 'Bimonthly',   min: 46,  max: 74,  minCount: 4, checkDayOfMonth: true,  maxCv: 0.20 },
        { label: 'Quarterly',   min: 75,  max: 110, minCount: 4, checkDayOfMonth: true,  maxCv: 0.15 },
        { label: 'Annual',      min: 330, max: 400, minCount: 3, checkDayOfMonth: true,  maxCv: 0.15 },
      ];

      function normalizeNarrative(n) {
        const s = n
          .toLowerCase()
          .replace(/^paypal\s*\*\s*/g, '')               // strip PAYPAL * prefix
          .replace(/^direct\s*debit\s*/g, '')            // strip DIRECT DEBIT prefix
          .replace(/^bpay\s+/g, '')                      // strip BPAY prefix
          .replace(/\d{1,2}\/\d{1,2}(\/\d{2,4})?/g, '') // strip embedded dates
          .replace(/\b[a-z0-9]*\d[a-z0-9]{3,}\b/g, '')  // strip ref codes with digits
          .replace(/\b\d+\b/g, '')                        // strip standalone numbers
          .replace(/[^a-z\s]/g, ' ')                      // strip special chars
          .replace(/\s+/g, ' ').trim();
        // Keep only words ≥4 chars and sort — makes order and short noise words irrelevant
        return s.split(' ').filter(w => w.length >= 4).sort().join(' ');
      }

      const byName = {};
      allTxs.forEach(t => {
        if (t.debit <= 0) return;
        const key = normalizeNarrative(t.narrative);
        if (!key) return;
        if (!byName[key]) byName[key] = [];
        byName[key].push(t);
      });

      const results = [];
      for (const [name, txs] of Object.entries(byName)) {
        if (txs.length < 3) continue;
        const sorted = txs.slice().sort((a, b) => a.date - b.date);

        // Deduplicate by month — multiple charges in the same month count as one billing event
        const byMonth = {};
        sorted.forEach(t => { byMonth[t.month] = t; });
        const deduped = Object.values(byMonth).sort((a, b) => a.date - b.date);
        if (deduped.length < 3) continue;

        const gaps = [];
        for (let i = 1; i < deduped.length; i++)
          gaps.push((deduped[i].date - deduped[i - 1].date) / 86400000);

        const avgGap = gaps.reduce((s, g) => s + g, 0) / gaps.length;
        const stddev = Math.sqrt(gaps.reduce((s, g) => s + (g - avgGap) ** 2, 0) / gaps.length);
        const cv = stddev / avgGap;

        const freq = FREQS.find(f => avgGap >= f.min && avgGap <= f.max);
        if (!freq) continue;
        if (cv > freq.maxCv) continue;
        if (deduped.length < freq.minCount) continue;

        if (freq.checkDayOfMonth) {
          const days = deduped.map(t => t.date.getDate());
          const avgDay = days.reduce((s, d) => s + d, 0) / days.length;
          const dayStddev = Math.sqrt(days.reduce((s, d) => s + (d - avgDay) ** 2, 0) / days.length);
          if (dayStddev > 7) continue;
        }

        const amounts = deduped.map(t => t.debit);
        const avgAmt = amounts.reduce((s, a) => s + a, 0) / amounts.length;
        const amtStddev = Math.sqrt(amounts.reduce((s, a) => s + (a - avgAmt) ** 2, 0) / amounts.length);
        const amtCv = amtStddev / avgAmt;
        if (amtCv > 0.25) continue;

        const last = deduped[deduped.length - 1];
        results.push({ name: last.narrative, count: deduped.length, avgAmt, lastDate: last.dateStr, category: effectiveCat(last), freq: freq.label });
      }
      return results.sort((a, b) => b.avgAmt - a.avgAmt);
    }

    // ===== HELPERS =====
    function buildDonut(entries, total) {
      const top = entries.slice(0, 8);
      const otherAmt = entries.slice(8).reduce((s, [, a]) => s + a, 0);
      if (!top.length) return { svg: '', legend: '' };
      const allSlices = [...top, ...(otherAmt > 0 ? [['Other', otherAmt]] : [])].sort((a, b) => b[1] - a[1]);
      const r = 54, cx = 74, cy = 74, sw = 26;
      const C = 2 * Math.PI * r;
      let cum = 0;
      const slices = allSlices.map(([cat, amt]) => {
        const color = cat === 'Other' ? '#9ca3af' : catColor(cat);
        const dash = (amt / total) * C;
        const esc = cat.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const s = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
          stroke-dasharray="${dash.toFixed(2)} ${(C - dash).toFixed(2)}"
          stroke-dashoffset="${(C / 4 - cum).toFixed(2)}"
          style="cursor:pointer" onclick="selectDonutCat('${esc}')"><title>${cat}: ${fmtAUD(amt)} (${Math.round((amt/total)*100)}%)</title></circle>`;
        cum += dash;
        return s;
      }).join('');
      const legendRows = allSlices.map(([cat, amt]) => {
        const pct = Math.round((amt / total) * 100);
        const color = cat === 'Other' ? '#9ca3af' : catColor(cat);
        const muted = cat === 'Other';
        const esc = muted ? '' : cat.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const rowAttrs = `onclick="selectDonutCat('${esc}')" style="cursor:pointer;background:${_bdSelectedCat===cat?'var(--bg-secondary)':''}" onmouseover="this.style.background='var(--bg-secondary)'" onmouseout="this.style.background='${_bdSelectedCat===cat?'var(--bg-secondary)':''}'"` ;
        return `<tr ${rowAttrs}>
          <td style="padding:3px 6px 3px 0;width:12px"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${color}"></span></td>
          <td style="padding:3px 4px;font-size:12px;color:${muted ? 'var(--text-muted)' : 'var(--text-primary)'}">${cat}</td>
          <td style="padding:3px 4px;font-size:11px;color:var(--text-muted);text-align:right;white-space:nowrap">${pct}%</td>
          <td style="padding:3px 0 3px 8px;font-size:12px;font-weight:${muted ? '400' : '600'};color:${muted ? 'var(--text-muted)' : 'var(--text-primary)'};text-align:right;white-space:nowrap">${fmtAUD(amt)}</td>
        </tr>`;
      }).join('');
      const legend = `<table style="width:auto;border-collapse:collapse">${legendRows}</table>`;
      const svg = `<svg width="${cx*2}" height="${cy*2}" style="flex-shrink:0;overflow:visible">
        ${slices}
        <text x="${cx}" y="${cy-7}" text-anchor="middle" style="font-size:10px;fill:var(--text-muted)">Total</text>
        <text x="${cx}" y="${cy+10}" text-anchor="middle" style="font-size:13px;font-weight:700;fill:var(--text-primary)">${fmtAUD(total)}</text>
      </svg>`;
      return { svg, legend };
    }

          <button onclick="event.stopPropagation();openParentPicker('${esc}',this)" style="background:none;border:none;padding:2px 4px;cursor:pointer;font-size:12px;color:var(--text-muted);line-height:1;flex-shrink:0" title="Move / change parent">⤵</button>
          <button onclick="event.stopPropagation();showRenameCategoryModal('${esc}')" style="background:none;border:none;padding:2px 4px;cursor:pointer;font-size:11px;color:var(--text-muted);line-height:1;flex-shrink:0" title="Rename">✏</button>
          <button onclick="event.stopPropagation();toggleExcludedCat('${esc}')" style="background:none;border:none;padding:2px 4px;cursor:pointer;font-size:12px;color:${excluded?'#ef4444':'var(--text-muted)'};line-height:1;flex-shrink:0" title="${excluded?'Unaccounted':'Mark unaccounted'}">⊘</button>
          ${txCount===0?`<button onclick="event.stopPropagation();deleteCat('${esc}')" style="background:none;border:none;padding:2px 4px;cursor:pointer;font-size:12px;color:#ef4444;line-height:1;flex-shrink:0" title="Delete empty category">🗑</button>`:''}
        </div>`;
      };

      const topLevelCats = Object.keys(CAT_COLORS).filter(c => c !== 'Uncategorised' && c !== 'Other' && !_sp[c]).sort((a, b) => {
        const aEx = EXCLUDED_CATS.has(a), bEx = EXCLUDED_CATS.has(b);
        if (aEx !== bEx) return aEx ? 1 : -1;
        return a.localeCompare(b);
      });

      const catGroups = topLevelCats.map(cat => {
        const children = childrenOf(cat);
        const color = catColor(cat);
        const escCat = cat.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const childRows = children.map(c => makeCatRow(c, true)).join('');
        const addSubLink = `<div onclick="showAddCategoryModal('${escCat}')" style="cursor:pointer;display:flex;align-items:center;gap:6px;padding:3px 10px 4px 28px;border-radius:6px;transition:background .1s" onmouseenter="this.style.background='var(--bg-secondary)'" onmouseleave="this.style.background='transparent'">
          <span style="font-size:11px;color:var(--text-muted)">+ Add sub-category</span>
        </div>`;
        return `<div style="background:var(--bg-card);border:1px solid var(--border);border-left:4px solid ${color};border-radius:10px;padding:4px">
          ${makeCatRow(cat, false)}${childRows}${addSubLink}
        </div>`;
      }).join('');

      const uncatAmt = catSpendMap['Uncategorised'] || 0;
      const uncatEsc = 'Uncategorised';
      const uncatCount = txs.filter(t => effectiveCat(t) === 'Uncategorised').length;
      const uncatSelected = budgetSelectedCategory === 'Uncategorised';
      const uncatRow = `<div onclick="selectCategory('${uncatEsc}')" style="cursor:pointer;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:6px;background:${uncatSelected?'var(--bg-secondary)':'transparent'};transition:background .1s" onmouseenter="this.style.background='var(--bg-secondary)'" onmouseleave="this.style.background='${uncatSelected?'var(--bg-secondary)':'transparent'}'">
        <span style="width:9px;height:9px;border-radius:50%;background:#9ca3af;flex-shrink:0"></span>
        <span style="flex:1;font-size:13px;font-weight:600;color:var(--text-primary)">Uncategorised</span>
        <span style="font-size:13px;font-weight:600;color:${uncatAmt>0?'#9ca3af':'var(--text-muted)'};min-width:80px;text-align:right;flex-shrink:0">${uncatAmt>0?fmtAUD(uncatAmt):'—'}</span>
        <span style="min-width:80px;flex-shrink:0"></span>
        <span style="font-size:11px;color:var(--text-muted);min-width:36px;text-align:right;flex-shrink:0">${uncatCount>0?uncatCount+'&nbsp;tx':''}</span>
        <span style="width:11px;flex-shrink:0"></span><span style="width:12px;flex-shrink:0"></span>
      </div>`;
      const catGrid = `<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:24px">
        <div style="display:flex;justify-content:flex-end">
          <button onclick="showAddCategoryModal()" class="primary" style="font-size:12px;padding:6px 14px;border-radius:6px;cursor:pointer;font-family:inherit">+ New category</button>
        </div>
        ${catGroups}
        <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:4px">${uncatRow}</div>
      </div>`;

      // Top spending categories panel for the Categories tab
      const topSpendCats = catSpending(txs).filter(([, amt]) => amt > 0).slice(0, 10);
      const maxTopSpend = topSpendCats[0]?.[1] || 1;
      const topSpendRows = topSpendCats.map(([cat, amt], i) => {
        const color = catColor(cat);
        const esc = cat.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const lim = budgetLimits[cat];
        const over = lim && amt > lim;
        return `<div class="budget-bar-row" onclick="selectCategory('${esc}')" style="cursor:pointer">
          <div class="budget-rank">${i + 1}</div>
          <div style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0"></div>
          <div class="budget-bar-label">${cat}</div>
          <div class="budget-bar-wrap"><div class="budget-bar${over ? ' over' : ''}" style="width:${(amt/maxTopSpend)*100}%;background:${over ? '#ef4444' : color}"></div></div>
          <div class="budget-bar-amount">${fmtAUD(amt)}</div>
          <div class="budget-bar-extra">${lim ? `<span class="${over ? 'over' : 'under'}">${over ? '⚠ ' : ''}/ ${fmtAUD(lim)}</span>` : ''}</div>
        </div>`;
      }).join('');
      const topSpendPanel = topSpendCats.length ? `<div style="margin-bottom:24px">
        <div class="budget-section-title" style="margin-bottom:10px">Top spending categories</div>
        <div class="budget-panel-box">${topSpendRows}</div>
      </div>` : '';

      let catTabContent = topSpendPanel + catGrid;
      if (budgetSelectedCategory) {
        catTabContent += catDrillPanel;
      }

      const tabs = `<div class="budget-tabs">
        <button class="budget-tab${budgetSelectedTab==='overview'?' active':''}" onclick="selectTab('overview')">Overview</button>
        <button class="budget-tab${budgetSelectedTab==='all'?' active':''}" onclick="selectTab('all')">All</button>
        <button class="budget-tab${budgetSelectedTab==='categories'?' active':''}" onclick="selectTab('categories')">Categories</button>
        <button class="budget-tab${budgetSelectedTab==='transactions'?' active':''}" onclick="selectTab('transactions')">Transactions</button>
        <button class="budget-tab${budgetSelectedTab==='trends'?' active':''}" onclick="selectTab('trends')">Trends</button>
        <button class="budget-tab${budgetSelectedTab==='budget'?' active':''}" onclick="selectTab('budget')">Budget</button>
        <button class="budget-tab${budgetSelectedTab==='recurring'?' active':''}" onclick="selectTab('recurring')">Recurring</button>
      </div>`;

      document.getElementById('stickyBar').innerHTML = acctSel + yearSel + monthSel + tabs;

      // Spending alerts — shown when any category exceeds its budget limit
      const overBudgetCats = cats.filter(([cat, amt]) => budgetLimits[cat] && amt > budgetLimits[cat]);
      let spendingAlerts = '';
      if (overBudgetCats.length > 0) {
        const alertItems = overBudgetCats.map(([cat, amt]) => {
          const lim = budgetLimits[cat];
          const color = catColor(cat);
          const pct = Math.round((amt / lim - 1) * 100);
          const esc = cat.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
          return `<span onclick="selectOverviewCategory('${esc}')" style="cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:3px 8px;font-size:12px"><span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block"></span><span style="font-weight:600;color:#dc2626">${cat}</span> <span style="color:#ef4444">${fmtAUD(amt)}</span><span style="color:#9ca3af;font-size:10px">&nbsp;/ ${fmtAUD(lim)} (+${pct}%)</span></span>`;
        }).join('');
        spendingAlerts = `<div style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span style="font-size:12px;font-weight:700;color:#dc2626;flex-shrink:0">⚠ Over budget:</span>${alertItems}</div>`;
      }

      // Largest transactions panel for the Transactions tab
      const largestTxs = filtered().filter(t => t.debit > 0).sort((a, b) => b.debit - a.debit).slice(0, 15);
      const largestTxPanel = sec('largest', 'Largest transactions', `<div class="budget-tx-list">${renderTxRows(largestTxs)}</div>`);

      let tabContent = '';
      if (budgetSelectedTab === 'overview' || budgetSelectedTab === 'all') {
        let overviewDrill = '';
        if (budgetSelectedCategory) {
          overviewDrill = catDrillPanel;
        } else if (budgetSelectedIncomeSource) {
          overviewDrill = incDetailPanel;
        }
        // Last month vs avg vs current month comparison panel
        const _cmpMonthlyData = monthlyTotals();
        const _todayM = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
        const _cmpAllMonths = _cmpMonthlyData.map(([m]) => m);
        const _cmpCurMonth = _cmpAllMonths.includes(_todayM) ? _todayM : _cmpAllMonths[_cmpAllMonths.length - 1] || null;
        const _cmpLastMonth = _cmpCurMonth ? _cmpAllMonths[_cmpAllMonths.indexOf(_cmpCurMonth) - 1] || null : null;
        const _cmpN = _cmpAllMonths.length || 1;
        const _cmpGet = m => { const d = _cmpMonthlyData.find(([k]) => k === m); return d ? d[1] : { inc: 0, exp: 0 }; };
        const _cmpLifetime = _cmpMonthlyData.reduce((a, [, d]) => ({ inc: a.inc + d.inc, exp: a.exp + d.exp }), { inc: 0, exp: 0 });
        const _cmpAvg = { inc: _cmpLifetime.inc / _cmpN, exp: _cmpLifetime.exp / _cmpN };
        const _cmpCur = _cmpGet(_cmpCurMonth);
        const _cmpLast = _cmpGet(_cmpLastMonth);

        const _cmpCol = (label, data, highlight = false) => {
          const net = data.inc - data.exp;
          const bold = highlight ? 'font-weight:700' : 'font-weight:400';
          return `<td style="text-align:right;padding:8px 16px;border-left:1px solid var(--border-light)">
            <div style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:8px;white-space:nowrap">${label}</div>
            <div style="font-size:13px;${bold};color:#16a34a;margin-bottom:4px">${data.inc > 0 ? '+' + fmtAUD(data.inc) : '—'}</div>
            <div style="font-size:13px;${bold};color:var(--accent);margin-bottom:4px">${data.exp > 0 ? '−' + fmtAUD(data.exp) : '—'}</div>
            <div style="font-size:13px;${bold};color:${net >= 0 ? '#16a34a' : '#ef4444'};border-top:1px solid var(--border-light);padding-top:4px;margin-top:2px">${net >= 0 ? '+' : '−'}${fmtAUD(Math.abs(net))}</div>
          </td>`;
        };
        const monthlyComparePanel = `<div style="margin-bottom:16px">
          <div class="budget-section-title" style="margin-bottom:10px">Monthly comparison</div>
          <div class="budget-panel-box" style="padding:0;overflow:hidden">
            <table style="width:100%;border-collapse:collapse">
              <tbody><tr>
                <td style="padding:8px 16px;vertical-align:bottom">
                  <div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">&nbsp;</div>
                  <div style="font-size:12px;color:#16a34a;margin-bottom:4px">Income</div>
                  <div style="font-size:12px;color:var(--accent);margin-bottom:4px">Expenses</div>
                  <div style="font-size:12px;color:var(--text-muted);border-top:1px solid var(--border-light);padding-top:4px;margin-top:2px">Net</div>
                </td>
                ${_cmpLastMonth ? _cmpCol(fmtMonth(_cmpLastMonth), _cmpLast) : ''}
                ${_cmpCol('Avg / mo', _cmpAvg)}
                ${_cmpCol(_cmpCurMonth ? fmtMonth(_cmpCurMonth) : 'Current', _cmpCur, true)}
              </tr></tbody>
            </table>
          </div>
        </div>`;

        const _ovPanels = { cards, savings: savingsPanel, annual: annualSummaryPanel, breakdown: spendingBreakdownPanel, compare: comparePanel, monthlyCompare: monthlyComparePanel };
        const _ovOrder = getOverviewOrder();
        const _ovFull = [..._ovOrder.filter(id => id in _ovPanels), ...OV_DEFAULT_ORDER.filter(id => !_ovOrder.includes(id) && id in _ovPanels)];
        const _ovHtml = _ovFull.map(id => _ovPanels[id] ? ovDraggable(id, _ovPanels[id]) : '').join('');
        tabContent = spendingAlerts + `<div id="overview-panels">${_ovHtml}</div>` + overviewDrill;
      } else if (budgetSelectedTab === 'categories') {
        tabContent = catTabContent;
      } else if (budgetSelectedTab === 'transactions') {
        tabContent = catDetailPanel + merchPanel + largestTxPanel + txPanel + sourcesHtml;
      } else if (budgetSelectedTab === 'trends') {
        const heatMonths = allMonths().slice().reverse(); // chronological left-to-right

        // Category heatmap — all-time data, account-filtered, no excluded/uncategorised
        const catHeatData = {};
        budgetTransactions.forEach(t => {
          if (t.debit <= 0) return;
          if (budgetSelectedAccount && t.account !== budgetSelectedAccount) return;
          const cat = effectiveCat(t);
          if (EXCLUDED_CATS.has(cat) || cat === 'Uncategorised') return;
          if (!catHeatData[cat]) catHeatData[cat] = {};
          catHeatData[cat][t.month] = (catHeatData[cat][t.month] || 0) + t.debit;
        });
        const catHeatRows = Object.entries(catHeatData)
          .map(([cat, data]) => [cat, Object.values(data).reduce((s, v) => s + v, 0)])
          .sort((a, b) => b[1] - a[1]).slice(0, 12)
          .map(([cat]) => ({ name: cat, color: catColor(cat), data: catHeatData[cat] }));

        // Vendor heatmap — top 15 vendors by total spend, no excluded/uncategorised
        const vendorHeatData = {};
        budgetTransactions.forEach(t => {
          if (t.debit <= 0) return;
          if (budgetSelectedAccount && t.account !== budgetSelectedAccount) return;
          const cat = effectiveCat(t);
          if (EXCLUDED_CATS.has(cat) || cat === 'Uncategorised') return;
          const vendor = t.vendor || vendorName(t.narrative);
          if (!vendor) return;
          if (!vendorHeatData[vendor]) vendorHeatData[vendor] = {};
          vendorHeatData[vendor][t.month] = (vendorHeatData[vendor][t.month] || 0) + t.debit;
        });
        const vendorHeatRows = Object.entries(vendorHeatData)
          .map(([v, data]) => [v, Object.values(data).reduce((s, a) => s + a, 0)])
          .sort((a, b) => b[1] - a[1]).slice(0, 15)
          .map(([vendor]) => ({ name: vendor, color: '#3b82f6', data: vendorHeatData[vendor] }));

        const catHeatPanel    = sec('catheat',  'Category heatmap', `<div class="budget-panel-box" style="padding:12px 16px">${buildHeatmap(catHeatRows, heatMonths)}</div>`);
        const vendorHeatPanel = sec('vendheat', 'Vendor heatmap',   `<div class="budget-panel-box" style="padding:12px 16px">${buildHeatmap(vendorHeatRows, heatMonths)}</div>`);

        // Category line chart — top 6 categories, monthly spend over time
        const _clMonths = heatMonths; // chronological
        const _clTopCats = Object.entries(catHeatData)
          .map(([cat, data]) => [cat, Object.values(data).reduce((s, v) => s + v, 0)])
          .sort((a, b) => b[1] - a[1]).slice(0, 6).map(([cat]) => cat);
        let catLinePanel = '';
        if (_clTopCats.length && _clMonths.length >= 2) {
          const W = 800, H = 200, padL = 66, padR = 16, padT = 14, padB = 24;
          const cW = W - padL - padR, cH = H - padT - padB;
          const n = _clMonths.length;
          const maxVal = Math.max(..._clTopCats.flatMap(cat => _clMonths.map(m => catHeatData[cat]?.[m] || 0)), 1);
          const tx = i => padL + (n > 1 ? (i / (n - 1)) * cW : cW / 2);
          const ty = v => padT + cH - (v / maxVal) * cH;
          let grid = '';
          for (let i = 0; i <= 4; i++) {
            const v = maxVal * i / 4;
            const y = ty(v);
            grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W - padR}" y2="${y.toFixed(1)}" stroke="var(--border-light)" stroke-width="1"/>`;
            grid += `<text x="${padL - 5}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="9" fill="#8c8c8a">${fmtAUD(v)}</text>`;
          }
          const xStep = Math.max(1, Math.floor(n / 10));
          let xLabels = '';
          _clMonths.forEach((m, i) => {
            if (i % xStep !== 0 && i !== n - 1) return;
            const [yr, mo] = m.split('-');
            const lbl = new Date(+yr, +mo - 1).toLocaleDateString('en-AU', { month: 'short', year: '2-digit' });
            xLabels += `<text x="${tx(i).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="9" fill="#8c8c8a">${lbl}</text>`;
          });
          const lines = _clTopCats.map(cat => {
            const pts = _clMonths.map((m, i) => `${tx(i).toFixed(1)},${ty(catHeatData[cat]?.[m] || 0).toFixed(1)}`).join(' ');
            return `<polyline points="${pts}" fill="none" stroke="${catColor(cat)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>`;
          }).join('');
          const chartSvg = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${grid}${lines}${xLabels}</svg>`;
          const legendHtml = `<div style="display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:10px">${_clTopCats.map(cat =>
            `<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-muted)">
              <span style="display:inline-block;width:20px;height:3px;border-radius:2px;background:${catColor(cat)}"></span>${cat}
            </span>`).join('')}</div>`;
          catLinePanel = sec('catline', 'Category trends', `<div class="budget-panel-box" style="padding:12px 16px">${chartSvg}${legendHtml}</div>`);
        }

        tabContent = catLinePanel + catHeatPanel + vendorHeatPanel + cards + balPanel + annualPanel + trendPanel;
      } else if (budgetSelectedTab === 'budget') {
        const budgetYears = [...new Set(budgetTransactions.map(t => t.month.split('-')[0]))].sort();

        // Per-category per-year spend totals
        const catYearData = {};
        const catTotalCredits = {};
        let bBase = budgetTransactions;
        if (budgetSelectedAccount) bBase = bBase.filter(t => t.account === budgetSelectedAccount);
        bBase.forEach(t => {
          const cat = effectiveCat(t);
          if (EXCLUDED_CATS.has(cat) || cat === 'Uncategorised') return;
          if (t.debit > 0) {
            const yr = t.month.split('-')[0];
            if (!catYearData[cat]) catYearData[cat] = {};
            catYearData[cat][yr] = (catYearData[cat][yr] || 0) + t.debit;
          }
          if (t.credit > 0) catTotalCredits[cat] = (catTotalCredits[cat] || 0) + t.credit;
        });
        // Exclude income-dominant categories (total credits > total debits)
        for (const cat of Object.keys(catYearData)) {
          const totalDebit = Object.values(catYearData[cat]).reduce((s, v) => s + v, 0);
          if ((catTotalCredits[cat] || 0) > totalDebit) delete catYearData[cat];
        }

        const allBaseMonths = [...new Set(bBase.map(t => t.month))].sort();
        const numBaseMonths = allBaseMonths.length || 1;

        // Current month: prefer today's month if data exists, else latest in dataset
        const todayMonth = `${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
        const curMonth = allBaseMonths.includes(todayMonth) ? todayMonth : allBaseMonths[allBaseMonths.length - 1] || todayMonth;
        const curMonthLabel = fmtMonth(curMonth);

        // Per-category spend in the current month
        const curMonthCatSpend = {};
        bBase.forEach(t => {
          if (t.debit <= 0 || t.month !== curMonth) return;
          const cat = effectiveCat(t);
          if (EXCLUDED_CATS.has(cat) || cat === 'Uncategorised') return;
          curMonthCatSpend[cat] = (curMonthCatSpend[cat] || 0) + t.debit;
        });

        const sortedBudgetCats = Object.entries(catYearData)
          .map(([cat, yd]) => ({ cat, total: Object.values(yd).reduce((s, v) => s + v, 0) }))
          .sort((a, b) => b.total - a.total);

        const yearTotalMap = {};
        budgetYears.forEach(yr => {
          yearTotalMap[yr] = sortedBudgetCats.reduce((s, { cat }) => s + (catYearData[cat][yr] || 0), 0);
        });
        const grandTotal = sortedBudgetCats.reduce((s, { total }) => s + total, 0);
        const curMonthTotal = Object.values(curMonthCatSpend).reduce((s, v) => s + v, 0);

        const thS = 'padding:8px 12px;font-size:11px;color:var(--text-muted);font-weight:600;white-space:nowrap;border-bottom:2px solid var(--border)';
        const headerCells = budgetYears.map(yr => `<th style="${thS};text-align:right">${yr}</th>`).join('');

        const tableRows = sortedBudgetCats.map(({ cat, total }) => {
          const color = catColor(cat);
          const lim = budgetLimits[cat];
          const esc = cat.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
          const isSel = budgetBudgetCat === cat;
          const avgMo = total / numBaseMonths;
          const yearCells = budgetYears.map(yr => {
            const amt = catYearData[cat][yr] || 0;
            const annualLim = lim ? lim * 12 : null;
            const over = annualLim && amt > annualLim;
            return `<td style="text-align:right;padding:6px 12px;font-size:12px;color:${amt > 0 ? (over ? '#ef4444' : 'var(--text-primary)') : 'var(--text-muted)'};font-weight:${over ? '600' : '400'}">${amt > 0 ? fmtAUD(amt) : '—'}</td>`;
          }).join('');

          // Current month cell
          const curAmt = curMonthCatSpend[cat] || 0;
          const over = lim && curAmt > lim;
          const pct = avgMo > 0 ? Math.round((curAmt / avgMo) * 100) : 0;
          const deltaColor = over ? '#ef4444' : curAmt > avgMo ? '#f97316' : curAmt > 0 ? '#16a34a' : 'var(--text-muted)';
          const curCell = curAmt > 0
            ? `<td style="text-align:right;padding:6px 12px;white-space:nowrap">
                <div style="font-size:12px;color:${over ? '#ef4444' : 'var(--text-primary)'};font-weight:${over ? '600' : '400'}">${fmtAUD(curAmt)}</div>
                <div style="font-size:10px;color:${deltaColor}">${pct}% of avg${over ? ' ⚠' : ''}</div>
               </td>`
            : `<td style="text-align:right;padding:6px 12px;font-size:12px;color:var(--text-muted)">—</td>`;

          return `<tr onclick="selectBudgetCat('${esc}')" style="cursor:pointer;border-bottom:1px solid var(--border-light);transition:background .1s${isSel ? ';background:var(--bg-secondary)' : ''}" onmouseenter="if(!${isSel})this.style.background='var(--bg-secondary)'" onmouseleave="if(!${isSel})this.style.background=''">
            <td style="padding:6px 12px;white-space:nowrap">
              <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:6px"></span>
              <span style="font-size:12px;color:var(--text-primary);font-weight:${isSel ? '600' : '400'}">${cat}</span>

            </td>

        const footerCells = budgetYears.map(yr => `<td style="text-align:right;padding:8px 12px;font-size:12px;font-weight:700">${fmtAUD(yearTotalMap[yr])}</td>`).join('');

        const budgetTable = `<div style="margin-bottom:20px">
          <div class="budget-section-title" style="margin-bottom:10px">Annual spend by category</div>
          <div class="budget-panel-box" style="overflow-x:auto;padding:0">
            <table style="width:100%;border-collapse:collapse">
              <thead><tr>
                <th style="${thS};text-align:left">Category</th>
                ${headerCells}
                <th style="${thS};text-align:right">Avg/mo</th>
                <th style="${thS};text-align:right">${curMonthLabel}</th>
              </tr></thead>
              <tbody>${tableRows}</tbody>
              <tfoot><tr style="border-top:2px solid var(--border)">
                <td style="padding:8px 12px;font-size:12px;font-weight:700;color:var(--text-muted)">Total</td>
                ${footerCells}
                <td style="text-align:right;padding:8px 12px;font-size:12px;color:var(--text-muted)">${fmtAUD(grandTotal / numBaseMonths)}</td>
                <td style="text-align:right;padding:8px 12px;font-size:12px;font-weight:700">${curMonthTotal > 0 ? fmtAUD(curMonthTotal) : '—'}</td>
              </tr></tfoot>
            </table>
          </div>
        </div>`;

        // Per-category drill: monthly trend + transactions
        let budgetDrillHtml = '';
        if (budgetBudgetCat && catYearData[budgetBudgetCat]) {
          const cat = budgetBudgetCat;
          const color = catColor(cat);
          const lim = budgetLimits[cat];

          // Monthly spend for this category across all time
          const catMonthSpend = {};
          bBase.forEach(t => {
            if (t.debit <= 0 || effectiveCat(t) !== cat) return;
            catMonthSpend[t.month] = (catMonthSpend[t.month] || 0) + t.debit;
          });
          const maxMoSpend = Math.max(...Object.values(catMonthSpend), 0.01);
          const BAR_H = 80;

          // Group by year for the trend, with year separators
          let prevYr = null;
          const catBars = allBaseMonths.map(m => {
            const [yr, mo] = m.split('-');
            const v = catMonthSpend[m] || 0;
            const h = Math.round((v / maxMoSpend) * BAR_H);
            const over = lim && v > lim;
            const moLabel = new Date(+yr, +mo - 1, 1).toLocaleString('default', { month: 'short' });
            const isSelMo = budgetSelectedMonth === m;
            const yrSep = yr !== prevYr ? `<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:${BAR_H + 20}px;margin-right:4px"><div style="flex:1;width:1px;background:var(--border)"></div><div style="font-size:9px;color:var(--text-muted);padding:2px 0">${yr}</div></div>` : '';
            prevYr = yr;
            return yrSep + `<div class="budget-trend-group${isSelMo ? ' selected' : ''}" onclick="selectMonth('${m}')" title="${fmtMonth(m)}: ${v > 0 ? fmtAUD(v) : '—'}">
              <div class="budget-trend-bars">
                <div class="budget-trend-bar" style="height:${Math.max(h, v > 0 ? 2 : 0)}px;background:${over ? '#ef4444' : color};opacity:0.85;width:14px"></div>
              </div>
              <div class="budget-trend-month">${moLabel}</div>
            </div>`;
          }).join('');

          // Transactions filtered by selected period
          let catTxs = bBase.filter(t => t.debit > 0 && effectiveCat(t) === cat);
          if (budgetSelectedMonth) catTxs = catTxs.filter(t => t.month === budgetSelectedMonth);
          else if (budgetSelectedYear) catTxs = catTxs.filter(t => t.month.startsWith(budgetSelectedYear));
          catTxs.sort((a, b) => b.date - a.date);

          const catAllTime = sortedBudgetCats.find(x => x.cat === cat)?.total || 0;
          const periodLabel = budgetSelectedMonth ? fmtMonth(budgetSelectedMonth) : budgetSelectedYear ? budgetSelectedYear : 'all time';

          budgetDrillHtml = `<div style="border-left:4px solid ${color};padding-left:14px">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap">
              <div class="budget-section-title" style="margin-bottom:0;color:${color}">${cat}</div>
              <span style="font-size:12px;color:var(--text-muted)">${fmtAUD(catAllTime)} all time</span>
              ${lim ? `<span style="font-size:12px;color:var(--text-muted)">· limit ${fmtAUD(lim)}/mo</span>` : ''}
              <button onclick="selectBudgetCat(null)" style="font-size:11px;padding:2px 8px;cursor:pointer;background:var(--bg-secondary);border:1px solid var(--border);border-radius:4px;color:var(--text-muted)">✕</button>
            </div>
            <div class="budget-section-title" style="margin-bottom:8px">Monthly trend</div>
            <div class="budget-panel-box" style="padding:12px 16px;margin-bottom:16px">
              <div class="budget-trend-wrap"><div class="budget-trend" style="align-items:flex-end">${catBars}</div></div>
            </div>
            <div class="budget-section-title" style="margin-bottom:8px">Transactions — ${periodLabel} <span style="font-size:11px;font-weight:400;color:var(--text-muted)">(${catTxs.length})</span></div>
            <div class="budget-tx-list">${renderTxRows(catTxs.slice(0, 300))}</div>
          </div>`;
        }

        tabContent = budgetTable + budgetDrillHtml;
      } else if (budgetSelectedTab === 'recurring') {
        tabContent = recurPanel;
      }

      document.getElementById('budgetContent').innerHTML = tabContent;
      updateBulkBar();
    }

    function noData() {

    function buildHeatmap(rows, months) {
      if (!rows.length || !months.length) return '<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:13px">Not enough data</div>';
      const CW = months.length > 20 ? 24 : months.length > 14 ? 28 : 34;
      const CH = 22;
      const LW = 140;
      function hexRgba(hex, a) {
        if (!hex || hex.length < 7) return `rgba(150,150,150,${a})`;
        return `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
      }
      const prevYear = {};
      const monthCols = months.map(m => {
        const [yr, mo] = m.split('-');
        const moLabel = new Date(+yr, +mo - 1, 1).toLocaleString('default', { month: 'short' });
        const showYr = yr !== prevYear.v;
        prevYear.v = yr;
        return `<div style="width:${CW}px;flex-shrink:0;text-align:center;font-size:9px;color:var(--text-muted);line-height:1.4">${moLabel}${showYr ? `<br><span style="opacity:.6">'${yr.slice(2)}</span>` : ''}</div>`;
      }).join('');
      const dataRows = rows.map(({ name, color, data }) => {
        const rowMax = Math.max(...months.map(m => data[m] || 0), 0.01);
        const cells = months.map(m => {
          const v = data[m] || 0;
          const bg = v > 0 ? hexRgba(color, 0.12 + (v / rowMax) * 0.78) : 'var(--bg-secondary)';
          return `<div style="width:${CW}px;height:${CH}px;background:${bg};border-radius:2px;flex-shrink:0" title="${name} · ${fmtMonth(m)}: ${v > 0 ? fmtAUD(v) : '—'}"></div>`;
        }).join('');
        return `<div style="display:flex;align-items:center;gap:2px;margin-bottom:2px">
          <div style="width:${LW}px;font-size:11px;color:var(--text-primary);text-align:right;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0" title="${name}">${name}</div>
          <div style="display:flex;gap:2px">${cells}</div>
        </div>`;
      }).join('');
      return `<div style="overflow-x:auto"><div style="min-width:max-content;padding-bottom:4px">
        <div style="display:flex;align-items:center;gap:2px;margin-bottom:4px;padding-left:${LW}px"><div style="display:flex;gap:2px">${monthCols}</div></div>
        ${dataRows}
      </div></div>`;
    }

    function renderTxRows(txs) {
      if (!txs.length) return '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px">No transactions</div>';

      function fmtDateInline(dateStr) {
        const [d, m, y] = dateStr.split('/');
        const dt = new Date(+y, +m - 1, +d);
        return dt.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
      }

      return txs.map(t => {
        const vendorKey = t.vendor || vendorName(t.narrative);
        const merchant = displayVendor(vendorKey);
        const escVKey = vendorKey.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const cat = effectiveCat(t);
        const color = catColor(cat);
        const bal = t.balance ? `<div class="budget-tx-balance">${fmtAUD(t.balance)}</div>` : '';
        const narrAttr = t.narrative.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
        let catBadge;
        if (cat === 'Uncategorised') {
          catBadge = `<div class="budget-tx-cat-badge" data-narrative="${narrAttr}" style="background:#D9775720;color:#D97757;border-color:#D9775760;border-style:dashed;cursor:pointer;user-select:none;font-weight:600">+ Categorise</div>`;
        } else {
          catBadge = `<div class="budget-tx-cat-badge" data-narrative="${narrAttr}" style="background:${color}18;color:${color};border-color:${color}40;cursor:pointer;user-select:none">${cat} ▾</div>`;
        }
        const delBtn = t.id != null ? `<button class="tx-del-btn" onclick="event.stopPropagation();deleteTx(${t.id})" style="flex:0 0 auto;background:none;border:none;padding:2px 5px;border-radius:4px;cursor:pointer;font-size:15px;color:#9ca3af;line-height:1" onmouseenter="this.style.color='#ef4444'" onmouseleave="this.style.color='#9ca3af'" title="Delete transaction">×</button>` : '';
        const cb = t.id != null ? `<input type="checkbox" class="tx-sel-cb" data-tx-id="${t.id}" ${_txSelIds.has(t.id) ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleTxSelect(${t.id})">` : '';
        return `<div class="budget-tx-row" style="border-left:3px solid ${color}">
          ${cb}
          <div class="budget-tx-date">${fmtDateInline(t.dateStr)}</div>
          <div class="budget-tx-merchant" title="${t.narrative}" onclick="showVendorDescModal('${escVKey}')">${merchant}<span class="vendor-edit">✏</span></div>
          ${catBadge}
          <div class="budget-tx-amount ${t.debit > 0 ? 'expense' : 'income'}">${t.debit > 0 ? '−' + fmtAUD(t.debit) : '+' + fmtAUD(t.credit)}</div>
          ${bal}
          ${delBtn}
        </div>`;
      }).join('');

    function filterTx(q) {
      const ql = q.trim().toLowerCase();

      if (!ql) {
        let txs = filtered().slice().sort((a, b) => b.date - a.date);

      // Search across ALL transactions (account-filtered only)

      const results = allTxs.filter(t =>
        t.narrative.toLowerCase().includes(ql) ||

      if (countEl) countEl.textContent = results.length === 0 ? 'No results' : `${results.length} result${results.length !== 1 ? 's' : ''} across all time`;

    const BACKUP_LS_KEYS = [
      'budget_custom_cats', 'budget_cat_renames', 'budget_manual_cats',
      'budget_limits', 'budget_excluded_cats', 'budget_excluded_accounts',
      'budget_merchant_cats', 'budget_vendor_descs', 'budget_collapsed',

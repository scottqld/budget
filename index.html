<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #faf9f5;
      --bg-secondary: #F5F4EF;
      --bg-card: #ffffff;
      --text-primary: #141413;
      --text-secondary: #5c5c5a;
      --text-muted: #8c8c8a;
      --accent: #D97757;
      --accent-hover: #c4684a;
      --border: #e5e4df;
      --border-light: #eeeee9;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 0 24px 20px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }

    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }

    button {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: white; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding: 60px 20px;
      text-align: center;
    }

    #status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-primary);
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    #status.visible { opacity: 1; }

    /* Budget styles */
    .budget-month-selector { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
    .budget-tabs { display:flex; border-bottom:2px solid var(--border); margin-bottom:20px; gap:0; }
    .budget-tab { padding:10px 20px; font-size:13px; font-weight:500; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; background:none; border-top:none; border-left:none; border-right:none; font-family:inherit; transition:color 0.15s; }
    .budget-tab:hover { color:var(--text-primary); }
    .budget-tab.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:600; }
    .budget-month-btn {
      background: var(--bg-secondary); border: 1px solid var(--border);
      padding: 5px 12px; font-size: 12px; border-radius: 6px; color: var(--text-secondary);
    }
    .budget-month-btn:hover { border-color: var(--accent); color: var(--accent); }
    .budget-month-btn.active { background: var(--accent); border-color: var(--accent); color: white; }

    .budget-summary-cards {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px;
    }
    .budget-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px;
    }
    .budget-card-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 6px;
    }
    .budget-card-value { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
    .budget-card-value.income { color: #16a34a; }
    .budget-card-value.expense { color: var(--accent); }

    .budget-two-col {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
      margin-bottom: 24px; align-items: start;
    }
    .budget-section-title {
      font-size: 12px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-secondary); margin-bottom: 10px;
    }
    .budget-panel-box {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px;
    }

    .budget-bar-row {
      display: flex; align-items: center; gap: 10px;
      padding: 6px 0; border-bottom: 1px solid var(--border-light); font-size: 12px;
    }
    .budget-bar-row:last-child { border-bottom: none; }
    .budget-bar-label {
      flex: 0 0 140px; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px;
    }
    .budget-bar-wrap { flex: 1; height: 6px; background: var(--bg-secondary); border-radius: 3px; overflow: hidden; }
    .budget-bar { height: 100%; border-radius: 3px; background: var(--accent); transition: width 0.3s ease; }
    .budget-bar.over { background: #ef4444; }
    .budget-bar.blue { background: #60a5fa; }
    .budget-bar-amount { flex: 0 0 75px; text-align: right; font-weight: 500; color: var(--text-primary); }
    .budget-bar-extra { flex: 0 0 90px; text-align: right; font-size: 11px; color: var(--text-muted); }
    .budget-bar-extra .over { color: #ef4444; }
    .budget-bar-extra .under { color: #16a34a; }
    .budget-rank { flex: 0 0 18px; font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .set-limit-btn {
      background: transparent; border: 1px solid var(--border);
      padding: 2px 7px; font-size: 11px; border-radius: 4px; color: var(--text-muted);
    }
    .set-limit-btn:hover { border-color: var(--accent); color: var(--accent); }

    .budget-trend-wrap {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      padding: 16px; margin-bottom: 24px; overflow-x: auto;
    }
    .budget-trend { display: flex; align-items: flex-end; gap: 8px; min-height: 110px; }
    .budget-trend-group {
      display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; flex-shrink: 0;
    }
    .budget-trend-group:hover .budget-trend-bars { opacity: 0.7; }
    .budget-trend-group.selected .budget-trend-month { color: var(--accent); font-weight: 600; }
    .budget-trend-bars { display: flex; align-items: flex-end; gap: 2px; height: 80px; }
    .budget-trend-bar { width: 16px; border-radius: 3px 3px 0 0; min-height: 2px; }
    .budget-trend-bar.income { background: #16a34a; opacity: 0.75; }
    .budget-trend-bar.expense { background: var(--accent); opacity: 0.75; }
    .budget-trend-month { font-size: 10px; color: var(--text-muted); white-space: nowrap; }

    .budget-tx-list {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden; margin-bottom: 24px;
    }
    .budget-tx-date-header {
      padding: 6px 16px; font-size: 11px; font-weight: 600;
      color: var(--text-muted); background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-light); letter-spacing: 0.03em;
    }
    .budget-tx-row {
      display: flex; align-items: center; gap: 12px;
      padding: 9px 16px; border-bottom: 1px solid var(--border-light); font-size: 12px;
    }
    .budget-tx-row:last-child { border-bottom: none; }
    .budget-tx-date { flex: 0 0 60px; font-size: 11px; color: var(--text-muted); white-space: nowrap; }
    .budget-tx-merchant { flex: 1; color: var(--text-primary); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .budget-tx-cat-badge { flex: 0 0 auto; font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--bg-secondary); color: var(--text-muted); white-space: nowrap; border: 1px solid var(--border-light); }
    .budget-tx-amount { flex: 0 0 85px; text-align: right; font-weight: 500; }
    .budget-tx-amount.income { color: #16a34a; }
    .budget-tx-amount.expense { color: var(--accent); }
    .budget-tx-balance { flex: 0 0 80px; text-align: right; color: var(--text-muted); font-size: 11px; }
  </style>
</head>

    const _merchantCatEntries = Object.entries(MERCHANT_CATS)
      .sort((a, b) => b[0].length - a[0].length)
      .map(([k, v]) => [k.toLowerCase(), v]);

    function autoCategory(narrative) {
      const raw = narrative.toLowerCase();

      // BPAY context clues — checked before general patterns
      const bpayPatterns = [
        [/bpay.*\bato\b|bpay.*tax.*office|bpay.*payg|bpay.*bas\b/,   'Tax'],
        [/bpay.*council|bpay.*shire|bpay.*rates/,                     'Council Rates'],
        [/bpay.*(medibank|bupa|hcf|nib|ahm|hbf)|bpay.*health\s*(fund|insur)/, 'Health Insurance'],
        [/bpay.*(energex|ergon|origin|agl|red\s*energy|unitywater|seqwater)/, 'Utilities'],
        [/bpay.*water|bpay.*electricity|bpay.*gas\b/,                 'Utilities'],
        [/bpay.*(telstra|optus|vodafone|tpg|iinet|aussie\s*broadband)/, 'Telecommunications'],
      ];
      for (const [re, cat] of bpayPatterns) {
        if (re.test(raw)) return cat;
      }

      // Keyword patterns checked against the raw narrative first
      const patterns = [
        // Takeaway food (before general Dining/Uber rules)

        [/\bmcdonald'?s\b|\bmaccas\b|\bmcdo\b/,                'Eating Out'],

        [/\brestaurant\b|\bbistro\b|\bpizzeria\b|\bsushi\b/,   'Eating Out'],

        [/linkt|e-toll|roam\s*express|citylink|eastlink/,      'Transport'],
        [/\bparking\b|\bcar\s*park\b|\bwilson\s*park/,        'Parking'],
        [/\brego\b|vehicle\s*registr/,                         'Registration'],
        // Airlines & travel
        [/qantas|virgin\s*aust|jetstar|tigerair|rex\s*airline|air\s*nz|air\s*new\s*zealand/,  'Travel'],
        [/airbnb|booking\.com|expedia|hotels\.com|agoda|wotif/,'Accommodation'],
        // Streaming & subscriptions (before generic shopping)
        [/netflix|stan\.com|disney\+?|spotify|apple\s*music|binge|foxtel|youtube\s*premium|prime\s*video|paramount/,  'Entertainment'],

        // Banking fees & interest

        // Government / Tax

        [/childcare|child\s*care|daycare|day\s*care|kindergarten|\bkindy\b/, 'Childcare'],

        [/council\s*rates|shire\s*rates|\brates\b.*council/,  'Council Rates'],
        [/\bcity\s*council\b|\bregional\s*council\b|\bshire\s*council\b|\bcouncil\b.*\brates\b/, 'Council Rates'],
        [/\bbrisbane\s*city\b|\bsunshine\s*coast\s*council\b|\bgold\s*coast\s*council\b|\bmoreton\s*bay\b/, 'Council Rates'],

        [/\binsurance\b|\bracq\b|\bnrma\b|\baami\b|\byoui\b|\ballianz\b|\bsuncorp\b/, 'Insurance'],

        [/energex|ergon\s*energy|origin\s*energy|\bagl\b|red\s*energy|synergy|alinta/, 'Utilities'],
        [/electricity|gas\s*bill|water\s*bill|\bunitywater\b|\bseqwater\b/,            'Utilities'],
        // Pets (before council rates to catch NSC Anim first)
        [/\bnsc\W+anim/,                                              'Pets'],
        [/\bvet\b|\bveterinar|\bpet\s*barn|\bpetbarn\b|\bpetsmart\b|\bpawsome\b/, 'Pets'],
        [/\bpet\s*insurance\b|\banimal\s*hospit|\banimal\s*clinic\b/, 'Pets'],
        // Car Care
        [/\bgarage\b|\bauto\s*service\b|\bcar\s*service\b|\btyres?\b|\bmuffler\b|\bsmash\s*repair/, 'Car Care'],
        [/\bmechan|\bautomotive\b|\bcar\s*wash\b|\bdetailing\b/,  'Car Care'],
        // Renovations
        [/\bbenchmark\b|bunnings|mitre\s*10|total\s*tools|stratco|beaumont\s*tiles/, 'Renovations'],
        [/renovation|\btiling\b|\bplumbing\b|\belectrician\b|\bpainting\b|\bbricklayer\b/, 'Renovations'],
        [/\bcarpet\b|\bflooring\b|\bkitchen\s*design\b|\bbathroom\s*design\b/, 'Renovations'],
        // Post
        [/australia\s*post|\bauspost\b/,                       'Post & Parcel'],
      ];

      for (const [re, cat] of patterns) {
        if (re.test(raw)) return cat;
      }

      // Fall back to merchant name lookup
      const lower = cleanMerchant(narrative).toLowerCase();
      if (!lower) return null;
      for (const [key, cat] of _merchantCatEntries) {
        if (lower === key || lower.startsWith(key + ' ')) return cat;
      }

      // Check AI-classified cache
      const cached = getMerchantCatCache();
      const merchantKey = cleanMerchant(narrative);
      if (cached[merchantKey]) return cached[merchantKey];

      return null;
    }

      const key = cleanMerchant(narrative) || narrative.trim().slice(0, 50);

      if (!cat || cat === 'Uncategorised') delete overrides[key];

        if (count > 1) showStatus(`✓ "${cat}" applied to ${count} ${key} transactions`);

    async function classifyUnknownMerchants() {
      const apiKey = localStorage.getItem('budget_api_key');
      if (!apiKey) { alert('Enter your Anthropic API key in Settings first.'); return; }

      const cache = getMerchantCatCache();
      const unknown = new Set();
      budgetTransactions.forEach(t => {
        if (t.debit <= 0) return;
        const name = cleanMerchant(t.narrative);
        if (!name || cache[name]) return;
        if (t.category && t.category !== 'Uncategorised') return;
        if (autoCategory(t.narrative)) return;  // already handled by static rules
        unknown.add(name);
      });

      function setClassifyStatus(msg) {
        showStatus(msg);
        const el = document.getElementById('classifyStatus');
        if (el) el.textContent = msg;
      }

      if (!unknown.size) { setClassifyStatus('✓ All merchants already categorised'); return; }

      const names = [...unknown];
      const allCats = Object.keys(CAT_COLORS).filter(c => c !== 'Uncategorised').sort().join(', ');
      const BATCH = 40;
      let done = 0;

      for (let i = 0; i < names.length; i += BATCH) {
        const batch = names.slice(i, i + BATCH);
        setClassifyStatus(`Classifying ${i + 1}–${Math.min(i + BATCH, names.length)} of ${names.length}…`);
        try {
          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'content-type': 'application/json',
              'anthropic-dangerous-allow-browser': 'true',
            },
            body: JSON.stringify({
              model: 'claude-haiku-4-5-20251001',
              max_tokens: 1024,
              messages: [{ role: 'user', content:
                `Categorise these Australian bank transaction merchant names. Use ONLY one of: ${allCats}.\n\nMerchants:\n${batch.map((m, j) => `${j+1}. ${m}`).join('\n')}\n\nReply with ONLY a JSON object like {"Merchant Name": "Category"}. No explanation.`
              }]
            })
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();
          const text = data.content[0].text;
          const match = text.match(/\{[\s\S]*\}/);
          if (match) {
            const result = JSON.parse(match[0]);
            Object.assign(cache, result);
            done += Object.keys(result).length;
          }
        } catch (e) {
          setClassifyStatus(`API error: ${e.message}`); return;
        }
      }

      localStorage.setItem('budget_merchant_cats', JSON.stringify(cache));
      setClassifyStatus(`✓ Classified ${done} merchants`);
      renderBudget();
    }

      if (t.category && t.category !== 'Uncategorised' && CAT_COLORS[t.category]) return t.category;

    // ===== INDEXEDDB =====
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('budget-app', 1);
        req.onupgradeneeded = e => {
          const db = e.target.result;
          db.createObjectStore('handles');
          db.createObjectStore('transactions', { autoIncrement: true });
          db.createObjectStore('imported_files');
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e.target.error);
      });
    }

    async function clearSavedHandle() {
      try {
        const db = await openDB();
        await new Promise((res, rej) => {
          const tx = db.transaction('handles', 'readwrite');
          tx.objectStore('handles').delete('folder');
          tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
        });
        budgetFolderHandle = null;
      } catch(e) { console.warn('Could not clear folder handle', e); }
    }

    async function saveHandle(handle) {
      try {
        const db = await openDB();
        await new Promise((res, rej) => {
          const tx = db.transaction('handles', 'readwrite');
          tx.objectStore('handles').put(handle, 'folder');
          tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
        });
      } catch(e) { console.warn('Could not persist folder handle', e); }
    }

    async function getSavedHandle() {
      try {
        const db = await openDB();
        return await new Promise((res, rej) => {
          const tx = db.transaction('handles', 'readonly');
          const req = tx.objectStore('handles').get('folder');
          req.onsuccess = e => res(e.target.result);
          req.onerror = e => rej(e.target.error);
        });
      } catch { return null; }
    }

    async function storeTransactions(txs, filename) {
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction(['transactions', 'imported_files'], 'readwrite');
        txs.forEach(t => tx.objectStore('transactions').add(t));
        tx.objectStore('imported_files').put({ filename, importedAt: new Date(), count: txs.length }, filename);
        tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
      });
    }

    async function loadAllTransactions() {
      try {
        const db = await openDB();
        return await new Promise((res, rej) => {
          const tx = db.transaction('transactions', 'readonly');
          const req = tx.objectStore('transactions').getAll();
          req.onsuccess = e => res(e.target.result);
          req.onerror = e => rej(e.target.error);
        });
      } catch { return []; }
    }

    async function getImportedFiles() {
      try {
        const db = await openDB();
        return await new Promise((res, rej) => {
          const tx = db.transaction('imported_files', 'readonly');
          const req = tx.objectStore('imported_files').getAll();
          req.onsuccess = e => {
            const map = {};
            e.target.result.forEach(r => map[r.filename] = r);
            res(map);
          };
          req.onerror = e => rej(e.target.error);
        });
      } catch { return {}; }
    }

    async function doImport() {
      if (window.showDirectoryPicker) {
        const saved = await getSavedHandle();
        if (saved) {
          try {
            const perm = await saved.requestPermission({ mode: 'read' });
            if (perm === 'granted') {
              budgetFolderHandle = saved;
              showChangeFolderBtn(true);
              await importNewFiles();
            } else {
              showStatus('Access denied — click Import again to allow folder access');
            }
          } catch(e) {
            showStatus('Error: ' + e.message);
          }
          return;
        }
        try {
          const handle = await window.showDirectoryPicker({ id: 'budget', mode: 'read' });
          await saveHandle(handle);
          budgetFolderHandle = handle;
          showChangeFolderBtn(true);
          await importNewFiles();
          return;
        } catch(e) {
          if (e.name === 'AbortError') return;
          // API blocked (e.g. Brave shields) — fall through to file input
        }
      }
      document.getElementById('folderInput').click();
    }

    async function importFromFileList(files) {
      // webkitdirectory recurses into sub-folders; keep top-level files only
      const csvFiles = Array.from(files).filter(f =>
        f.webkitRelativePath.split('/').length === 2 && /^Data_Export_.*\.csv$/i.test(f.name));
      if (!csvFiles.length) { showStatus('No Data_Export_*.csv files found'); return; }
      const imported = await getImportedFiles();
      const newFiles = csvFiles.filter(f => !imported[f.name]).sort((a, b) => a.name.localeCompare(b.name));
      if (!newFiles.length) {
        showStatus(`All ${csvFiles.length} file${csvFiles.length > 1 ? 's' : ''} already imported`);
        if (budgetTransactions.length) renderBudget();
        return;
      }
      let totalNew = 0;
      for (const f of newFiles) {
        const text = await f.text();
        const txs = parseCSV(text);
        if (txs.length) { await storeTransactions(txs, f.name); totalNew += txs.length; }
      }
      budgetTransactions = (await loadAllTransactions()).filter(t => !EXCLUDED_ACCOUNTS.has(t.account));
      const years = [...new Set(budgetTransactions.map(t => t.month.split('-')[0]))].sort();
      if (!budgetSelectedYear || !years.includes(budgetSelectedYear)) {
        budgetSelectedYear = years[years.length - 1] || null;
        budgetSelectedMonth = null;
      }
      showStatus(`Imported ${totalNew} new transaction${totalNew > 1 ? 's' : ''} from ${newFiles.length} file${newFiles.length > 1 ? 's' : ''}`);
      renderBudget();
    }

    async function importNewFiles(silent = false) {
      if (!budgetFolderHandle) return;
      const allFiles = [];
      for await (const [name, handle] of budgetFolderHandle.entries()) {
        if (handle.kind === 'file' && /^Data_Export_.*\.csv$/i.test(name)) allFiles.push({ name, handle });
      }
      if (!allFiles.length) { if (!silent) showStatus('No Data_Export_*.csv files found'); return; }

      const imported = await getImportedFiles();
      const newFiles = allFiles.filter(f => !imported[f.name]).sort((a, b) => a.name.localeCompare(b.name));

      if (!newFiles.length) {
        if (!silent) showStatus(`All ${allFiles.length} file${allFiles.length > 1 ? 's' : ''} already imported`);
        if (!silent && budgetTransactions.length) renderBudget();
        return;
      }

      let totalNew = 0;
      for (const f of newFiles) {
        const text = await (await f.handle.getFile()).text();
        const txs = parseCSV(text);
        if (txs.length) { await storeTransactions(txs, f.name); totalNew += txs.length; }
      }

      budgetTransactions = (await loadAllTransactions()).filter(t => !EXCLUDED_ACCOUNTS.has(t.account));
      const months = [...new Set(budgetTransactions.map(t => t.month))].sort();
      if (!budgetSelectedMonth || !months.includes(budgetSelectedMonth)) {
        budgetSelectedMonth = months[months.length - 1] || null;
      }
      const years = [...new Set(budgetTransactions.map(t => t.month.split('-')[0]))].sort();
      if (!budgetSelectedYear || !years.includes(budgetSelectedYear)) {
        budgetSelectedYear = years[years.length - 1] || null;
        budgetSelectedMonth = null;
      }
      showStatus(`Imported ${totalNew} new transaction${totalNew > 1 ? 's' : ''} from ${newFiles.length} file${newFiles.length > 1 ? 's' : ''}`);
      renderBudget();
    }

    async function autoCheckNewFiles() {
      const handle = budgetFolderHandle || await getSavedHandle();
      if (!handle) return;
      const perm = await handle.queryPermission({ mode: 'read' });
      if (perm !== 'granted') return;
      budgetFolderHandle = handle;
      await importNewFiles(true);
    }

    // ===== CSV PARSING =====
    function parseCSVRow(line) {
      const out = []; let cur = '', inQ = false;
      for (const c of line) {
        if (c === '"') inQ = !inQ;
        else if (c === ',' && !inQ) { out.push(cur); cur = ''; }
        else cur += c;
      }
      out.push(cur);
      return out;
    }

    function parseCSV(text) {
      const lines = text.replace(/^﻿/, '').trim().split(/\r?\n/);
      if (lines.length < 2) return [];
      const headers = parseCSVRow(lines[0]).map(h => h.trim());
      const out = [];
      for (let i = 1; i < lines.length; i++) {
        const vals = parseCSVRow(lines[i]);
        if (vals.length < 3) continue;
        const r = {};
        headers.forEach((h, idx) => r[h] = (vals[idx] || '').trim());
        const debit = parseFloat(r['Debit Amount']) || 0;
        const credit = parseFloat(r['Credit Amount']) || 0;
        const dateStr = r['Date'] || '';
        const m = dateStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (!m) continue;
        const date = new Date(+m[3], +m[2] - 1, +m[1]);
        const month = `${m[3]}-${m[2].padStart(2, '0')}`;
        out.push({
          account: r['Bank Account'] || '',
          dateStr, date, month,
          narrative: r['Narrative'] || '',
          debit, credit,
          balance: parseFloat(r['Balance']) || 0,
          category: (r['Categories'] || 'Uncategorised').trim() || 'Uncategorised',
        });
      }
      return out;
    }

    // ===== ANALYSIS =====
    function filtered() {
      let txs = budgetTransactions;
      if (budgetSelectedAccount) txs = txs.filter(t => t.account === budgetSelectedAccount);
      if (budgetSelectedMonth) return txs.filter(t => t.month === budgetSelectedMonth);
      if (budgetSelectedYear) return txs.filter(t => t.month.startsWith(budgetSelectedYear));
      return txs;
    }

    function allMonths() {
      const months = [...new Set(budgetTransactions.map(t => t.month))].sort().reverse();
      return budgetSelectedYear ? months.filter(m => m.startsWith(budgetSelectedYear)) : months;
    }

    function allYears() {
      return [...new Set(budgetTransactions.map(t => t.month.split('-')[0]))].sort().reverse();
    }

    function fmtMonth(ym) {
      const [y, mo] = ym.split('-');
      return new Date(+y, +mo - 1, 1).toLocaleString('default', { month: 'short', year: 'numeric' });
    }

    function fmtAUD(n) {
      return '$' + Math.abs(n).toLocaleString('en-AU', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function catSpending(txs) {
      const m = {};
      txs.forEach(t => { if (t.debit > 0) { const c = effectiveCat(t); m[c] = (m[c] || 0) + t.debit; } });
      return Object.entries(m).sort((a, b) => b[1] - a[1]);
    }

    function avgMonthlyCatSpending() {
      let base = budgetTransactions;
      if (budgetSelectedAccount) base = base.filter(t => t.account === budgetSelectedAccount);
      const numMonths = new Set(base.map(t => t.month)).size || 1;
      const totals = {};
      base.forEach(t => { if (t.debit > 0) { const c = effectiveCat(t); totals[c] = (totals[c] || 0) + t.debit; } });
      const avgs = {};
      for (const [cat, total] of Object.entries(totals)) avgs[cat] = total / numMonths;
      return avgs;
    }

    function cleanMerchant(n) {
      return n
        // card / payment method prefixes
        .replace(/^(visa\s+(purchase|debit\s+purchase|credit\s+purchase)|mc\s+purchase|mastercard\s+purchase)\s*/i, '')
        .replace(/^(eftpos\s+(purchase\s+)?|tap\s+and\s+pay\s+|contactless\s+purchase\s+)/i, '')
        .replace(/^(recurring\s+payment\s+to\s+|internet\s+purchase\s+|online\s+purchase\s+)/i, '')
        .replace(/^(osko\s+(payment\s+to\s+)?|npp\s+(credit|debit)\s+)/i, '')
        .replace(/^(paypal|sq)\s*\*\s*/i, '')
        .replace(/^direct\s+debit\s+/i, '')
        .replace(/^bpay\s+/i, '')
        .replace(/^(atm\s+withdrawal\s+|atm\s+)/i, '')
        // legal suffixes
        .replace(/\b(pty\s+ltd|pty|ltd|p\/l|inc|co)\b\.?/gi, '')
        // domain suffixes (e.g. NETFLIX.COM, STAN.COM.AU)
        .replace(/\.(com\.au|com|net\.au|net|org\.au|org|au)\b/gi, '')
        // standalone store/ref numbers (3+ digits)
        .replace(/\s+\d{3,}(\s|$)/g, ' ')
        // Australian states and country
        .replace(/\b(aus|aust|australia|qld|nsw|vic|sa|wa|tas|act|nt)\b/gi, '')
        .replace(/[^a-zA-Z0-9\s&'\-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .toLowerCase()
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    function topMerchants(txs, n = 20) {
      const m = {};
      const SKIP = new Set(['Paypal', 'Sq', 'Square', 'Osko', 'Bpay']);
      txs.forEach(t => {
        if (t.debit > 0) {
          const key = cleanMerchant(t.narrative);
          if (key && !SKIP.has(key)) {
            if (!m[key]) m[key] = { amt: 0, narrative: t.narrative };
            m[key].amt += t.debit;
          }
        }
      });
      return Object.entries(m)
        .map(([name, { amt, narrative }]) => [name, amt, autoCategory(narrative) || 'Other'])
        .sort((a, b) => b[1] - a[1])
        .slice(0, n);
    }

    function monthlyTotals() {
      const m = {};
      budgetTransactions.forEach(t => {
        if (!m[t.month]) m[t.month] = { inc: 0, exp: 0 };
        m[t.month].inc += t.credit;
        m[t.month].exp += t.debit;
      });
      return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0]));
    }

    function annualTotals() {
      const m = {};
      budgetTransactions.forEach(t => {
        const year = t.month.split('-')[0];
        if (!m[year]) m[year] = { inc: 0, exp: 0 };
        m[year].inc += t.credit;
        m[year].exp += t.debit;
      });
      return Object.entries(m).sort((a, b) => a[0].localeCompare(b[0]));
    }

    function balanceChartSVG(txs) {
      const sorted = txs.slice().sort((a, b) => a.date - b.date).filter(t => t.balance !== 0 || t.debit || t.credit);
      if (sorted.length < 2) return '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px">Not enough data</div>';

      const acc = sorted[0]?.account || null;

      const W = 800, H = 130, padL = 62, padR = 16, padT = 12, padB = 28;
      const cW = W - padL - padR, cH = H - padT - padB;

      const minBal = Math.min(...sorted.map(t => t.balance));
      const maxBal = Math.max(...sorted.map(t => t.balance));
      const balRange = maxBal - minBal || 1;
      const minTs = sorted[0].date.getTime();
      const maxTs = sorted[sorted.length - 1].date.getTime();
      const tsRange = maxTs - minTs || 1;

      const tx = d => padL + ((d.getTime() - minTs) / tsRange) * cW;
      const ty = b => padT + cH - ((b - minBal) / balRange) * cH;

      // grid + y labels
      const yTicks = 3;
      let grid = '';
      for (let i = 0; i <= yTicks; i++) {
        const b = minBal + (balRange * i / yTicks);
        const y = ty(b);
        grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="#eeeee9" stroke-width="1"/>`;
        grid += `<text x="${padL - 5}" y="${y + 4}" text-anchor="end" font-size="9" fill="#8c8c8a">$${Math.round(b).toLocaleString('en-AU')}</text>`;
      }

      // zero line
      const zeroLine = (minBal < 0 && maxBal > 0)
        ? `<line x1="${padL}" y1="${ty(0)}" x2="${W - padR}" y2="${ty(0)}" stroke="#ef4444" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>`
        : '';

      // x-axis date labels
      const xTicks = Math.min(6, sorted.length);
      let xLabels = '';
      for (let i = 0; i < xTicks; i++) {
        const t = sorted[Math.round((sorted.length - 1) * i / (xTicks - 1))];
        const x = tx(t.date);
        const label = t.date.toLocaleDateString('en-AU', { month: 'short', year: '2-digit' });
        xLabels += `<text x="${x}" y="${H - 4}" text-anchor="middle" font-size="9" fill="#8c8c8a">${label}</text>`;
      }

      const pts = sorted.map(t => `${tx(t.date).toFixed(1)},${ty(t.balance).toFixed(1)}`).join(' ');
      const lines = `<polyline points="${pts}" fill="none" stroke="${acctColor(acc)}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>`;
      const legend = '';

      return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
        ${grid}${zeroLine}${lines}${xLabels}
        ${legend ? `<text x="${padL}" y="10" font-size="9" font-family="Inter,sans-serif">${legend}</text>` : ''}
      </svg>`;
    }

    function detectRecurring(allTxs) {
      const FREQS = [
        { label: 'Weekly',      min: 5,   max: 10,  minCount: 6, checkDayOfMonth: false, maxCv: 0.30 },
        { label: 'Fortnightly', min: 11,  max: 20,  minCount: 6, checkDayOfMonth: false, maxCv: 0.30 },
        { label: 'Monthly',     min: 21,  max: 45,  minCount: 6, checkDayOfMonth: false, maxCv: 0.30 },
        { label: 'Bimonthly',   min: 46,  max: 74,  minCount: 4, checkDayOfMonth: true,  maxCv: 0.20 },
        { label: 'Quarterly',   min: 75,  max: 110, minCount: 4, checkDayOfMonth: true,  maxCv: 0.15 },
        { label: 'Annual',      min: 330, max: 400, minCount: 3, checkDayOfMonth: true,  maxCv: 0.15 },
      ];

      function normalizeNarrative(n) {
        const s = n
          .toLowerCase()
          .replace(/^paypal\s*\*\s*/g, '')               // strip PAYPAL * prefix
          .replace(/^direct\s*debit\s*/g, '')            // strip DIRECT DEBIT prefix
          .replace(/^bpay\s+/g, '')                      // strip BPAY prefix
          .replace(/\d{1,2}\/\d{1,2}(\/\d{2,4})?/g, '') // strip embedded dates
          .replace(/\b[a-z0-9]*\d[a-z0-9]{3,}\b/g, '')  // strip ref codes with digits
          .replace(/\b\d+\b/g, '')                        // strip standalone numbers
          .replace(/[^a-z\s]/g, ' ')                      // strip special chars
          .replace(/\s+/g, ' ').trim();
        // Keep only words ≥4 chars and sort — makes order and short noise words irrelevant
        return s.split(' ').filter(w => w.length >= 4).sort().join(' ');
      }

      const byName = {};
      allTxs.forEach(t => {
        if (t.debit <= 0) return;
        const key = normalizeNarrative(t.narrative);
        if (!key) return;
        if (!byName[key]) byName[key] = [];
        byName[key].push(t);
      });

      const results = [];
      for (const [name, txs] of Object.entries(byName)) {
        if (txs.length < 3) continue;
        const sorted = txs.slice().sort((a, b) => a.date - b.date);

        // Deduplicate by month — multiple charges in the same month count as one billing event
        const byMonth = {};
        sorted.forEach(t => { byMonth[t.month] = t; });
        const deduped = Object.values(byMonth).sort((a, b) => a.date - b.date);
        if (deduped.length < 3) continue;

        const gaps = [];
        for (let i = 1; i < deduped.length; i++)
          gaps.push((deduped[i].date - deduped[i - 1].date) / 86400000);

        const avgGap = gaps.reduce((s, g) => s + g, 0) / gaps.length;
        const stddev = Math.sqrt(gaps.reduce((s, g) => s + (g - avgGap) ** 2, 0) / gaps.length);
        const cv = stddev / avgGap;

        const freq = FREQS.find(f => avgGap >= f.min && avgGap <= f.max);
        if (!freq) continue;
        if (cv > freq.maxCv) continue;
        if (deduped.length < freq.minCount) continue;

        if (freq.checkDayOfMonth) {
          const days = deduped.map(t => t.date.getDate());
          const avgDay = days.reduce((s, d) => s + d, 0) / days.length;
          const dayStddev = Math.sqrt(days.reduce((s, d) => s + (d - avgDay) ** 2, 0) / days.length);
          if (dayStddev > 7) continue;
        }

        const amounts = deduped.map(t => t.debit);
        const avgAmt = amounts.reduce((s, a) => s + a, 0) / amounts.length;
        const amtStddev = Math.sqrt(amounts.reduce((s, a) => s + (a - avgAmt) ** 2, 0) / amounts.length);
        const amtCv = amtStddev / avgAmt;
        if (amtCv > 0.25) continue;

        const last = deduped[deduped.length - 1];
        results.push({ name: last.narrative, count: deduped.length, avgAmt, lastDate: last.dateStr, category: effectiveCat(last), freq: freq.label });
      }
      return results.sort((a, b) => b.avgAmt - a.avgAmt);
    }

          <div class="budget-bar-label" style="flex:1;min-width:0" title="${name}">${name}</div>
          <div class="budget-bar-wrap"><div class="budget-bar" style="width:${(amt / maxCM) * 100}%;background:${catColor(budgetSelectedCategory)}"></div></div>
          <div class="budget-bar-amount">${fmtAUD(amt)}</div>
          <div style="flex:0 0 50px;text-align:right;font-size:11px;color:var(--text-muted)">${Math.round(amt / catTotal * 100)}%</div>
        </div>`).join('');
        const selColor = catColor(budgetSelectedCategory);
        const catTxsSorted = catTxs.slice().sort((a, b) => b.date - a.date);
        const tabBtn = (id, label) => {
          const active = budgetDrillTab === id;
          return `<button onclick="selectDrillTab('${id}')" style="flex:1;padding:6px 10px;font-size:12px;font-weight:${active?'600':'400'};border:none;border-radius:6px;cursor:pointer;background:${active?'var(--bg-card)':'transparent'};color:${active?selColor:'var(--text-muted)'};box-shadow:${active?'0 1px 3px rgba(0,0,0,.1)':'none'};transition:all .15s">${label}</button>`;
        };
        const drillContent = budgetDrillTab === 'transactions'
          ? `<div class="budget-tx-list">${renderTxRows(catTxsSorted)}</div>`
          : `<div class="budget-panel-box">${catMerchRows || noData()}</div>`;
        catDrillPanel = `<div style="margin-bottom:24px;border-left:4px solid ${selColor};padding-left:14px">
          <div class="budget-section-title" style="margin-bottom:12px;color:${selColor}">${budgetSelectedCategory}
            <span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:8px">${fmtAUD(catTotal)} total · ${catTxs.length} transactions</span>
            <button onclick="selectCategory(null)" style="font-size:11px;padding:2px 8px;margin-left:12px;cursor:pointer;background:var(--bg-secondary);border:1px solid var(--border);border-radius:4px;color:var(--text-muted)">✕ Clear</button>
          </div>
          <div style="display:flex;gap:4px;background:var(--bg-secondary);border-radius:8px;padding:3px;margin-bottom:14px">
            ${tabBtn('transactions', `Transactions (${catTxs.length})`)}
            ${tabBtn('merchants', 'Merchants')}
          </div>
          ${drillContent}
        </div>`;
        catDetailPanel = `<div style="margin-bottom:24px;border-left:4px solid ${selColor};padding-left:14px">
          <div class="budget-section-title" style="margin-bottom:10px;color:${selColor}">${budgetSelectedCategory}
            <span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:8px">${fmtAUD(catTotal)} total · ${catTxs.length} transactions</span>
            <button onclick="selectCategory(null)" style="font-size:11px;padding:2px 8px;margin-left:12px;cursor:pointer;background:var(--bg-secondary);border:1px solid var(--border);border-radius:4px;color:var(--text-muted)">✕ Clear</button>
          </div>
          <div class="budget-panel-box">${catMerchRows || noData()}</div>
        </div>`;
      }

      // Income source drill-down for overview
      let incDetailPanel = '';
      if (budgetSelectedIncomeSource) {
        const srcName = budgetSelectedIncomeSource;
        const srcTxs = txs.filter(t => {
          if (t.credit <= 0) return false;
          const key = cleanMerchant(t.narrative) || t.narrative.trim().slice(0, 35);
          return key === srcName;
        }).sort((a, b) => b.date - a.date);
        const srcTotal = srcTxs.reduce((s, t) => s + t.credit, 0);
        incDetailPanel = `<div style="margin-bottom:24px;border-left:4px solid #16a34a;padding-left:14px">
          <div class="budget-section-title" style="margin-bottom:10px;color:#16a34a">${srcName}
            <span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:8px">+${fmtAUD(srcTotal)} · ${srcTxs.length} transaction${srcTxs.length !== 1 ? 's' : ''}</span>
            <button onclick="selectIncomeSource(null)" style="font-size:11px;padding:2px 8px;margin-left:12px;cursor:pointer;background:var(--bg-secondary);border:1px solid var(--border);border-radius:4px;color:var(--text-muted)">✕ Clear</button>
          </div>
          <div class="budget-tx-list">${renderTxRows(srcTxs)}</div>
        </div>`;
      }

      const catFiltered = budgetSelectedCategory ? txs.filter(t => effectiveCat(t) === budgetSelectedCategory) : txs;
      const sorted = catFiltered.slice().sort((a, b) => b.date - a.date);
      const txRows = renderTxRows(sorted.slice(0, 200));
      const txTitle = budgetSelectedCategory
        ? `${budgetSelectedCategory} transactions`
        : `Transactions${sorted.length > 200 ? ' (200 most recent)' : ''}`;
      const txPanel = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div class="budget-section-title" style="margin-bottom:0">${txTitle}</div>
        <input type="text" id="txSearch" placeholder="Search narrative or category…" oninput="filterTx(this.value)"
          style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:5px 10px;font-size:12px;color:var(--text-primary);font-family:inherit;width:220px;">
      </div>
      <div class="budget-tx-list" id="txList">${txRows}</div>`;

      const importedFiles = await getImportedFiles();
      const fileList = Object.values(importedFiles).sort((a, b) => a.filename.localeCompare(b.filename));
      const unknownCount = [...new Set(budgetTransactions
        .filter(t => t.debit > 0 && (!t.category || t.category === 'Uncategorised') && !autoCategory(t.narrative))
        .map(t => cleanMerchant(t.narrative)).filter(Boolean)
      )].filter(n => !getMerchantCatCache()[n]).length;
      const classifyBtn = unknownCount > 0
        ? `<button onclick="classifyUnknownMerchants()" style="margin-left:12px;font-size:11px;padding:3px 10px;cursor:pointer;background:var(--accent);color:white;border:none;border-radius:4px">✦ Auto-classify ${unknownCount} merchants</button>`
        : `<span style="margin-left:12px;font-size:11px;color:#16a34a">✓ All merchants categorised</span>`;
      const sourcesHtml = `<div style="padding:10px 16px;background:var(--bg-secondary);border-radius:8px;font-size:11px;color:var(--text-muted);margin-bottom:24px;">
        <strong style="color:var(--text-secondary)">Imported data:</strong>
        ${fileList.map(f => `<span style="margin-left:10px">${f.filename} <span style="opacity:.7">(${f.count} rows · ${new Date(f.importedAt).toLocaleDateString()})</span></span>`).join('')}
        ${classifyBtn}
      </div>`;

      const _balAccounts = budgetSelectedAccount
        ? [budgetSelectedAccount]
        : [...new Set(budgetTransactions.map(t => t.account))].filter(Boolean).sort();
      const balCharts = _balAccounts.map(acc => {
        const accTxs = txs.filter(t => t.account === acc);
        if (accTxs.length < 2) return '';
        const color = acctColor(acc);
        return `<div style="margin-bottom:16px">
          <div style="font-size:11px;font-weight:600;color:${color};margin-bottom:4px;padding-left:4px;border-left:3px solid ${color};padding-left:8px">${acctName(acc)}</div>
          <div style="padding:4px 0">${balanceChartSVG(accTxs)}</div>
        </div>`;
      }).join('');
      const balPanel = sec('bal', 'Running balance', balCharts || noData());

      const recurring = detectRecurring(budgetTransactions);
      const recurHeader = `<div class="budget-bar-row" style="border-bottom:2px solid var(--border-light);padding-bottom:6px;margin-bottom:2px">
        <div style="flex:1;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Name</div>
        <div style="flex:0 0 75px;text-align:right;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Avg/Period</div>
        <div style="flex:0 0 90px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;padding-left:12px">Frequency</div>
        <div style="flex:0 0 130px;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Category</div>
        <div style="flex:0 0 120px;text-align:right;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em">Occurrences</div>
      </div>`;
      const recurRows = recurring.map(r => `<div class="budget-bar-row">
        <div class="budget-bar-label" style="flex:1;min-width:0" title="${r.name}">${r.name}</div>
        <div class="budget-bar-amount">${fmtAUD(r.avgAmt)}</div>
        <div style="flex:0 0 90px;font-size:11px;color:var(--text-muted);padding-left:12px">${r.freq}</div>
        <div style="flex:0 0 130px;font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.category}</div>
        <div style="flex:0 0 120px;text-align:right;font-size:11px;color:var(--text-muted)">${r.count}× · last ${r.lastDate}</div>
      </div>`).join('');
      const recurPanel = sec('recur', 'Recurring payments',
        `<div class="budget-panel-box">${recurring.length ? recurHeader + recurRows : noData()}</div>`,
        `<span style="font-size:11px;font-weight:400;color:var(--text-muted);margin-left:8px">detected from all-time data</span>`);

      // Categories tab: full grid of ALL defined categories, then drill-down
      const catSpendMap = Object.fromEntries(catSpending(txs));
      const allDefinedCats = Object.keys(CAT_COLORS).filter(c => c !== 'Uncategorised' && c !== 'Other');
      const uncatAmt = catSpendMap['Uncategorised'] || 0;
      const catCards = allDefinedCats.map(cat => {
        const amt = catSpendMap[cat] || 0;
        const color = catColor(cat);
        const isSelected = budgetSelectedCategory === cat;
        const esc = cat.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        const txCount = txs.filter(t => effectiveCat(t) === cat).length;
        return `<div onclick="selectCategory('${esc}')" style="cursor:pointer;padding:14px 16px;border-radius:10px;border:2px solid ${isSelected ? color : 'var(--border)'};background:${isSelected ? 'var(--bg-secondary)' : 'var(--bg-primary)'};display:flex;flex-direction:column;gap:6px;transition:border-color .15s">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="width:10px;height:10px;border-radius:50%;background:${color};flex-shrink:0;display:inline-block"></span>
            <span style="font-size:12px;font-weight:600;color:var(--text-primary)">${cat}</span>
          </div>
          <div style="font-size:18px;font-weight:700;color:${amt > 0 ? color : 'var(--text-muted)'}">${amt > 0 ? fmtAUD(amt) : '—'}</div>
          <div style="font-size:11px;color:var(--text-muted)">${txCount > 0 ? txCount + ' transaction' + (txCount > 1 ? 's' : '') : 'no transactions'}</div>
        </div>`;
      }).join('');
      const uncatEsc = 'Uncategorised';
      const uncatCount = txs.filter(t => effectiveCat(t) === 'Uncategorised').length;
      const uncatCard = `<div onclick="selectCategory('${uncatEsc}')" style="cursor:pointer;padding:14px 16px;border-radius:10px;border:2px solid ${budgetSelectedCategory==='Uncategorised'?'#d1d5db':'var(--border)'};background:${budgetSelectedCategory==='Uncategorised'?'var(--bg-secondary)':'var(--bg-primary)'};display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="width:10px;height:10px;border-radius:50%;background:#d1d5db;flex-shrink:0;display:inline-block"></span>
          <span style="font-size:12px;font-weight:600;color:var(--text-primary)">Uncategorised</span>
        </div>
        <div style="font-size:18px;font-weight:700;color:${uncatAmt > 0 ? '#9ca3af' : 'var(--text-muted)'}">${uncatAmt > 0 ? fmtAUD(uncatAmt) : '—'}</div>
        <div style="font-size:11px;color:var(--text-muted)">${uncatCount > 0 ? uncatCount + ' transaction' + (uncatCount > 1 ? 's' : '') : 'no transactions'}</div>
      </div>`;
      const catGrid = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px">${catCards}${uncatCard}</div>`;

      let catTabContent = catGrid;
      if (budgetSelectedCategory) {
        catTabContent += catDrillPanel;
      }

      const tabs = `<div class="budget-tabs">
        <button class="budget-tab${budgetSelectedTab==='overview'?' active':''}" onclick="selectTab('overview')">Overview</button>
        <button class="budget-tab${budgetSelectedTab==='categories'?' active':''}" onclick="selectTab('categories')">Categories</button>
        <button class="budget-tab${budgetSelectedTab==='transactions'?' active':''}" onclick="selectTab('transactions')">Transactions</button>
        <button class="budget-tab${budgetSelectedTab==='trends'?' active':''}" onclick="selectTab('trends')">Trends</button>
        <button class="budget-tab${budgetSelectedTab==='recurring'?' active':''}" onclick="selectTab('recurring')">Recurring</button>
      </div>`;

      document.getElementById('stickyBar').innerHTML = acctSel + yearSel + monthSel + tabs;

      let tabContent = '';
      if (budgetSelectedTab === 'overview') {
        let overviewDrill = '';
        if (budgetSelectedCategory) {
          overviewDrill = catDrillPanel;
        } else if (budgetSelectedIncomeSource) {
          overviewDrill = incDetailPanel;
        }
        tabContent = cards + comparePanel + overviewDrill;
      } else if (budgetSelectedTab === 'categories') {
        tabContent = catTabContent;
      } else if (budgetSelectedTab === 'transactions') {
        tabContent = catDetailPanel + merchPanel + txPanel + sourcesHtml;
      } else if (budgetSelectedTab === 'trends') {
        tabContent = cards + balPanel + annualPanel + trendPanel;
      } else if (budgetSelectedTab === 'recurring') {
        tabContent = recurPanel;
      }

      document.getElementById('budgetContent').innerHTML = tabContent;
    }

    function noData() {
      return '<div style="padding:16px;color:var(--text-muted);font-size:13px;text-align:center">No expenses</div>';
    }

    function renderTxRows(txs) {
      if (!txs.length) return '<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px">No transactions</div>';

      function fmtDateInline(dateStr) {
        const [d, m, y] = dateStr.split('/');
        const dt = new Date(+y, +m - 1, +d);
        return dt.toLocaleDateString('en-AU', { day: 'numeric', month: 'short' });
      }

      return txs.map(t => {
        const merchant = cleanMerchant(t.narrative) || t.narrative;
        const cat = effectiveCat(t);
        const color = catColor(cat);
        const bal = t.balance ? `<div class="budget-tx-balance">${fmtAUD(t.balance)}</div>` : '';
        const narrAttr = t.narrative.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
        let catBadge;
        if (cat === 'Uncategorised') {
          catBadge = `<div class="budget-tx-cat-badge" data-narrative="${narrAttr}" style="background:#D9775720;color:#D97757;border-color:#D9775760;border-style:dashed;cursor:pointer;user-select:none;font-weight:600">+ Categorise</div>`;
        } else {
          catBadge = `<div class="budget-tx-cat-badge" data-narrative="${narrAttr}" style="background:${color}18;color:${color};border-color:${color}40;cursor:pointer;user-select:none">${cat} ▾</div>`;
        }
        return `<div class="budget-tx-row" style="border-left:3px solid ${color}">
          <div class="budget-tx-date">${fmtDateInline(t.dateStr)}</div>
          <div class="budget-tx-merchant" title="${t.narrative}">${merchant}</div>
          ${catBadge}
          <div class="budget-tx-amount ${t.debit > 0 ? 'expense' : 'income'}">${t.debit > 0 ? '−' + fmtAUD(t.debit) : '+' + fmtAUD(t.credit)}</div>
          ${bal}
        </div>`;
      }).join('');
    }

    function filterTx(q) {
      const ql = q.toLowerCase();
      let txs = filtered().slice().sort((a, b) => b.date - a.date);
      if (budgetSelectedCategory) txs = txs.filter(t => effectiveCat(t) === budgetSelectedCategory);
      const rows = q ? txs.filter(t =>
        t.narrative.toLowerCase().includes(ql) || effectiveCat(t).toLowerCase().includes(ql)) : txs;
      document.getElementById('txList').innerHTML = renderTxRows(rows.slice(0, 200));
    }

    function toggleSettings() {
      const p = document.getElementById('settingsPanel');
      p.style.display = p.style.display === 'none' ? '' : 'none';
      if (p.style.display !== 'none') {
        const key = localStorage.getItem('budget_api_key') || '';
        document.getElementById('apiKeyInput').value = key;
      }
    }
    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (val) { localStorage.setItem('budget_api_key', val); showStatus('API key saved'); }
    }
    function clearApiKey() {
      localStorage.removeItem('budget_api_key');
      localStorage.removeItem('budget_merchant_cats');
      document.getElementById('apiKeyInput').value = '';
      showStatus('API key and merchant cache cleared');
      renderBudget();
    }

    function selectTab(tab) { budgetSelectedTab = tab; window.scrollTo({top:0}); renderBudget(); }

    function getCollapsed() {
      try { return new Set(JSON.parse(localStorage.getItem('budget_collapsed') || '[]')); } catch { return new Set(); }
    }
    function toggleSection(id) {
      const s = getCollapsed();
      s.has(id) ? s.delete(id) : s.add(id);
      localStorage.setItem('budget_collapsed', JSON.stringify([...s]));
      const content = document.getElementById('sec-' + id);
      const btn = document.getElementById('tog-' + id);
      if (content) content.style.display = s.has(id) ? 'none' : '';
      if (btn) btn.textContent = s.has(id) ? '›' : '⌄';
    }
    function sec(id, title, content, extraTitleHtml = '') {
      const collapsed = getCollapsed().has(id);
      return `<div style="margin-bottom:24px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${collapsed?'0':'10px'};cursor:pointer" onclick="toggleSection('${id}')">
          <div class="budget-section-title" style="margin-bottom:0">${title}${extraTitleHtml}</div>
          <button id="tog-${id}" style="background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:0 4px;line-height:1">${collapsed ? '›' : '⌄'}</button>
        </div>
        <div id="sec-${id}" style="${collapsed ? 'display:none' : ''}">${content}</div>
      </div>`;
    }
    function selectAccount(acc) { budgetSelectedAccount = acc; budgetSelectedYear = null; budgetSelectedMonth = null; budgetSelectedCategory = null; budgetSelectedIncomeSource = null; window.scrollTo({top:0}); renderBudget(); }
    function selectCategory(cat) {
      budgetSelectedCategory = cat;
      budgetSelectedIncomeSource = null;
      budgetDrillTab = 'transactions';
      if (cat && budgetSelectedTab !== 'categories') budgetSelectedTab = 'categories';
      window.scrollTo({top: 0});
      renderBudget();
    }
    function selectOverviewCategory(cat) {
      budgetSelectedCategory = budgetSelectedCategory === cat ? null : cat;
      budgetSelectedIncomeSource = null;
      budgetDrillTab = 'transactions';
      window.scrollTo({top: 0});
      renderBudget();
    }
    function selectDrillTab(tab) {
      budgetDrillTab = tab;
      renderBudget();
    }
    function selectIncomeSource(src) {
      budgetSelectedIncomeSource = budgetSelectedIncomeSource === src ? null : src;
      budgetSelectedCategory = null;
      window.scrollTo({top: 0});
      renderBudget();
    }

    function selectMonth(m) { budgetSelectedMonth = m; budgetSelectedCategory = null; budgetSelectedIncomeSource = null; window.scrollTo({top:0}); renderBudget(); }
    function selectYear(yr) {
      budgetSelectedYear = yr === null ? null : yr;
      budgetSelectedMonth = null;
      budgetSelectedCategory = null;
      budgetSelectedIncomeSource = null;
      window.scrollTo({top:0});
      renderBudget();
    }

    function setLimit(cat) {
      const cur = budgetLimits[cat] ? budgetLimits[cat].toFixed(2) : '';
      const val = prompt(`Monthly budget limit for "${cat}" in $\n(Leave blank to remove):`, cur);
      if (val === null) return;
      const n = parseFloat(val);
      if (!isNaN(n) && n > 0) { budgetLimits[cat] = n; saveBudgetLimits(); renderBudget(); }
      else if (val.trim() === '') { delete budgetLimits[cat]; saveBudgetLimits(); renderBudget(); }
    }

    window.selectMonth = selectMonth;
    window.selectYear = selectYear;
    window.selectCategory = selectCategory;
    window.selectDrillTab = selectDrillTab;
    window.setLimit = setLimit;
    window.filterTx = filterTx;

    document.addEventListener('click', function(e) {
      const badge = e.target.closest('.budget-tx-cat-badge');
      if (badge) { e.stopPropagation(); openCatDropdown(badge); }
    });

    document.getElementById('importBtn').addEventListener('click', doImport);
    document.getElementById('importBtnLarge').addEventListener('click', doImport);
    document.getElementById('changeFolderBtn').addEventListener('click', changeFolder);
    document.getElementById('resetBtn').addEventListener('click', async () => {
      if (!confirm('Clear all imported data and re-import everything from the folder?')) return;
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction(['transactions', 'imported_files'], 'readwrite');
        tx.objectStore('transactions').clear();
        tx.objectStore('imported_files').clear();
        tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
      });
      localStorage.removeItem('budget_limits');
      budgetTransactions = [];
      budgetLimits = {};
      budgetSelectedMonth = null;
      showStatus('Cleared — re-importing…');
      await doImport();
    });
    document.getElementById('folderInput').addEventListener('change', async function() {
      await importFromFileList(this.files);
      this.value = '';
    });

    // On startup: load from DB, then silently check for new files
    (async () => {
      const txs = (await loadAllTransactions()).filter(t => !EXCLUDED_ACCOUNTS.has(t.account));
      if (txs.length) {
        budgetTransactions = txs;
        const years = [...new Set(txs.map(t => t.month.split('-')[0]))].sort();
        budgetSelectedYear = years[years.length - 1] || null;
        budgetSelectedMonth = null;
        await renderBudget();
      }
      const saved = await getSavedHandle();
      if (saved) showChangeFolderBtn(true);
      await autoCheckNewFiles();
    })();
  </script>
</body>
</html>

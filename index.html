    async function exportAllData() {
      const db = await openDB();
      const transactions = await new Promise((res, rej) => {
        const tx = db.transaction('transactions', 'readonly');
        const req = tx.objectStore('transactions').getAll();
        req.onsuccess = () => res(req.result);
        req.onerror = e => rej(e.target.error);
      });
      const importedFiles = await new Promise((res, rej) => {
        const tx = db.transaction('imported_files', 'readonly');
        const req = tx.objectStore('imported_files').getAll();
        req.onsuccess = () => res(req.result);
        req.onerror = e => rej(e.target.error);
      });
      const ls = {};
      BACKUP_LS_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v != null) ls[k] = v; });
      const backup = { version: 1, exportedAt: new Date().toISOString(), transactions, importedFiles, localStorage: ls };
      const blob = new Blob([JSON.stringify(backup)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `budget-backup-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function importAllData(input) {
      const file = input.files[0];
      if (!file) return;
      input.value = '';
      let backup;
      try { backup = JSON.parse(await file.text()); } catch(e) { showStatus('Could not read backup file: ' + e.message); return; }
      if (!Array.isArray(backup.transactions) || !backup.localStorage) { showStatus('Invalid backup file format'); return; }
      if (!confirm(`Restore ${backup.transactions.length} transactions from ${backup.exportedAt?.slice(0,10) || 'unknown date'}? This will replace ALL current data.`)) return;

      try {
        // Fix dates — JSON serialises Date as string, IDB needs Date objects
        const txsToRestore = backup.transactions.map(t => ({
          ...t,
          date: t.date ? new Date(t.date) : undefined,
        }));
        // Remove the id property — it was the external IDB key, not stored in the value
        txsToRestore.forEach(t => delete t.id);

        const db = await openDB();

        // Restore transactions atomically (clear + add in one transaction)
        await new Promise((res, rej) => {
          const tx = db.transaction('transactions', 'readwrite');
          tx.onerror = e => rej(e.target.error);
          tx.onabort = e => rej(e.target.error);
          tx.oncomplete = res;
          const store = tx.objectStore('transactions');
          store.clear();
          txsToRestore.forEach(t => store.add(t));
        });

        // Restore imported_files atomically
        await new Promise((res, rej) => {
          const tx = db.transaction('imported_files', 'readwrite');
          tx.onerror = e => rej(e.target.error);
          tx.onabort = e => rej(e.target.error);
          tx.oncomplete = res;
          const store = tx.objectStore('imported_files');
          store.clear();
          (backup.importedFiles || []).forEach(f => store.put(
            { ...f, importedAt: f.importedAt ? new Date(f.importedAt) : new Date() },
            f.filename
          ));
        });

        // Restore localStorage only after IDB succeeds
        Object.entries(backup.localStorage).forEach(([k, v]) => localStorage.setItem(k, v));

        _merchantCats = null;
        _vendorDescs = null;
        showStatus('Backup restored — reloading…');
        setTimeout(() => location.reload(), 800);
      } catch(e) {
        showStatus('Restore failed: ' + e.message + ' — your original data is intact');
        console.error('Restore error:', e);
      }
    }

    function exportCSV() {
      const txs = filtered().slice().sort((a, b) => b.date - a.date);

        rows.push([t.dateStr, '"' + t.narrative.replace(/"/g, '""') + '"', '"' + (t.vendor || '').replace(/"/g, '""') + '"', effectiveCat(t), t.debit || '', t.credit || '', t.balance || '', acctName(t.account)]);
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');

      a.download = `budget-${period}.csv`;

    let _ovDragSrc = null;
    function ovDragStart(e) {
      _ovDragSrc = e.currentTarget;
      setTimeout(() => _ovDragSrc && _ovDragSrc.classList.add('ov-dragging'), 0);
      e.dataTransfer.effectAllowed = 'move';
    }
    function ovDragOver(e) {
      e.preventDefault();
      const target = e.currentTarget;
      if (!_ovDragSrc || target === _ovDragSrc) return;
      target.classList.add('ov-drag-over');
      const rect = target.getBoundingClientRect();
      target.parentNode.insertBefore(_ovDragSrc, e.clientY < rect.top + rect.height / 2 ? target : target.nextSibling);
    }
    function ovDragLeave(e) { e.currentTarget.classList.remove('ov-drag-over'); }
    function ovDragEnd(e) {
      if (_ovDragSrc) _ovDragSrc.classList.remove('ov-dragging');
      document.querySelectorAll('.budget-drag-panel').forEach(p => p.classList.remove('ov-drag-over'));
      const order = [...document.querySelectorAll('#overview-panels > .budget-drag-panel')].map(p => p.dataset.panel);

      _ovDragSrc = null;

      const defaultColor = CUSTOM_CAT_PALETTE.find(c => !usedColors.has(c)) || CUSTOM_CAT_PALETTE[0];
      const swatches = CUSTOM_CAT_PALETTE.map(c =>
        `<span data-color="${c}" class="cswatch" onclick="document.querySelectorAll('.cswatch').forEach(s=>s.style.outline='none');this.style.outline='2px solid '+getComputedStyle(document.documentElement).getPropertyValue('--text-primary');document.getElementById('catColorPick').value='${c}'" style="display:inline-block;width:22px;height:22px;border-radius:50%;background:${c};cursor:pointer;flex-shrink:0;${c===defaultColor?'outline:2px solid #141413':''}"></span>`
      ).join('');
      // Build parent options: all non-sub-cat categories
      const subcatParents = getSubcatParents();
      const parentOptions = Object.keys(CAT_COLORS)
        .filter(c => c !== 'Uncategorised' && c !== 'Other' && !subcatParents[c])
        .sort()
        .map(c => `<option value="${c.replace(/"/g, '&quot;')}"${c === defaultParent ? ' selected' : ''}>${c}</option>`)
        .join('');
      const overlay = document.createElement('div');
      overlay.className = 'add-cat-modal';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;display:flex;align-items:center;justify-content:center';
      overlay.innerHTML = `<div style="background:var(--bg-card);border-radius:12px;padding:24px;width:340px;box-shadow:0 8px 40px rgba(0,0,0,.3);font-family:inherit">
        <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:16px">New category</div>
        <div style="margin-bottom:14px">
          <label style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Name</label>
          <input id="catNameInput" type="text" placeholder="e.g. Hobbies" style="width:100%;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text-primary);font-family:inherit;outline:none;box-sizing:border-box">
        </div>
        <div style="margin-bottom:14px">
          <label style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Sub-category of</label>
          <select id="catParentSelect" style="width:100%;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text-primary);font-family:inherit;outline:none;box-sizing:border-box">
            <option value="">— None (top-level category) —</option>
            ${parentOptions}
          </select>
        </div>
        <div style="margin-bottom:20px">
          <label style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:8px">Colour</label>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
            ${swatches}
            <input id="catColorPick" type="color" value="${defaultColor}" title="Custom colour" style="width:22px;height:22px;border:1px solid var(--border);border-radius:50%;cursor:pointer;padding:0;background:none;flex-shrink:0">
          </div>
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button onclick="this.closest('.add-cat-modal').remove()" style="font-size:13px;padding:7px 16px">Cancel</button>
          <button onclick="saveNewCategory()" class="primary" style="font-size:13px;padding:7px 16px">Add category</button>
        </div>
      </div>`;
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);
      const input = document.getElementById('catNameInput');
      input.focus();
      input.addEventListener('keydown', e => { if (e.key === 'Enter') saveNewCategory(); if (e.key === 'Escape') overlay.remove(); });
    }

    function saveNewCategory() {
      const name = (document.getElementById('catNameInput')?.value || '').trim();
      if (!name) { document.getElementById('catNameInput')?.focus(); return; }
      if (CAT_COLORS[name]) { showStatus(`"${name}" already exists`); return; }
      const color = document.getElementById('catColorPick')?.value || CUSTOM_CAT_PALETTE[0];
      const parent = (document.getElementById('catParentSelect')?.value || '').trim();
      document.querySelectorAll('.add-cat-modal').forEach(d => d.remove());
      const custom = getCustomCats();
      custom[name] = color;
      localStorage.setItem('budget_custom_cats', JSON.stringify(custom));
      CAT_COLORS[name] = color;
      if (parent) {
        const sp = getSubcatParents();
        sp[name] = parent;
        localStorage.setItem('budget_subcat_parents', JSON.stringify(sp));
      }
      showStatus(`${parent ? `Sub-category "${name}" added under "${parent}"` : `Category "${name}" added`}`);
      renderBudget();
    }

    let _renamingCat = null;
    let _vendorDescs = null;
    function getVendorDescs() {
      if (!_vendorDescs) try { _vendorDescs = JSON.parse(localStorage.getItem('budget_vendor_descs') || '{}'); } catch { _vendorDescs = {}; }
      return _vendorDescs;
    }
    function setVendorDesc(key, desc) {
      const d = getVendorDescs();
      if (desc) d[key] = desc; else delete d[key];
      localStorage.setItem('budget_vendor_descs', JSON.stringify(d));
    }
    function displayVendor(vendorKey) {
      return getVendorDescs()[vendorKey] || vendorKey;
    }

    let _editingVendorKey = null;
    function showVendorDescModal(vendorKey) {
      document.querySelectorAll('.vendor-desc-modal').forEach(d => d.remove());
      _editingVendorKey = vendorKey;
      const current = getVendorDescs()[vendorKey] || '';
      const overlay = document.createElement('div');
      overlay.className = 'vendor-desc-modal';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;display:flex;align-items:center;justify-content:center';
      overlay.innerHTML = `<div style="background:var(--bg-card);border-radius:12px;padding:24px;width:360px;box-shadow:0 8px 40px rgba(0,0,0,.3);font-family:inherit">
        <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:16px">Label vendor</div>
        <div style="margin-bottom:16px">
          <label style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">🔒 Original name (read-only)</label>
          <div style="background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text-muted);user-select:all">${vendorKey.replace(/</g,'&lt;')}</div>
        </div>
        <div style="margin-bottom:20px">
          <label style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">Display label <span style="font-weight:400">(leave blank to reset)</span></label>
          <input id="vendorDescInput" type="text" value="${current.replace(/"/g,'&quot;')}" placeholder="${vendorKey.replace(/"/g,'&quot;')}"
            style="width:100%;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text-primary);font-family:inherit;outline:none;box-sizing:border-box">
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button onclick="this.closest('.vendor-desc-modal').remove()" style="font-size:13px;padding:7px 16px">Cancel</button>
          <button onclick="saveVendorDesc()" class="primary" style="font-size:13px;padding:7px 16px">Save</button>
        </div>
      </div>`;
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);
      const input = document.getElementById('vendorDescInput');
      input.focus(); input.select();
      input.addEventListener('keydown', e => { if (e.key === 'Enter') saveVendorDesc(); if (e.key === 'Escape') overlay.remove(); });
    }
    function saveVendorDesc() {
      const desc = (document.getElementById('vendorDescInput')?.value || '').trim();
      setVendorDesc(_editingVendorKey, desc);
      document.querySelectorAll('.vendor-desc-modal').forEach(d => d.remove());
      renderBudget();
    }

    function showRenameCategoryModal(cat) {
      document.querySelectorAll('.rename-cat-modal').forEach(d => d.remove());
      _renamingCat = cat;
      const overlay = document.createElement('div');
      overlay.className = 'rename-cat-modal';
      overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10000;display:flex;align-items:center;justify-content:center';
      overlay.innerHTML = `<div style="background:var(--bg-card);border-radius:12px;padding:24px;width:340px;box-shadow:0 8px 40px rgba(0,0,0,.3);font-family:inherit">
        <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:16px">Rename category</div>
        <div style="margin-bottom:20px">
          <label style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:6px">New name</label>
          <input id="catRenameInput" type="text" value="${cat.replace(/"/g, '&quot;')}" style="width:100%;background:var(--bg-secondary);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:13px;color:var(--text-primary);font-family:inherit;outline:none;box-sizing:border-box">
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button onclick="this.closest('.rename-cat-modal').remove()" style="font-size:13px;padding:7px 16px">Cancel</button>
          <button onclick="saveRenameCategory()" class="primary" style="font-size:13px;padding:7px 16px">Rename</button>
        </div>
      </div>`;
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
      document.body.appendChild(overlay);
      const input = document.getElementById('catRenameInput');
      input.focus();
      input.select();
      input.addEventListener('keydown', e => { if (e.key === 'Enter') saveRenameCategory(); if (e.key === 'Escape') overlay.remove(); });
    }

    function saveRenameCategory() {
      const newName = (document.getElementById('catRenameInput')?.value || '').trim();
      const oldName = _renamingCat;
      if (!newName) { document.getElementById('catRenameInput')?.focus(); return; }
      if (newName === oldName) { document.querySelectorAll('.rename-cat-modal').forEach(d => d.remove()); return; }
      if (CAT_COLORS[newName]) { showStatus(`"${newName}" already exists`); return; }
      document.querySelectorAll('.rename-cat-modal').forEach(d => d.remove());
      applyRenameCategory(oldName, newName);
    }

    function applyRenameCategory(oldName, newName) {
      // Update runtime CAT_COLORS
      if (CAT_COLORS[oldName] !== undefined) {
        CAT_COLORS[newName] = CAT_COLORS[oldName];
        delete CAT_COLORS[oldName];
      }
      // Update custom cats storage
      const custom = getCustomCats();
      if (custom[oldName] !== undefined) {
        custom[newName] = custom[oldName];
        delete custom[oldName];
        localStorage.setItem('budget_custom_cats', JSON.stringify(custom));
      }
      // Record rename for built-in cats (effectiveCat remapping) — chain through existing renames
      const renames = getCatRenames();
      // If oldName was itself a rename target, update the chain
      for (const [k, v] of Object.entries(renames)) {
        if (v === oldName) renames[k] = newName;
      }
      renames[oldName] = newName;
      localStorage.setItem('budget_cat_renames', JSON.stringify(renames));
      // Update manual overrides that reference oldName
      const manual = getManualCats();
      let manualChanged = false;
      for (const [k, v] of Object.entries(manual)) {
        if (v === oldName) { manual[k] = newName; manualChanged = true; }
      }
      if (manualChanged) localStorage.setItem('budget_manual_cats', JSON.stringify(manual));
      // Update budget limits
      if (budgetLimits[oldName] !== undefined) {
        budgetLimits[newName] = budgetLimits[oldName];
        delete budgetLimits[oldName];
        saveBudgetLimits();
      }
      // Update exclusions
      if (EXCLUDED_CATS.has(oldName)) {
        EXCLUDED_CATS.delete(oldName);
        EXCLUDED_CATS.add(newName);
        localStorage.setItem('budget_excluded_cats', JSON.stringify([...EXCLUDED_CATS]));
      }
      // Update selected category if needed
      if (budgetSelectedCategory === oldName) budgetSelectedCategory = newName;
      // Update sub-category parent references
      const sp = getSubcatParents();
      let spChanged = false;
      if (sp[oldName] !== undefined) { sp[newName] = sp[oldName]; delete sp[oldName]; spChanged = true; }
      for (const [k, v] of Object.entries(sp)) { if (v === oldName) { sp[k] = newName; spChanged = true; } }
      if (spChanged) localStorage.setItem('budget_subcat_parents', JSON.stringify(sp));
      invalidateCatCache();
      showStatus(`Renamed "${oldName}" → "${newName}"`);
      renderBudget();
    }

    function deleteCat(cat) {
      if (!confirm(`Delete category "${cat}"? This cannot be undone.`)) return;
      // Remove from runtime and custom cats storage
      delete CAT_COLORS[cat];
      const custom = getCustomCats();
      delete custom[cat];
      localStorage.setItem('budget_custom_cats', JSON.stringify(custom));
      // Remove from sub-cat parents (as child or parent)
      const sp = getSubcatParents();
      delete sp[cat];
      for (const [k, v] of Object.entries(sp)) { if (v === cat) delete sp[k]; }
      localStorage.setItem('budget_subcat_parents', JSON.stringify(sp));
      // Remove from other stores
      const renames = getCatRenames();
      for (const [k, v] of Object.entries(renames)) { if (k === cat || v === cat) delete renames[k]; }
      localStorage.setItem('budget_cat_renames', JSON.stringify(renames));
      if (budgetLimits[cat]) { delete budgetLimits[cat]; saveBudgetLimits(); }
      if (EXCLUDED_CATS.has(cat)) { EXCLUDED_CATS.delete(cat); localStorage.setItem('budget_excluded_cats', JSON.stringify([...EXCLUDED_CATS])); }
      if (budgetSelectedCategory === cat) budgetSelectedCategory = null;
      invalidateCatCache();
      showStatus(`Category "${cat}" deleted`);
      renderBudget();
    }

    function setParentCat(cat, parent) {
      const sp = getSubcatParents();
      if (parent) sp[cat] = parent; else delete sp[cat];
      localStorage.setItem('budget_subcat_parents', JSON.stringify(sp));
      showStatus(parent ? `"${cat}" moved under "${parent}"` : `"${cat}" promoted to top-level`);
      renderBudget();
    }

    function openParentPicker(cat, btn) {
      document.querySelectorAll('.parent-picker').forEach(d => d.remove());
      const sp = getSubcatParents();
      const currentParent = sp[cat] || null;
      // Valid parents: top-level cats that aren't this cat or its own children
      const ownChildren = new Set(Object.entries(sp).filter(([,v]) => v === cat).map(([k]) => k));
      const validParents = Object.keys(CAT_COLORS)
        .filter(c => c !== cat && c !== 'Uncategorised' && c !== 'Other' && !sp[c] && !ownChildren.has(c))
        .sort();
      const picker = document.createElement('div');
      picker.className = 'parent-picker';
      picker.style.cssText = 'position:fixed;z-index:9999;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.3);padding:4px;min-width:190px;font-family:inherit;max-height:300px;overflow-y:auto';
      const mkItem = (label, color, isCurrent, onClick) => {
        const el = document.createElement('div');
        el.style.cssText = `padding:6px 10px;cursor:pointer;border-radius:4px;font-size:12px;display:flex;align-items:center;gap:8px;font-weight:${isCurrent?700:400}`;
        el.innerHTML = color
          ? `<span style="width:8px;height:8px;border-radius:50%;background:${color};flex-shrink:0"></span><span style="color:var(--text-primary)">${label}${isCurrent?' ✓':''}</span>`
          : `<span style="color:var(--text-muted)">${label}${isCurrent?' ✓':''}</span>`;
        el.onmouseenter = () => el.style.background = 'var(--bg-secondary)';
        el.onmouseleave = () => el.style.background = '';
        el.onclick = e => { e.stopPropagation(); onClick(); picker.remove(); };
        picker.appendChild(el);
      };
      mkItem('— Top-level (no parent)', null, !currentParent, () => setParentCat(cat, null));
      if (validParents.length) {
        const sep = document.createElement('div');
        sep.style.cssText = 'height:1px;background:var(--border);margin:4px 0';
        picker.appendChild(sep);
        validParents.forEach(p => mkItem(p, catColor(p), currentParent === p, () => setParentCat(cat, p)));
      }
      const rect = btn.getBoundingClientRect();
      picker.style.left = Math.min(rect.left, window.innerWidth - 210) + 'px';
      const spaceBelow = window.innerHeight - rect.bottom;
      if (spaceBelow > 200) { picker.style.top = (rect.bottom + 4) + 'px'; }
      else { picker.style.top = (rect.top - 4) + 'px'; picker.style.transform = 'translateY(-100%)'; }
      document.body.appendChild(picker);
      setTimeout(() => document.addEventListener('click', function c() { picker.remove(); document.removeEventListener('click', c); }, { once: true }), 0);
    }

    async function deleteTx(id) {
      if (!confirm('Delete this transaction? This cannot be undone.')) return;
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction('transactions', 'readwrite');
        tx.objectStore('transactions').delete(id);
        tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
      });
      budgetTransactions = budgetTransactions.filter(t => t.id !== id);
      _recurringCache = null;
      renderBudget();
      showStatus('Transaction deleted');
    }

    window.deleteTx = deleteTx;
    window.selectMonth = selectMonth;
    window.selectBudgetCat = selectBudgetCat;
    window.selectYear = selectYear;
    window.selectCategory = selectCategory;
    window.selectDrillTab = selectDrillTab;
    window.selectBreakdownTab = selectBreakdownTab;
    window.selectDonutCat = selectDonutCat;
    window.toggleTxSelect = toggleTxSelect;
    window.selectAllVisibleTxs = selectAllVisibleTxs;
    window.clearTxSelection = clearTxSelection;
    window.openBulkCatPicker = openBulkCatPicker;
    window.applyBulkCategory = applyBulkCategory;
    function toggleExcludedCat(cat) {
      if (EXCLUDED_CATS.has(cat)) EXCLUDED_CATS.delete(cat);
      else EXCLUDED_CATS.add(cat);
      localStorage.setItem('budget_excluded_cats', JSON.stringify([...EXCLUDED_CATS]));
      renderBudget();
    }

    window.toggleExcludedCat = toggleExcludedCat;
    window.setLimit = setLimit;
    window.filterTx = filterTx;
    window.exportCSV = exportCSV;
    window.exportAllData = exportAllData;
    window.importAllData = importAllData;
    window.showAddCategoryModal = showAddCategoryModal;
    window.saveNewCategory = saveNewCategory;
    window.showRenameCategoryModal = showRenameCategoryModal;
    window.saveRenameCategory = saveRenameCategory;
    window.openParentPicker = openParentPicker;
    window.setParentCat = setParentCat;
    window.deleteCat = deleteCat;
    window.showVendorDescModal = showVendorDescModal;
    window.saveVendorDesc = saveVendorDesc;

    document.addEventListener('click', function(e) {
      const badge = e.target.closest('.budget-tx-cat-badge');
      if (badge) { e.stopPropagation(); openCatDropdown(badge); }
    });

    document.getElementById('importBtn').addEventListener('click', doImport);
    document.getElementById('importBtnLarge').addEventListener('click', doImport);
    document.getElementById('changeFolderBtn').addEventListener('click', changeFolder);
    document.getElementById('resetBtn').addEventListener('click', async () => {
      if (!confirm('Clear all imported data and re-import everything from the folder?')) return;
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction(['transactions', 'imported_files'], 'readwrite');
        tx.objectStore('transactions').clear();
        tx.objectStore('imported_files').clear();
        tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
      });
      localStorage.removeItem('budget_limits');
      budgetTransactions = [];
      budgetLimits = {};
      budgetSelectedMonth = null;
      showStatus('Cleared — re-importing…');
      await doImport();
    });
    document.getElementById('folderInput').addEventListener('change', async function() {
      await importFromFileList(this.files);
      this.value = '';
    });

    // On startup: deduplicate existing DB records, then load
    async function deduplicateDB() {
      const all = await loadAllTransactions();
      const seen = new Set();
      const dupeIds = [];
      for (const t of all) {
        const k = txDedupKey(t);
        if (seen.has(k)) dupeIds.push(t.id);
        else seen.add(k);
      }
      if (!dupeIds.length) return 0;
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction('transactions', 'readwrite');
        const store = tx.objectStore('transactions');
        dupeIds.forEach(id => store.delete(id));
        tx.oncomplete = res; tx.onerror = e => rej(e.target.error);
      });
      return dupeIds.length;
    }

    (async () => {
      const removed = await deduplicateDB();
      const txs = (await loadAllTransactions()).filter(t => !EXCLUDED_ACCOUNTS.has(t.account));
      if (txs.length) {
        budgetTransactions = txs;
        const years = [...new Set(txs.map(t => t.month.split('-')[0]))].sort();
        budgetSelectedYear = years[years.length - 1] || null;
        budgetSelectedMonth = null;
        await renderBudget();
        if (removed > 0) showStatus(`Removed ${removed} duplicate transaction${removed > 1 ? 's' : ''}`);
      }
      const saved = await getSavedHandle();
      if (saved) showChangeFolderBtn(true);
      await autoCheckNewFiles();
    })();
  </script>
